const dimensions = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const dimensionLabels = { A: '外放度', B: '秩序感', C: '锋利度', D: '浪漫度', E: '传统感', F: '感性度', G: '权力感', H: '好奇度' };
const contrast = value => Math.max(1, Math.min(5, 3 + (value - 3) * 6));
const contrasted = profile => Object.fromEntries(dimensions.map(dim => [dim, contrast(profile[dim])]));

function profileFromAnswers(answers) {
  const values = Object.fromEntries(dimensions.map(dim => [dim, []]));
  questions.forEach((question, index) => {
    const selected = question.scoring[answers[index]];
    if (!selected) return;
    Object.entries(selected).forEach(([dimension, value]) => values[dimension].push(value));
  });
  return Object.fromEntries(dimensions.map(dim => {
    const list = values[dim];
    const mean = list.length ? list.reduce((sum, value) => sum + value, 0) / list.length : 3;
    return [dim, Number(mean.toFixed(2))];
  }));
}

function distance(left, right) {
  const a = contrasted(left);
  const b = contrasted(right);
  return Math.sqrt(dimensions.reduce((sum, dim) => sum + (a[dim] - b[dim]) ** 2, 0));
}

function matchScore(rank, current, next) {
  if (rank === 0) return Math.round(Math.max(82, Math.min(96, 92 - Math.min(current, 10) * 0.5)));
  const gap = Math.max(0.05, next - current);
  const value = rank === 1 ? 76 - Math.min(gap * 2.4, 9) : 67 - Math.min(gap * 1.8, 8);
  return Math.round(Math.max(rank === 1 ? 68 : 58, Math.min(rank === 1 ? 84 : 76, value)));
}

function rankBrands(profile) {
  const ranked = brands.map((brand, index) => ({ ...brand, distance: distance(profile, brand.profile), index }))
    .sort((left, right) => left.distance - right.distance || left.index - right.index);
  const topThreeScores = ranked.slice(0, 3).map((brand, index) => matchScore(index, brand.distance, ranked[index + 1]?.distance ?? brand.distance + 1));
  topThreeScores[1] = Math.min(topThreeScores[1], topThreeScores[0] - 4);
  topThreeScores[2] = Math.min(topThreeScores[2], topThreeScores[1] - 4);
  return ranked.map((brand, index) => ({ ...brand, rank: index + 1, displayMatch: index < 3 ? topThreeScores[index] : undefined }));
}

function evaluate(answers) {
  const profile = profileFromAnswers(answers);
  const rankings = rankBrands(profile);
  return { answers, profile, rankings, top: rankings.slice(0, 3) };
}



const app = document.querySelector('#app');
const STORAGE_KEY = 'bridge-luxury-inner-aesthetic-v1';
const letters = ['A', 'B', 'C', 'D'];
let state = loadState();

function loadState() { try { const stored = JSON.parse(localStorage.getItem(STORAGE_KEY)); return { screen: 'intro', index: 0, answers: stored?.answers?.length === questions.length ? [] : (stored?.answers || []) }; } catch { return { screen: 'intro', index: 0, answers: [] }; } }
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* local file origins may deny storage; the session still works */ } }
function resetState() { state = { screen: 'intro', index: 0, answers: [] }; saveState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char])); }
function rich(value) { return escapeHtml(value).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }

function intro() {
  app.innerHTML = `<section class="screen fade-in"><div class="intro"><div class="eyebrow">Inner Aesthetic / 01</div><h1>你的内在气质，<br><em class="serif">更接近哪个奢侈品牌？</em></h1><p class="lead">有时候，你喜欢的品牌和真正像你的品牌，并不是同一个。请选择那个更接近真实的你，而不是“你觉得哪个答案比较高级”。</p><p class="intro-note">如果把你的性格、审美、欲望和生活方式翻译成一种奢侈品牌语言，你会是谁？<br>24 个问题，约 4–6 分钟。</p><button class="button" id="start">开始测试</button></div></section>`;
  document.querySelector('#start').addEventListener('click', () => { state.screen = 'quiz'; state.index = Math.min(state.index || 0, questions.length - 1); saveState(); render(); });
}

function quiz() {
  const question = questions[state.index];
  const answer = state.answers[state.index];
  const progress = Math.round(((state.index + 1) / questions.length) * 100);
  app.innerHTML = `<section class="screen quiz-screen fade-in"><div class="quiz-header"><div><div class="eyebrow progress-percent">${progress}%</div><div class="progress" aria-label="答题进度"><span style="width:${progress}%"></span></div></div><div class="question-count">${String(state.index + 1).padStart(2, '0')}<span style="font-size:15px;color:var(--muted)"> / 24</span></div></div><div class="question-card"><h2>${escapeHtml(question.question)}</h2><div class="options" role="radiogroup" aria-label="选择一个答案">${question.options.map((text, index) => `<button class="option ${answer === index ? 'selected' : ''}" data-option="${index}" role="radio" aria-checked="${answer === index}"><span class="option-letter">${letters[index]}</span><span class="option-text">${escapeHtml(text)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="button secondary" id="back" ${state.index === 0 ? 'disabled' : ''}>上一题</button><button class="button" id="next" disabled>${state.index === questions.length - 1 ? '查看结果' : '下一题'}</button></div></div></section>`;
  const next = document.querySelector('#next');
  document.querySelectorAll('[data-option]').forEach(button => button.addEventListener('click', () => { state.answers[state.index] = Number(button.dataset.option); saveState(); document.querySelectorAll('[data-option]').forEach(item => { const selected = item === button; item.classList.toggle('selected', selected); item.setAttribute('aria-checked', selected); }); next.disabled = false; }));
  next.disabled = answer === undefined;
  next.addEventListener('click', () => { if (state.index === questions.length - 1) { state.screen = 'result'; saveState(); render(); } else { state.index += 1; saveState(); render(); } });
  document.querySelector('#back').addEventListener('click', () => { if (state.index > 0) { state.index -= 1; saveState(); render(); } });
}

function drawRadar(canvas, profile) {
  const ratio = window.devicePixelRatio || 1; const size = 360; canvas.width = size * ratio; canvas.height = size * ratio; const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio); const center = size / 2; const radius = 118; const points = dimensions.length; const angle = index => -Math.PI / 2 + (Math.PI * 2 * index) / points; const point = (index, value) => [center + Math.cos(angle(index)) * radius * ((value - 1) / 4), center + Math.sin(angle(index)) * radius * ((value - 1) / 4)];
  ctx.clearRect(0, 0, size, size); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(60,52,91,.14)'; for (let ring = 1; ring <= 4; ring += 1) { ctx.beginPath(); dimensions.forEach((_, index) => { const [x, y] = point(index, ring + 1); index ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); } dimensions.forEach((dimension, index) => { const [x, y] = point(index, 5); ctx.beginPath(); ctx.moveTo(center, center); ctx.lineTo(x, y); ctx.stroke(); const labelAngle = angle(index); const labelDist = radius + 28; const labelX = center + Math.cos(labelAngle) * labelDist; const labelY = center + Math.sin(labelAngle) * labelDist; ctx.fillStyle = '#655a91'; ctx.font = '11px Manrope'; ctx.textBaseline = 'middle'; if (labelX > center + 5) { ctx.textAlign = 'left'; } else if (labelX < center - 5) { ctx.textAlign = 'right'; } else { ctx.textAlign = 'center'; } ctx.fillText(dimensionLabels[dimension], labelX, labelY); }); ctx.beginPath(); dimensions.forEach((dimension, index) => { const [x, y] = point(index, profile[dimension]); index ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fillStyle = 'rgba(101,90,145,.22)'; ctx.fill(); ctx.strokeStyle = '#655a91'; ctx.lineWidth = 2; ctx.stroke(); dimensions.forEach((dimension, index) => { const [x, y] = point(index, profile[dimension]); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = '#3c345b'; ctx.fill(); });
}

function result() {
  const result = evaluate(state.answers); const [primary, secondary, tertiary] = result.top; const copy = primary.result;
  app.innerHTML = `<section class="results fade-in"><div class="result-hero"><div class="eyebrow">Your result / Inner Aesthetic</div><h1>${escapeHtml(primary.displayName)}</h1><div class="match-line"><span class="match-score">${primary.displayMatch}%</span><span>气质匹配度</span></div><p class="headline">${rich(copy.headline || '')}</p></div><div class="result-layout"><article><section class="copy-section"><h2>你的气质底色</h2><p>${rich(copy.base)}</p></section><section class="copy-section"><h2>你给人的感觉</h2><p>${rich(copy.impression)}</p></section><section class="copy-section"><h2>你真正看重什么</h2><p>${rich(copy.value)}</p></section><section class="copy-section"><h2>你的隐藏矛盾</h2><p>${rich(copy.conflict)}</p></section><div class="conclusion">${rich(copy.conclusion || copy.headline || '')}</div><section class="trait-section"><h2>你的核心人格特质</h2><div class="keyword-list">${(copy.keywords || []).map((item, index) => `<span class="keyword"><small>0${index + 1}</small>${escapeHtml(item)}</span>`).join('')}</div></section></article><aside class="side-sticky"><section class="radar-section"><h2>八维气质轮廓</h2><div class="radar-card"><canvas id="radar" aria-label="八维气质雷达图"></canvas></div></section><section class="other-section"><h2>另外两种潜在气质</h2><div class="other-grid"><div class="other-card"><strong>${escapeHtml(secondary.displayName)}</strong><span>${secondary.displayMatch}%</span></div><div class="other-card"><strong>${escapeHtml(tertiary.displayName)}</strong><span>${tertiary.displayMatch}%</span></div></div></section><section class="share-card" id="share-card"><div class="eyebrow">Bridge / Inner Aesthetic</div><div class="share-brand">内在气质｜${escapeHtml(primary.displayName)}</div><div class="share-copy">${escapeHtml(copy.share || copy.headline || '')}</div></section><div class="result-actions"><button class="button secondary" id="restart">重新测试</button></div></aside></div><p class="disclaimer">本测试为娱乐型自我探索内容，品牌仅作为审美与文化气质的隐喻，与品牌官方无关。</p></section>`;
  drawRadar(document.querySelector('#radar'), result.profile);
  document.querySelector('#restart').addEventListener('click', resetState);
}

function render() { if (state.screen === 'quiz') quiz(); else if (state.screen === 'result' && state.answers.length === questions.length) result(); else intro(); }
render();
