<style>

*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Manrope,"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}

button{font:inherit;touch-action:manipulation} button:focus-visible{outline:2px solid var(--accent);outline-offset:3px} .shell{width:min(calc(100% - 32px),1040px);margin:0 auto} .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 13px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.12em} .type{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--deep);letter-spacing:.06em} .brand{color:var(--deep);font-weight:700;letter-spacing:.2em}
.view{min-height:calc(100svh - 70px);padding:clamp(30px,7vw,72px) 0 70px} .eyebrow{color:var(--deep);font-size:11px;letter-spacing:.22em;text-transform:uppercase} h1,h2,h3,p{margin-top:0} h1,h2,h3{font-family:"Noto Serif SC",serif;font-weight:500} .intro{max-width:760px;display:flex;flex-direction:column;justify-content:center;min-height:calc(100svh - 160px)} .intro h1{font-size:clamp(36px,7vw,74px);line-height:1.12;letter-spacing:-.06em;margin:18px 0 24px} .lead{max-width:600px;color:#4f5a52;font-size:16px;line-height:1.9} .note{max-width:600px;margin:30px 0 0;padding:15px 0 0;border-top:1px solid var(--line);color:#5b625c;font-size:14px;line-height:1.85} .button{min-height:48px;border:1px solid var(--deep);padding:0 25px;background:var(--deep);color:#fff;cursor:pointer;transition:.2s;margin-top:30px} .button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(49,79,67,.16)} .button.secondary{background:transparent;color:var(--deep)} .button:focus-visible{outline:3px solid #b28a55;outline-offset:3px}
.quiz{padding-top:22px} .quiz-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:34px} .progress-area{width:min(100%,360px)} .progress-label{font-size:11px;color:var(--muted);letter-spacing:.1em} .progress{height:3px;background:rgba(49,79,67,.14);margin-top:12px} .progress span{display:block;height:100%;background:linear-gradient(90deg,#7d6a9b,#7caeb2,#7f9d82);transition:width .25s} .count{font:500 34px/1 "Cormorant Garamond",Georgia,serif;color:var(--deep)} .question{max-width:790px;margin:0 auto} .question h2{font-size:clamp(26px,5vw,44px);line-height:1.42;letter-spacing:-.04em;margin:14px 0 30px} .options{display:grid;gap:11px} .option{display:flex;width:100%;gap:14px;align-items:flex-start;text-align:left;min-height:66px;padding:17px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.2s} .option:hover{border-color:var(--accent);transform:translateX(3px)} .option.selected{border-color:var(--deep);background:rgba(215,229,216,.64)} .letter{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border:1px solid rgba(49,79,67,.35);border-radius:50%;font-size:11px;color:var(--deep)} .selected .letter{background:var(--deep);color:white} .option-text{font-size:14px;line-height:1.7} .actions{display:flex;justify-content:space-between;gap:20px;margin-top:28px} .actions .button{min-width:110px;margin-top:0} .actions .button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none} .adaptive-note{max-width:790px;margin:0 auto 24px;padding:13px 15px;border-left:2px solid var(--accent);background:rgba(255,255,255,.42);color:var(--muted);font-size:12px;line-height:1.75}
.result{padding-bottom:96px} .result-inner{width:min(100%,860px);margin:auto} .hero{padding:34px 0 40px;border-bottom:1px solid var(--line)} .hero h1{font-size:clamp(42px,8vw,82px);line-height:1.08;letter-spacing:-.06em;margin:16px 0 4px;color:var(--deep)} .result-subtype{font:500 clamp(25px,4vw,38px)/1.3 "Noto Serif SC",serif;color:#4d5c52} .result-kind{display:block;margin-top:4px;color:#5b625c;font-size:13px;line-height:1.5} .first-line{max-width:750px;margin:26px 0 0;font:500 clamp(20px,3.5vw,31px)/1.65 "Noto Serif SC",serif} .recommend{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0 30px;margin:38px 0} .recommend h2{color:var(--deep);font-size:22px;margin-bottom:7px} .recommend-sub{color:#5b625c;font-size:14px;line-height:1.75;margin-bottom:17px} .perfumes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px} .perfume{padding:18px;border:1px solid rgba(49,79,67,.2);background:linear-gradient(135deg,rgba(238,226,197,.7),rgba(217,231,218,.68))} .perfume:first-child{grid-column:1/-1;background:linear-gradient(120deg,rgba(238,226,197,.88),rgba(217,231,218,.8),rgba(224,219,238,.42))} .perfume-label{color:#314f43;font-size:12px;font-weight:600;line-height:1.6;margin-bottom:8px} .perfume-brand{color:var(--deep);font-size:12px;letter-spacing:.08em;text-transform:uppercase} .perfume-name{font:500 19px "Noto Serif SC",serif;margin-top:5px;line-height:1.5} .perfume-meta{color:#4f5a52;font-size:14px;line-height:1.7;margin-top:8px} .perfume-story{margin-top:13px;padding-top:12px;border-top:1px solid rgba(49,79,67,.16);color:#4f5a52;font-size:14px;line-height:1.85} .perfume-story p{margin:0 0 9px} .perfume-fit{margin-top:12px;color:#334c40;font-size:14px;font-weight:500;line-height:1.85} .radar-section{margin:0 auto 42px;padding:24px;border:1px solid var(--line);background:rgba(255,255,255,.52)} .radar-section h2{font-size:20px;color:var(--deep);margin-bottom:6px} .radar-summary{margin:15px 0 0;color:#46574c;font-size:15px;line-height:1.8} .radar-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px} .radar-tag{padding:7px 12px;border:1px solid rgba(49,79,67,.2);background:linear-gradient(115deg,rgba(238,226,197,.65),rgba(217,231,218,.62));color:#314f43;font-size:13px;line-height:1.5} .radar{width:min(100%,500px);display:block;aspect-ratio:1;margin:auto} .radar-label{font-size:12px;fill:#46574c} .radar-value{font-size:10px;fill:#314f43} .copy{margin-bottom:34px} .copy h2{font-size:20px;color:var(--deep);padding:14px 16px;margin-bottom:18px;border-left:3px solid var(--accent);background:linear-gradient(100deg,rgba(231,220,190,.68),rgba(215,230,214,.48),rgba(224,219,238,.28),transparent)} .copy p{color:#48554c;font-size:16px;line-height:1.9;margin-bottom:12px;white-space:pre-line} .copy-lead{margin:0 0 20px;padding:18px 20px;border-left:2px solid var(--accent);background:linear-gradient(105deg,rgba(231,220,190,.58),rgba(215,230,214,.38),transparent);color:#314f43;font:500 clamp(18px,2.8vw,22px)/1.75 "Noto Serif SC",serif} .copy-tail{margin-top:20px} .hidden-side{padding:24px;border:1px solid rgba(49,79,67,.17);background:linear-gradient(135deg,rgba(231,220,190,.68),rgba(216,231,217,.62),rgba(224,219,238,.34))} .hidden-side h2{font-size:20px;color:var(--deep);line-height:1.6;margin:0 0 8px} .hidden-side h3{font-size:14px;letter-spacing:.08em;color:#46574c;margin:0 0 15px;padding-bottom:13px;border-bottom:1px solid rgba(49,79,67,.18)} .hidden-side p{color:#48554c;font-size:16px;line-height:1.9;margin:0 0 12px} .disclaimer{flex:1 1 280px;margin:0;color:#5b625c;font-size:13px;line-height:1.8} .result-actions{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)} .result-actions .button{margin-top:0} .result-actions .button.secondary{min-height:44px}
.resume{margin-top:24px;padding:16px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.36)} .resume p{margin:0 0 10px;color:#4f5a52;font-size:14px;line-height:1.7} .resume-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap} .resume-actions .button{min-height:44px;margin:0} .text-button{min-height:44px;padding:0 8px;border:0;background:transparent;color:#314f43;text-decoration:underline;text-underline-offset:4px;cursor:pointer} .error-state{max-width:620px;margin:80px auto;padding:24px 0;border-top:1px solid var(--line)} .error-state h1{font-size:28px;color:var(--deep)} .error-state p{color:#4f5a52;font-size:15px;line-height:1.8} .error-state .button{margin-top:12px}
@media(max-width:760px){.shell{width:min(calc(100% - 28px),620px)} .view{padding:22px 0 48px} .intro{min-height:calc(100svh - 135px)} .intro h1{font-size:40px} .lead{font-size:15px} .hero h1{font-size:46px} .question h2{font-size:27px} .radar-section{padding:18px}}
@media(max-width:460px){.topbar{padding-top:11px} .type{font-size:14px} .brand{font-size:10px} .intro{min-height:calc(100svh - 112px)} .intro h1{font-size:36px;margin:14px 0 18px} .lead{font-size:15px;line-height:1.8;margin-bottom:14px} .note{font-size:14px;line-height:1.75;margin-top:18px;padding-top:12px} .intro .button{margin-top:22px} .question h2{font-size:24px;line-height:1.45;margin-bottom:20px} .option{min-height:0;padding:12px} .option-text{font-size:14px;line-height:1.6} .actions{gap:12px;margin-top:19px} .actions .button{min-width:96px;padding:0 15px} .count{font-size:29px} .perfumes{grid-template-columns:1fr} .hero h1{font-size:39px} .result-subtype{font-size:27px} .radar-section{padding:15px} .copy p,.hidden-side p{font-size:15px;line-height:1.9} .copy-lead{padding:15px} .result-actions{gap:12px} .disclaimer{flex-basis:100%}}
</style></head>

<script>const DATA={"version":"V9-WEB-4","questions":[{"id":1,"question":"难得有一天完全没有安排，你最想怎么过？","options":[{"id":"A","text":"临时出门逛逛，天气好就多走一会儿，不一定非要去哪。","family":"柑橘"},{"id":"B","text":"去吃一直想吃的东西，再把自己收拾得舒服一点，好好休息。","family":"美食"},{"id":"C","text":"去公园、郊外或者没走过的地方晃晃，不想安排得太细。","family":"绿叶"},{"id":"D","text":"找个安静的地方待很久，看点东西，想点自己的事。","family":"东方"}]},{"id":2,"question":"有人临时提出一件会打乱你原有安排的事，你第一反应更接近：","options":[{"id":"A","text":"先弄清楚这件事到底多急、要做什么，再决定怎么处理。","family":"芳香"},{"id":"B","text":"看看它会不会影响我原来的安排，再重新调整一下顺序。","family":"木质"},{"id":"C","text":"如果我觉得这个要求明显不合理，我会直接提出来，不会先默认接受。","family":"皮革"},{"id":"D","text":"我会先问清楚对方为什么这样安排、为什么现在提出这个要求，再决定要不要接受。","family":"花香"}]},{"id":3,"question":"你觉得最舒服的亲密关系更像：","options":[{"id":"A","text":"很亲近，但彼此都有自己的时间，不需要什么都一起。","family":"水生"},{"id":"B","text":"答应过的事情会做到，相处久了越来越让人放心。","family":"馥奇"},{"id":"C","text":"两个人在一起总有点新鲜事，会开玩笑，也愿意一起尝试没做过的东西。","family":"果香"},{"id":"D","text":"不急着给彼此下定义，知道人有很多面，也能接受那些矛盾的地方。","family":"西普"}]},{"id":4,"question":"如果让你自己布置一个长期住的家，你更偏向：","options":[{"id":"A","text":"材质耐看、东西不用太多，但每一件都经得住长期使用。","family":"木质"},{"id":"B","text":"空间开阔、干净，东西尽量少，待在里面不会觉得压迫。","family":"水生"},{"id":"C","text":"新旧东西可以放在一起，不需要完全统一，但看久了很有层次。","family":"西普"},{"id":"D","text":"沙发要舒服、灯光要暖，最好一回家就有种“终于回来了”的感觉。","family":"美食"}]},{"id":5,"question":"如果现在突然有几天假，你最容易选哪种旅行？","options":[{"id":"A","text":"去一个天气好的城市，不做太多攻略，每天随便走。","family":"柑橘"},{"id":"B","text":"去山里、乡下或者自然很多的地方，游客少一点更好。","family":"绿叶"},{"id":"C","text":"去一个历史、艺术或文化很丰富的地方，愿意慢慢逛、慢慢看。","family":"东方"},{"id":"D","text":"去一个一直很好奇的地方，多吃、多逛、多体验，行程最好丰富一点。","family":"果香"}]},{"id":6,"question":"长期相处以后，哪种人最容易让你越来越欣赏？","options":[{"id":"A","text":"很会察觉别人的感受，说话也会顾及人。","family":"花香"},{"id":"B","text":"有自己的立场，不会为了让大家满意就一直改变自己。","family":"皮革"},{"id":"C","text":"做事靠谱，不一定会说很多漂亮话，但答应的事基本能做到。","family":"馥奇"},{"id":"D","text":"脑子很清楚，遇到事情不会绕半天，知道自己在说什么。","family":"芳香"}]},{"id":7,"question":"压力一下变得很大时，你通常会：","options":[{"id":"A","text":"先列清楚现在有哪些问题，按重要程度解决。","family":"芳香"},{"id":"B","text":"尽量维持自己的作息和节奏，不让生活完全乱掉。","family":"木质"},{"id":"C","text":"想得比较多，需要自己待一阵，慢慢把事情想明白。","family":"东方"},{"id":"D","text":"暂时少看消息、少见人，让外界安静一点。","family":"水生"}]},{"id":8,"question":"到了一个基本都是陌生人的聚会，你更接近：","options":[{"id":"A","text":"和谁都可以轻松聊两句，不需要马上变得很熟。","family":"柑橘"},{"id":"B","text":"如果遇到有趣的人，我会很自然地聊起来，甚至越聊越兴奋。","family":"果香"},{"id":"C","text":"比起聊很多人，我更容易和一两个真正聊得来的人聊深一点。","family":"花香"},{"id":"D","text":"我可能不会最活跃，但会留意实际的事，比如大家是不是坐得舒服、安排顺不顺。","family":"馥奇"}]},{"id":9,"question":"一个东西不是大家公认的“好看”，什么情况反而会让你喜欢？","options":[{"id":"A","text":"它很自然，没有为了显得精致而修饰太多。","family":"绿叶"},{"id":"B","text":"它有点旧、有痕迹、有自己的脾气，看起来不是完美新品。","family":"皮革"},{"id":"C","text":"第一眼不一定喜欢，但越看越觉得有意思，里面有很多层。","family":"西普"},{"id":"D","text":"它会让我觉得舒服、亲切，看见就心情很好。","family":"美食"}]},{"id":10,"question":"一件让你很失望的事情发生以后，你通常更像：","options":[{"id":"A","text":"先把自己的生活照常过下去，过一段时间自然就消化掉了。","family":"木质"},{"id":"B","text":"我需要真正把难受感受完，或者找一个懂的人说清楚。","family":"花香"},{"id":"C","text":"如果伤得比较重，我以后会自然多留一点防备。","family":"皮革"},{"id":"D","text":"我会反复想这件事里每个人的位置，不太容易只用“谁对谁错”总结。","family":"西普"}]},{"id":11,"question":"一个普通周末，哪种状态最容易让你觉得休息到了？","options":[{"id":"A","text":"出门晒晒太阳、喝点东西，换个地方，人就轻松了。","family":"柑橘"},{"id":"B","text":"吃点喜欢的、睡够、洗澡、看东西，在家舒服地待着。","family":"美食"},{"id":"C","text":"一个人待着，不安排社交，不需要一直回应任何人。","family":"水生"},{"id":"D","text":"去户外走很久，最好有树、有风，也不用一直看手机。","family":"绿叶"}]},{"id":12,"question":"和一个人相处久了，哪一点最容易让你越来越喜欢他？","options":[{"id":"A","text":"他说到做到，遇到事情不会突然消失。","family":"馥奇"},{"id":"B","text":"他遇到问题能讲清楚，不靠猜，也不会一直打太极。","family":"芳香"},{"id":"C","text":"他有自己的精神世界，很多事情可以和他聊得很深。","family":"东方"},{"id":"D","text":"他一直还有好奇心，会发现新东西，也会给生活制造一点乐趣。","family":"果香"}]},{"id":13,"question":"碰到一个很复杂的决定时，你更依赖什么？","options":[{"id":"A","text":"先把事实和利弊列清楚。","family":"芳香"},{"id":"B","text":"接受它可能没有完美答案，再看自己能承担哪一种结果。","family":"西普"},{"id":"C","text":"想清楚哪一个选择对自己真正有意义。","family":"东方"},{"id":"D","text":"先看哪一个方案最实际、最容易真正执行下去。","family":"馥奇"}]},{"id":14,"question":"哪一种时刻最容易让你突然觉得：“今天过得真不错。”","options":[{"id":"A","text":"意外发现一家很好吃的店，买到喜欢的东西，或者遇到一点有趣的小惊喜。","family":"果香"},{"id":"B","text":"天气突然很好，出去走一走，风和阳光都很舒服，整个人一下轻了。","family":"柑橘"},{"id":"C","text":"一件困扰我一阵子的事终于想通了，也更明白自己原来是什么感受。","family":"花香"},{"id":"D","text":"晚上吃得很好、床很舒服、事情也做完了，可以什么都不赶，好好享受剩下的时间。","family":"美食"}]},{"id":15,"question":"哪一种情况最容易让你觉得“这样不行，我得调整”？","options":[{"id":"A","text":"别人越来越习惯随时找我，让我没有自己的时间。","family":"水生"},{"id":"B","text":"外面的事情一直变，连我自己的节奏都被带乱了。","family":"木质"},{"id":"C","text":"周围的人总告诉我“大家都这样”，好像只能按一种方式生活。","family":"绿叶"},{"id":"D","text":"为了维持关系，我发现自己越来越不像自己。","family":"皮革"}]},{"id":16,"question":"如果别人误解了你，你更可能怎么做？","options":[{"id":"A","text":"如果是重要的人，我会想让他知道我真正是什么感受。","family":"花香"},{"id":"B","text":"我会把事实和自己的意思说清楚，免得问题越变越大。","family":"芳香"},{"id":"C","text":"如果这个人对我没那么重要，我未必会花力气解释。","family":"皮革"},{"id":"D","text":"我可能会先拉开一点距离，等自己不那么烦了再决定要不要说。","family":"水生"}]},{"id":17,"question":"如果以后真的过上你想要的生活，你最希望其中有：","options":[{"id":"A","text":"比较稳定的事业和生活节奏，我知道自己能把日子过好。","family":"木质"},{"id":"B","text":"一个舒服的家，有喜欢的人和东西，也有余力享受生活。","family":"美食"},{"id":"C","text":"没有太多不必要的负担，可以随时做一点自己想做的事。","family":"柑橘"},{"id":"D","text":"生活不一定简单，但有品味、有层次，也不会越来越无聊。","family":"西普"}]},{"id":18,"question":"如果生活进入一段特别重复、没什么变化的时期，你更容易：","options":[{"id":"A","text":"主动找点新东西，哪怕只是换一家店、学个小东西，也想增加点新鲜感。","family":"果香"},{"id":"B","text":"干脆换个环境、换种做法，不太想一直照原来的方式来。","family":"绿叶"},{"id":"C","text":"只要这段时间有价值，我可以按部就班把该做的做好。","family":"馥奇"},{"id":"D","text":"我反而可能利用这段安静时间看书、想事情，沉进自己的世界里。","family":"东方"}]},{"id":19,"question":"什么样的工作状态最容易让你进入状态？","options":[{"id":"A","text":"目标比较清楚，我可以分析问题、解决问题。","family":"芳香"},{"id":"B","text":"流程合理、分工清楚，大家都能稳定把事情做好。","family":"馥奇"},{"id":"C","text":"可以长期做深一件事，看着它一点点变得扎实。","family":"木质"},{"id":"D","text":"经常有新东西、新项目，不会一直重复同一套内容。","family":"果香"}]},{"id":20,"question":"下面哪一种审美最容易让你长期喜欢？","options":[{"id":"A","text":"第一眼不一定惊艳，但看久了越来越有层次。","family":"西普"},{"id":"B","text":"有一点锋利、旧感或者不完美，不需要讨所有人喜欢。","family":"皮革"},{"id":"C","text":"细节很多，柔和、精致，但又不是没有力量。","family":"花香"},{"id":"D","text":"有历史、象征或者故事，越了解越觉得有意思。","family":"东方"}]},{"id":21,"question":"最近如果很累，你最希望怎样恢复？","options":[{"id":"A","text":"把社交和消息都减少一点，自己安静一阵。","family":"水生"},{"id":"B","text":"出去走路、晒太阳、接触自然，让身体先松下来。","family":"绿叶"},{"id":"C","text":"吃好一点、睡好一点，让自己舒服几天。","family":"美食"},{"id":"D","text":"换个环境，哪怕只是出去坐坐，也不想继续闷在原来的状态里。","family":"柑橘"}]},{"id":22,"question":"一段关系里真的出现矛盾，你最希望怎么解决？","options":[{"id":"A","text":"把彼此真正介意的地方说出来，不想只解决表面问题。","family":"花香"},{"id":"B","text":"如果情绪太重，我希望先各自安静一下，再继续谈。","family":"水生"},{"id":"C","text":"我会尽量把双方为什么会这样都看进去，不想急着定谁对谁错。","family":"西普"},{"id":"D","text":"最后还是要落到“以后具体怎么做”，不然谈再多也没有用。","family":"馥奇"}]},{"id":23,"question":"一个突然出现的新机会摆在你面前，你更容易因为哪一点决定去试？","options":[{"id":"A","text":"感觉成本不高，试试也没什么，先体验再说。","family":"柑橘"},{"id":"B","text":"一想到它会带来完全新的经历，我就有点兴奋。","family":"果香"},{"id":"C","text":"它虽然不是大家最常选的路，但我觉得这种走法更有意思。","family":"绿叶"},{"id":"D","text":"就算别人不太理解，只要我真的想做，我还是愿意选它。","family":"皮革"}]},{"id":24,"question":"一个人待一整晚，你最容易做什么？","options":[{"id":"A","text":"看书、看电影或者研究一个最近一直在想的问题。","family":"东方"},{"id":"B","text":"收拾东西、做自己的事，把生活重新整理得顺一点。","family":"木质"},{"id":"C","text":"查资料、做计划，或者把最近乱七八糟的想法整理清楚。","family":"芳香"},{"id":"D","text":"做点好吃的、洗澡、躺着，让自己彻底舒服下来。","family":"美食"}]},{"id":25,"question":"下面哪一句夸奖最容易让你真的开心？","options":[{"id":"A","text":"“你这个人很稳，跟你在一起会觉得事情能处理好。”","family":"木质"},{"id":"B","text":"“你真的很会理解人，很多细节你都能感觉到。”","family":"花香"},{"id":"C","text":"“你很有自己的东西，不太会跟着别人跑。”","family":"皮革"},{"id":"D","text":"“跟你待在一起很轻松，不需要想太多。”","family":"柑橘"}]},{"id":26,"question":"如果选朋友，你最看重哪一点？","options":[{"id":"A","text":"真有事的时候找得到他，不是只会说好听的。","family":"馥奇"},{"id":"B","text":"他不会因为关系好，就觉得什么都应该一起做、什么都应该告诉他。","family":"水生"},{"id":"C","text":"和他在一起总有点乐子，也容易发现新鲜东西。","family":"果香"},{"id":"D","text":"很多想法可以聊到比较深，不会一直停在表面。","family":"东方"}]},{"id":27,"question":"下面哪种情况最容易让你长期烦躁？","options":[{"id":"A","text":"所有人都不把话说清楚，一件简单的事绕来绕去。","family":"芳香"},{"id":"B","text":"什么都有固定规矩，连很小的选择都告诉你“应该怎样”。","family":"绿叶"},{"id":"C","text":"别人看问题特别简单，总觉得人不是好就是坏、事不是对就是错。","family":"西普"},{"id":"D","text":"每天只有任务和效率，生活里一点让人舒服的东西都没有。","family":"美食"}]},{"id":28,"question":"如果完全按照自己的方式安排生活，你更希望自己的节奏是：","options":[{"id":"A","text":"我会先抓最重要的事，把顺序理清，其他东西不必安排得特别细。","family":"芳香"},{"id":"B","text":"我不想每天都差不多，生活里最好一直有一点新的东西发生。","family":"果香"},{"id":"C","text":"有时候忙、有时候慢都可以，我不需要自己的生活永远只有一种状态。","family":"西普"},{"id":"D","text":"我更想按自己的状态来，不会因为周围的人都在做什么，就逼自己跟着同一个节奏。","family":"皮革"}]},{"id":29,"question":"在关系里，哪一种体验最容易让你觉得“这个人对我真的很重要”？","options":[{"id":"A","text":"我累的时候，他会主动照顾我，让我不用每件事都自己撑着。","family":"美食"},{"id":"B","text":"我说出来的情绪，他真的能听懂，而不是只想赶快解决。","family":"花香"},{"id":"C","text":"他很亲近我，但也知道什么时候应该给我一点空间。","family":"水生"},{"id":"D","text":"他相信我的判断，不会因为担心我就一直替我做决定。","family":"木质"}]},{"id":30,"question":"如果以后你越来越活成自己，你最希望保留下来的是什么？","options":[{"id":"A","text":"不管多忙，都还能让自己活得轻一点，不是什么事情都往心里压。","family":"柑橘"},{"id":"B","text":"做一个真正靠得住的人，事情交到我手上，别人可以放心。","family":"馥奇"},{"id":"C","text":"不要因为生活越来越现实，就停止思考那些自己真正关心的问题。","family":"东方"},{"id":"D","text":"不要因为年纪、环境或者别人眼里的“应该”，就把自己慢慢活得越来越标准。","family":"绿叶"}]}],"familyCalibrations":[{"families":["木质","水生"],"questions":[{"id":"FC-木质-水生-1","question":"连续忙很久后，什么最让你恢复？","options":[{"id":"A","text":"固定睡觉吃饭做事节奏","family":"木质","signal":"稳定节奏"},{"id":"B","text":"一段时间不用回应任何人","family":"水生","signal":"社交空间"},{"id":"C","text":"又能按自己的判断做决定","family":"木质","signal":"找回主心骨"},{"id":"D","text":"不用一直知道别人怎么想、发生什么","family":"水生","signal":"信息空间"}],"kind":"family-calibration"},{"id":"FC-木质-水生-2","question":"与亲近的人一起生活，最在意什么？","options":[{"id":"A","text":"遇变化也能把日子过稳","family":"木质","signal":"生活稳定"},{"id":"B","text":"不因亲近就什么都必须一起参与","family":"水生","signal":"行动边界"},{"id":"C","text":"双方都有自己坚持的东西","family":"木质","signal":"原则稳定"},{"id":"D","text":"有些情绪想法可以先自己消化","family":"水生","signal":"心理边界"}],"kind":"family-calibration"}]},{"families":["木质","馥奇"],"questions":[{"id":"FC-木质-馥奇-1","question":"长期项目最在意什么？","options":[{"id":"A","text":"能否按自己长期坚持的节奏做","family":"木质","signal":"自己的节奏"},{"id":"B","text":"分工时间要求是否稳定清楚","family":"馥奇","signal":"流程可靠"},{"id":"C","text":"是否值得长期投入","family":"木质","signal":"长期判断"},{"id":"D","text":"一起做事的人是否靠谱","family":"馥奇","signal":"人的可靠"}],"kind":"family-calibration"},{"id":"FC-木质-馥奇-2","question":"越来越信任一个人通常因为？","options":[{"id":"A","text":"状态和判断一直很稳","family":"木质","signal":"内在稳定"},{"id":"B","text":"做事有交代","family":"馥奇","signal":"做事靠谱"},{"id":"C","text":"不因周围人说法轻易改原则","family":"木质","signal":"原则感"},{"id":"D","text":"真遇事能实际帮上忙","family":"馥奇","signal":"实际能力"}],"kind":"family-calibration"}]},{"families":["芳香","馥奇"],"questions":[{"id":"FC-芳香-馥奇-1","question":"第一次遇到完全不熟悉的问题先做什么？","options":[{"id":"A","text":"弄清真正问题在哪里","family":"芳香","signal":"理解原因"},{"id":"B","text":"找验证过的方法先试","family":"馥奇","signal":"成熟方法"},{"id":"C","text":"分清事实和猜测","family":"芳香","signal":"辨别信息"},{"id":"D","text":"看现实条件能做到哪一步","family":"馥奇","signal":"现实条件"}],"kind":"family-calibration"},{"id":"FC-芳香-馥奇-2","question":"什么建议最让你信服？","options":[{"id":"A","text":"原因逻辑讲清楚","family":"芳香","signal":"逻辑"},{"id":"B","text":"对方亲自做过且有效","family":"馥奇","signal":"实践"},{"id":"C","text":"能直接指出问题在哪里","family":"芳香","signal":"抓重点"},{"id":"D","text":"具体到下一步知道怎么做","family":"馥奇","signal":"可执行"}],"kind":"family-calibration"}]},{"families":["芳香","绿叶"],"questions":[{"id":"FC-芳香-绿叶-1","question":"大家沿用一种很麻烦的做法，为什么想改？","options":[{"id":"A","text":"能说清的事被搞复杂","family":"芳香","signal":"复杂低效"},{"id":"B","text":"“以前一直这样”不是理由","family":"绿叶","signal":"不迷信惯例"},{"id":"C","text":"自己都不懂为什么还机械执行","family":"芳香","signal":"缺乏理解"},{"id":"D","text":"更适合自己的方式不该因不合惯例放弃","family":"绿叶","signal":"自己的方式"}],"kind":"family-calibration"},{"id":"FC-芳香-绿叶-2","question":"最反感什么环境？","options":[{"id":"A","text":"信息混乱，问题没人说清","family":"芳香","signal":"信息混乱"},{"id":"B","text":"总有人规定“正常人应该怎样”","family":"绿叶","signal":"统一标准"},{"id":"C","text":"决策靠猜，不确认事实","family":"芳香","signal":"缺乏依据"},{"id":"D","text":"因怕不合群放弃真正想做的事","family":"绿叶","signal":"群体规训"}],"kind":"family-calibration"}]},{"families":["柑橘","绿叶"],"questions":[{"id":"FC-柑橘-绿叶-1","question":"面对大家都很较劲的事，为什么退出？","options":[{"id":"A","text":"太累，不值得继续耗心情","family":"柑橘","signal":"减少负担"},{"id":"B","text":"默认玩法不适合我","family":"绿叶","signal":"拒绝既定玩法"},{"id":"C","text":"不想为了证明什么把事情越做越重","family":"柑橘","signal":"不把事情做重"},{"id":"D","text":"不因大家都这样就跟着走","family":"绿叶","signal":"拒绝从众"}],"kind":"family-calibration"},{"id":"FC-柑橘-绿叶-2","question":"生活多出很多规矩要求，最不舒服什么？","options":[{"id":"A","text":"原本简单的日子变累变麻烦","family":"柑橘","signal":"厌恶负担"},{"id":"B","text":"别人替我定义正确生活方式","family":"绿叶","signal":"抗拒定义"},{"id":"C","text":"不想每天背一堆要求生活","family":"柑橘","signal":"追求轻松"},{"id":"D","text":"不喜欢没有必要的统一标准","family":"绿叶","signal":"反标准化"}],"kind":"family-calibration"}]},{"families":["柑橘","水生"],"questions":[{"id":"FC-柑橘-水生-1","question":"状态闷，怎么缓过来？","options":[{"id":"A","text":"做轻松小事换心情","family":"柑橘","signal":"转换情绪"},{"id":"B","text":"完全属于自己的时间","family":"水生","signal":"社交空间"},{"id":"C","text":"不重要的事先放一放","family":"柑橘","signal":"减轻负担"},{"id":"D","text":"关掉消息和信息","family":"水生","signal":"信息空间"}],"kind":"family-calibration"},{"id":"FC-柑橘-水生-2","question":"和朋友连续待几天后累了，怎么调整？","options":[{"id":"A","text":"剩下安排轻松点","family":"柑橘","signal":"降低强度"},{"id":"B","text":"自己出去走会儿","family":"水生","signal":"行动空间"},{"id":"C","text":"取消部分计划，不硬撑","family":"柑橘","signal":"不为计划增加负担"},{"id":"D","text":"晚上不继续聊天交流","family":"水生","signal":"心理空间"}],"kind":"family-calibration"}]},{"families":["东方","西普"],"questions":[{"id":"FC-东方-西普-1","question":"没有标准答案的事怎么想？","options":[{"id":"A","text":"想知道它对自己意味着什么","family":"东方","signal":"个人意义"},{"id":"B","text":"看不同人的角度","family":"西普","signal":"多重视角"},{"id":"C","text":"放到几年以后看它会怎样改变我","family":"东方","signal":"长期意义"},{"id":"D","text":"接受自己可同时有矛盾感受","family":"西普","signal":"容纳矛盾"}],"kind":"family-calibration"},{"id":"FC-东方-西普-2","question":"什么作品看完还会想很久？","options":[{"id":"A","text":"重新思考自己相信什么","family":"东方","signal":"价值与存在"},{"id":"B","text":"人物没有纯粹好坏","family":"西普","signal":"人物复杂性"},{"id":"C","text":"象征、历史、没直说的东西很多","family":"东方","signal":"隐含意义"},{"id":"D","text":"同时产生几种不同感受","family":"西普","signal":"复杂感受"}],"kind":"family-calibration"}]},{"families":["皮革","西普"],"questions":[{"id":"FC-皮革-西普-1","question":"重要选择不被理解时？","options":[{"id":"A","text":"想清楚并愿承担结果就按自己决定","family":"皮革","signal":"自主决定"},{"id":"B","text":"认真听别人为何不同意","family":"西普","signal":"吸收不同视角"},{"id":"C","text":"不需要说服所有人","family":"皮革","signal":"承受不认同"},{"id":"D","text":"想选择的好处和代价，不急着证明自己对","family":"西普","signal":"接受两面"}],"kind":"family-calibration"},{"id":"FC-皮革-西普-2","question":"复杂的人最让你欣赏哪一点？","options":[{"id":"A","text":"有缺点但不装","family":"皮革","signal":"真实棱角"},{"id":"B","text":"矛盾的地方放一起反而真实","family":"西普","signal":"矛盾共存"},{"id":"C","text":"分歧时明确表达态度","family":"皮革","signal":"明确立场"},{"id":"D","text":"行为放在经历中能理解","family":"西普","signal":"理解复杂背景"}],"kind":"family-calibration"}]},{"families":["果香","花香"],"questions":[{"id":"FC-果香-花香-1","question":"什么好事会让你好几天都开心？","options":[{"id":"A","text":"临时去很好玩的地方，很多小惊喜","family":"果香","signal":"意外体验"},{"id":"B","text":"与重要的人把心里很久的事说开","family":"花香","signal":"关系连接"},{"id":"C","text":"突然发现特别喜欢的新东西","family":"果香","signal":"新兴趣"},{"id":"D","text":"有人记住很小的习惯情绪","family":"花香","signal":"被细致理解"}],"kind":"family-calibration"},{"id":"FC-果香-花香-2","question":"生活平淡时最想补什么？","options":[{"id":"A","text":"一件新的事情可期待","family":"果香","signal":"期待感"},{"id":"B","text":"真正能触动自己的东西","family":"花香","signal":"情绪共鸣"},{"id":"C","text":"多一点临时起意和好玩的事","family":"果香","signal":"即兴快乐"},{"id":"D","text":"有人能认真聊感受","family":"花香","signal":"深度连接"}],"kind":"family-calibration"}]},{"families":["果香","美食"],"questions":[{"id":"FC-果香-美食-1","question":"累的事情终于结束，如何奖励自己？","options":[{"id":"A","text":"做没体验过的事","family":"果香","signal":"新体验"},{"id":"B","text":"吃想吃的、回家舒服到底","family":"美食","signal":"身体满足"},{"id":"C","text":"找人出去玩、切换状态","family":"果香","signal":"分享快乐"},{"id":"D","text":"买能长期提升舒服程度的东西","family":"美食","signal":"日常享受"}],"kind":"family-calibration"},{"id":"FC-果香-美食-2","question":"突然多出一笔可自由花的钱？","options":[{"id":"A","text":"拿来体验没做过的东西","family":"果香","signal":"体验"},{"id":"B","text":"升级每天都会用的东西","family":"美食","signal":"日常舒适"},{"id":"C","text":"制造开心和新鲜回忆","family":"果香","signal":"新鲜记忆"},{"id":"D","text":"让日常过得更好","family":"美食","signal":"长期舒服"}],"kind":"family-calibration"}]}],"subtypeQuestions":{"木质":{"base":[{"id":"SB-木质-W1","question":"如果你进入一段持续比较久的低谷，下面哪一种方式最像你慢慢恢复的过程？","options":[{"id":"A","text":"我不会要求自己马上恢复正常，会先把最基本的生活维持住，状态通常会一点点回来。","subtype":"香根草","signal":"韧性、恢复"},{"id":"B","text":"我会先弄清楚到底哪些事情还能改变、哪些已经改变不了，再重新安排接下来怎么过。","subtype":"雪松","signal":"结构、判断"},{"id":"C","text":"我会主动降低对自己的要求，先吃好、睡好，也允许自己暂时没那么能干。","subtype":"檀香","signal":"温和承接"},{"id":"D","text":"我会承认自己现在可能很烦、很不甘心，甚至有一些不太好看的情绪，不急着把它们赶走。","subtype":"广藿香","signal":"接纳复杂情绪"},{"id":"E","text":"我通常不会急着找很多人说，更想自己安静一阵，只和很信任的人保持联系。","subtype":"沉香","signal":"谨慎开放"}],"kind":"subtype-base"},{"id":"SB-木质-W2","question":"如果几年后的你比现在更成熟，你最希望自己多拥有下面哪一种能力？","options":[{"id":"A","text":"经历很大的变化以后，仍然能慢慢重新把自己的生活建立起来。","subtype":"香根草","signal":"重新扎根"},{"id":"B","text":"越来越知道什么值得花时间，什么事情可以直接拒绝，不再什么都往自己身上揽。","subtype":"雪松","signal":"判断与边界"},{"id":"C","text":"不需要一直逼自己坚强，自己状态好的时候，也有余力让身边重要的人觉得安心。","subtype":"檀香","signal":"柔和稳定"},{"id":"D","text":"更能接受自己其实也会嫉妒、冲动、矛盾或者做错选择，不再要求自己永远漂亮正确。","subtype":"广藿香","signal":"接纳人的复杂"},{"id":"E","text":"不再因为别人想了解我，就觉得自己必须把所有想法和经历都解释清楚。","subtype":"沉香","signal":"保留自我"}],"kind":"subtype-base"}],"pairs":{"雪松|香根草":{"id":"SP-木质-雪松|香根草","question":"当生活突然出现很大的变化，你最希望自己首先做到哪件事？","options":[{"id":"A","text":"就算一开始很乱，也不要因为暂时失去状态就否定自己，给自己一点时间重新适应。","subtype":"香根草","signal":"适应变化"},{"id":"B","text":"先确定接下来最重要的三两件事，其他东西暂时放下。","subtype":"雪松","signal":"建立优先级"},{"id":"C","text":"即使原来的计划全部失效，我也相信自己最后还是能重新找到生活的节奏。","subtype":"香根草","signal":"恢复信心"},{"id":"D","text":"越是混乱的时候，我越需要把界限划清楚，知道现在什么该管、什么先别管。","subtype":"雪松","signal":"建立边界"}],"kind":"subtype-pair"},"檀香|香根草":{"id":"SP-木质-檀香|香根草","question":"最近已经很累，但手上还有不少事情，你更希望自己怎么处理？","options":[{"id":"A","text":"先保证最基本的事情不掉下来，状态差几天也不用太慌。","subtype":"香根草","signal":"低谷耐受"},{"id":"B","text":"主动取消一些没那么重要的安排，让自己先真正休息。","subtype":"檀香","signal":"主动照顾自己"},{"id":"C","text":"不因为这几天效率下降，就怀疑自己是不是已经不行了。","subtype":"香根草","signal":"对自身恢复力的信任"},{"id":"D","text":"如果真的撑不住，我愿意让身边可信的人帮我分担一点。","subtype":"檀香","signal":"接受他人照顾"}],"kind":"subtype-pair"},"广藿香|香根草":{"id":"SP-木质-广藿香|香根草","question":"一件很大的失败发生以后，哪一种成长对你更重要？","options":[{"id":"A","text":"即使这次失败很重，我最后还是能重新开始。","subtype":"香根草","signal":"重新站起来"},{"id":"B","text":"我能诚实承认，当时自己也有贪心、嫉妒、不甘或者冲动的一面。","subtype":"广藿香","signal":"面对真实动机"},{"id":"C","text":"以后再遇到类似打击，我不会因为一次失败就彻底否定自己。","subtype":"香根草","signal":"抗打击能力"},{"id":"D","text":"我对人的判断会更宽一点，不再觉得一个错误就能说明一个人全部是什么样。","subtype":"广藿香","signal":"理解人性复杂"}],"kind":"subtype-pair"},"沉香|香根草":{"id":"SP-木质-沉香|香根草","question":"当你经历一件非常消耗自己的事，你更看重哪一种处理能力？","options":[{"id":"A","text":"即使生活被打乱，我最后还是能慢慢找到新的节奏。","subtype":"香根草","signal":"重新适应"},{"id":"B","text":"在自己还没想清楚以前，我不想被很多人追问发生了什么。","subtype":"沉香","signal":"整理空间"},{"id":"C","text":"我希望经历过以后，自己不是变得更脆弱，而是更知道怎么撑过困难。","subtype":"香根草","signal":"形成韧性"},{"id":"D","text":"有些经历对我来说非常私人，我并不认为关系亲近就一定要全部分享。","subtype":"沉香","signal":"隐私保留"}],"kind":"subtype-pair"},"檀香|雪松":{"id":"SP-木质-檀香|雪松","question":"朋友遇到很大的麻烦来找你，你更自然的反应是：","options":[{"id":"A","text":"先和他一起理清现在到底有几个问题，哪个最需要先处理。","subtype":"雪松","signal":"理清结构"},{"id":"B","text":"如果他已经快撑不住了，我会先让他缓下来，不急着马上谈解决方案。","subtype":"檀香","signal":"情绪承接"},{"id":"C","text":"如果有些责任根本不该由他一个人承担，我会直接提醒他把能放下的放下。","subtype":"雪松","signal":"判断责任"},{"id":"D","text":"有时候我会觉得，陪他吃顿饭、睡一觉、恢复一点精神，本身就已经很重要。","subtype":"檀香","signal":"身体与生活照顾"}],"kind":"subtype-pair"},"广藿香|雪松":{"id":"SP-木质-广藿香|雪松","question":"发现自己做了一个并不光彩的决定以后，你更容易怎么处理？","options":[{"id":"A","text":"把当时的信息和判断重新过一遍，看看具体错在了哪里。","subtype":"雪松","signal":"复盘判断"},{"id":"B","text":"我会逼自己诚实一点：当时是不是确实有一些不太体面的私心。","subtype":"广藿香","signal":"承认欲望"},{"id":"C","text":"我会重新想清楚自己的底线，以后遇到类似情况什么不能再做。","subtype":"雪松","signal":"重建原则"},{"id":"D","text":"我不会因为这一次做错，就把自己简单定义成一个“坏的人”。","subtype":"广藿香","signal":"接纳复杂自我"}],"kind":"subtype-pair"},"沉香|雪松":{"id":"SP-木质-沉香|雪松","question":"和一个人关系越来越近时，什么最能决定你会不会继续靠近？","options":[{"id":"A","text":"他能不能尊重我明确说过的“不”，不会反复试探我的底线。","subtype":"雪松","signal":"规则边界"},{"id":"B","text":"时间够不够长。对我来说，很多信任就是需要相处久了才会有。","subtype":"沉香","signal":"信任速度"},{"id":"C","text":"遇到分歧时，我们能不能把彼此的责任和需求说清楚，而不是一直靠猜。","subtype":"雪松","signal":"关系结构"},{"id":"D","text":"即使关系很好，我也希望保留一部分只属于自己的经历、想法和生活。","subtype":"沉香","signal":"私人保留"}],"kind":"subtype-pair"},"广藿香|檀香":{"id":"SP-木质-广藿香|檀香","question":"一个很重要的人突然表现出你以前完全不知道的一面，你更接近：","options":[{"id":"A","text":"我会先看他现在是不是很难受，不想在情绪最重的时候马上做判断。","subtype":"檀香","signal":"先承接情绪"},{"id":"B","text":"我会好奇这一面为什么会出现，它背后是不是还有我以前不知道的东西。","subtype":"广藿香","signal":"探索复杂"},{"id":"C","text":"如果关系对我重要，我会尽量让谈话保持在还能继续沟通的程度，不想互相伤得更重。","subtype":"檀香","signal":"维护关系温度"},{"id":"D","text":"只要没有触碰我的底线，我能接受一个人身上有一些不那么漂亮甚至彼此矛盾的部分。","subtype":"广藿香","signal":"容纳不完美"}],"kind":"subtype-pair"},"檀香|沉香":{"id":"SP-木质-檀香|沉香","question":"当你和一个人真正变得很亲近以后，你更希望关系里保留什么？","options":[{"id":"A","text":"在对方很累的时候，我能让他觉得跟我待在一起不需要继续硬撑。","subtype":"檀香","signal":"给予放松"},{"id":"B","text":"即使关系很好，也不用所有过去和经历都交代得一清二楚。","subtype":"沉香","signal":"经历保留"},{"id":"C","text":"日常里能互相照顾一点，比如记得对方累不累、有没有好好吃饭。","subtype":"檀香","signal":"生活照顾"},{"id":"D","text":"有些想法我需要自己慢慢想明白，不一定第一时间拿出来讨论。","subtype":"沉香","signal":"思考空间"}],"kind":"subtype-pair"},"广藿香|沉香":{"id":"SP-木质-广藿香|沉香","question":"面对自己一些很复杂、甚至不太愿意让别人知道的部分，你更接近：","options":[{"id":"A","text":"我很想弄懂它为什么会出现，即使答案可能并不好看。","subtype":"广藿香","signal":"探索自己"},{"id":"B","text":"我可以接受它存在，但不觉得了解我的人就一定有权知道这些。","subtype":"沉香","signal":"信息所有权"},{"id":"C","text":"如果它影响了我的选择和关系，我愿意正视它，而不是装作没这回事。","subtype":"广藿香","signal":"面对影响"},{"id":"D","text":"我更习惯先自己处理，什么时候要不要告诉别人，由我自己决定。","subtype":"沉香","signal":"开放节奏"}],"kind":"subtype-pair"}}},"柑橘":{"base":[{"id":"SB-柑橘-C1","question":"最近事情很多时，什么最能帮助你保持一个比较好的状态？","options":[{"id":"A","text":"越忙越不想让自己显得慌乱，该做的做，但尽量保持自己的节奏和体面。","subtype":"佛手柑","signal":"从容感"},{"id":"B","text":"把那些明明不重要、只是不好意思拒绝的事情直接减掉。","subtype":"葡萄柚","signal":"筛掉无意义负担"},{"id":"C","text":"小事情能当天解决就当天解决，我不喜欢它们一直挂在那里。","subtype":"柠檬","signal":"快速清理"},{"id":"D","text":"再忙也想给自己留一点开心的东西，比如吃点喜欢的、出去走走。","subtype":"柑橘","signal":"日常快乐"}],"kind":"subtype-base"},{"id":"SB-柑橘-C2","question":"你希望自己越来越成熟以后，仍然保留哪一种状态？","options":[{"id":"A","text":"放松归放松，但做事、说话还是有自己的分寸。","subtype":"佛手柑","signal":"轻盈与分寸"},{"id":"B","text":"越来越敢承认“不喜欢就是不喜欢”，不为了好看把所有话都说得很圆。","subtype":"葡萄柚","signal":"诚实判断"},{"id":"C","text":"遇到问题时不把事情想得越来越复杂，能解决就解决，解决不了就先放下。","subtype":"柠檬","signal":"简单处理"},{"id":"D","text":"哪怕日子很普通，也一直有能力因为一些小事情真的开心。","subtype":"柑橘","signal":"简单满足"}],"kind":"subtype-base"}],"pairs":{"佛手柑|葡萄柚":{"id":"SP-柑橘-佛手柑|葡萄柚","question":"和别人出现明确意见分歧时，你更接近哪种表达？","options":[{"id":"A","text":"我会把不同意见说清楚，但尽量不让对方觉得被攻击。","subtype":"佛手柑","signal":"表达分寸"},{"id":"B","text":"如果我真的认为对方错了，我不会为了气氛好就假装认同。","subtype":"葡萄柚","signal":"坚持判断"},{"id":"C","text":"我会注意什么时候说、怎么说，不觉得“真实”就等于什么都直接丢出去。","subtype":"佛手柑","signal":"场合判断"},{"id":"D","text":"就算最后不能达成一致，我也宁愿彼此把真实立场摆出来。","subtype":"葡萄柚","signal":"偏好真实"}],"kind":"subtype-pair"},"佛手柑|柠檬":{"id":"SP-柑橘-佛手柑|柠檬","question":"一件事情需要尽快完成时，你最在意什么？","options":[{"id":"A","text":"赶时间也希望最后交出来的东西是完整、得体的。","subtype":"佛手柑","signal":"完成质量"},{"id":"B","text":"能三步解决的问题，我不想因为流程复杂变成十步。","subtype":"柠檬","signal":"效率"},{"id":"C","text":"我会提前整理好顺序，尽量避免最后弄得特别慌乱。","subtype":"佛手柑","signal":"过程从容"},{"id":"D","text":"小问题出现以后最好马上解决，我不喜欢一直挂着。","subtype":"柠檬","signal":"快速清理"}],"kind":"subtype-pair"},"佛手柑|柑橘":{"id":"SP-柑橘-佛手柑|柑橘","question":"一个完全属于自己的下午，你怎么安排最舒服？","options":[{"id":"A","text":"找个环境舒服、细节也让我喜欢的地方慢慢待着。","subtype":"佛手柑","signal":"有质感的松弛"},{"id":"B","text":"和熟悉的人随便吃点、逛逛，不需要特别安排也会很开心。","subtype":"柑橘","signal":"日常快乐"},{"id":"C","text":"即使休息，我还是喜欢时间大概有个安排，不想最后乱成一团。","subtype":"佛手柑","signal":"有序放松"},{"id":"D","text":"天气不错、东西好吃、心情轻松，对我来说就已经很够了。","subtype":"柑橘","signal":"简单满足"}],"kind":"subtype-pair"},"柠檬|葡萄柚":{"id":"SP-柑橘-柠檬|葡萄柚","question":"一个合作里出现明显问题，你最容易先做什么？","options":[{"id":"A","text":"如果我觉得某个判断本身不对，我会直接把不同意见提出来。","subtype":"葡萄柚","signal":"判断锋利"},{"id":"B","text":"先看看哪个环节可以马上改，不想让问题继续拖着。","subtype":"柠檬","signal":"快速处理"},{"id":"C","text":"如果大家都在说很圆的话，我反而会想把真正的问题点出来。","subtype":"葡萄柚","signal":"拒绝敷衍"},{"id":"D","text":"处理完以后我通常会往下走，不太喜欢反复追究已经解决的部分。","subtype":"柠檬","signal":"快速翻篇"}],"kind":"subtype-pair"},"柑橘|葡萄柚":{"id":"SP-柑橘-柑橘|葡萄柚","question":"和一群朋友出去玩时，什么最影响你的体验？","options":[{"id":"A","text":"大家开心当然重要，但如果安排明显不合我胃口，我还是会说自己的想法。","subtype":"葡萄柚","signal":"保留个人判断"},{"id":"B","text":"只要大家状态都轻松、气氛好，就算安排普通一点我也能玩得开心。","subtype":"柑橘","signal":"气氛感染"},{"id":"C","text":"我不喜欢为了“别扫兴”而一直配合自己根本不想做的事。","subtype":"葡萄柚","signal":"不勉强自己"},{"id":"D","text":"有时候事情本身没那么重要，大家一起笑得开心就已经很好。","subtype":"柑橘","signal":"共享快乐"}],"kind":"subtype-pair"},"柑橘|柠檬":{"id":"SP-柑橘-柑橘|柠檬","question":"一天下来，哪种情况最容易让你觉得“今天状态不错”？","options":[{"id":"A","text":"处理掉了好几件一直拖着的小事，脑子一下清爽很多。","subtype":"柠檬","signal":"完成感"},{"id":"B","text":"没做什么大事，但天气、吃饭和心情都很好。","subtype":"柑橘","signal":"享受当下"},{"id":"C","text":"原本烦我的问题终于知道下一步该怎么办了。","subtype":"柠檬","signal":"找到解决路径"},{"id":"D","text":"和喜欢的人出去玩了一会儿，烦心事虽然还在，但心情已经好多了。","subtype":"柑橘","signal":"情绪回弹"}],"kind":"subtype-pair"}}},"果香":{"base":[{"id":"SB-果香-F1","question":"如果最近生活有点无聊，哪一种变化最容易让你重新有精神？","options":[{"id":"A","text":"发现一个很特别、甚至有点小众的新东西，我会忍不住研究它。","subtype":"黑加仑","signal":"独特兴趣"},{"id":"B","text":"临时起意做点没安排过的事情，过程好不好都觉得挺有意思。","subtype":"莓果","signal":"即兴玩心"},{"id":"C","text":"出现一个让我特别期待的人或事情，想到它都会有明显情绪。","subtype":"樱桃","signal":"强烈期待"},{"id":"D","text":"和喜欢的人认真吃顿饭、逛很久、聊很久，我会觉得生活重新有感觉了。","subtype":"桃李","signal":"亲密体验"},{"id":"E","text":"直接安排一次旅行、活动或者以前没体验过的东西，我需要更明显的刺激。","subtype":"热带果","signal":"体验强度"}],"kind":"subtype-base"},{"id":"SB-果香-F2","question":"你最不想随着年龄增长而失去哪一种东西？","options":[{"id":"A","text":"对细节的敏感，还有看出“这里有点不对”的能力。","subtype":"黑加仑","signal":"敏锐判断"},{"id":"B","text":"偶尔可以不那么成熟，想到什么好玩的就真的去做。","subtype":"莓果","signal":"童心玩性"},{"id":"C","text":"对真正喜欢的东西仍然有很明确、很强烈的感觉。","subtype":"樱桃","signal":"强烈偏爱"},{"id":"D","text":"还能自然地表达亲近、依赖和柔软，而不是越来越客气。","subtype":"桃李","signal":"亲密能力"},{"id":"E","text":"看到新的世界、新的生活方式时，还会真的兴奋和想尝试。","subtype":"热带果","signal":"探索热情"}],"kind":"subtype-base"}],"pairs":{"莓果|黑加仑":{"id":"SP-果香-莓果|黑加仑","question":"突然对一个新东西产生兴趣以后，你通常更像：","options":[{"id":"A","text":"会先注意它到底特别在哪里，为什么和其他东西不一样。","subtype":"黑加仑","signal":"辨别独特性"},{"id":"B","text":"很快就想亲自玩玩看，不太在意一开始懂不懂。","subtype":"莓果","signal":"即兴尝试"},{"id":"C","text":"我会留意很多细节，很快形成自己喜不喜欢的判断。","subtype":"黑加仑","signal":"敏锐判断"},{"id":"D","text":"只要过程好玩，就算最后没研究出什么结果也没关系。","subtype":"莓果","signal":"过程快乐"}],"kind":"subtype-pair"},"樱桃|黑加仑":{"id":"SP-果香-樱桃|黑加仑","question":"真正喜欢上一个人或一件事以后，你更接近：","options":[{"id":"A","text":"很喜欢，但我还是会留意其中有没有什么让我不舒服的地方。","subtype":"黑加仑","signal":"感情中的判断"},{"id":"B","text":"如果真的很喜欢，我通常很难把这件事表现得完全无所谓。","subtype":"樱桃","signal":"情绪强度"},{"id":"C","text":"我很容易察觉对方态度里细微的变化。","subtype":"黑加仑","signal":"关系敏锐"},{"id":"D","text":"比起“它是不是最适合我”，我有时更在意“我到底想不想要”。","subtype":"樱桃","signal":"欲望明确"}],"kind":"subtype-pair"},"桃李|黑加仑":{"id":"SP-果香-桃李|黑加仑","question":"和一个人越来越熟以后，哪种变化最容易让你意识到“我们真的变亲近了”？","options":[{"id":"A","text":"我越来越能察觉他语气和状态里很小的变化。","subtype":"黑加仑","signal":"敏锐感知"},{"id":"B","text":"两个人会自然记住彼此很多生活小习惯。","subtype":"桃李","signal":"日常亲密"},{"id":"C","text":"我越来越知道什么时候他说“没事”其实并不是真的没事。","subtype":"黑加仑","signal":"读懂细微信号"},{"id":"D","text":"两个人即使什么都不特别做，也能很放松地待在一起。","subtype":"桃李","signal":"身体与情绪舒适"}],"kind":"subtype-pair"},"热带果|黑加仑":{"id":"SP-果香-热带果|黑加仑","question":"遇到一个完全陌生的新领域，你更容易因为什么想深入了解？","options":[{"id":"A","text":"它本身非常特别，和我平时见过的东西明显不一样。","subtype":"黑加仑","signal":"独特性吸引"},{"id":"B","text":"一想到可以亲自去体验，我就很想试一次。","subtype":"热带果","signal":"行动体验"},{"id":"C","text":"它有一点奇怪甚至小众，反而让我更好奇。","subtype":"黑加仑","signal":"非主流兴趣"},{"id":"D","text":"我很想看看真正进入那个环境以后，会不会打开一种新的生活方式。","subtype":"热带果","signal":"拓宽体验"}],"kind":"subtype-pair"},"樱桃|莓果":{"id":"SP-果香-樱桃|莓果","question":"生活里出现一件让你特别开心的事情时，你通常更像：","options":[{"id":"A","text":"开心来得很自然，很快就想和别人分享、一起玩。","subtype":"莓果","signal":"轻快快乐"},{"id":"B","text":"如果这件事对我真的很重要，那种兴奋会持续很久。","subtype":"樱桃","signal":"情绪浓度"},{"id":"C","text":"我会顺着这个好心情临时再做点别的好玩的事。","subtype":"莓果","signal":"即兴延展"},{"id":"D","text":"越是特别想要的东西，我越难用“算了”让自己轻轻放下。","subtype":"樱桃","signal":"欲望持续"}],"kind":"subtype-pair"},"桃李|莓果":{"id":"SP-果香-桃李|莓果","question":"和很熟的人一起度过一个周末，你最喜欢哪种相处？","options":[{"id":"A","text":"临时想到什么就一起去做，没什么目的也可以玩得很开心。","subtype":"莓果","signal":"共同玩乐"},{"id":"B","text":"两个人慢慢吃饭、散步、待着，即使没什么活动也很舒服。","subtype":"桃李","signal":"安静亲密"},{"id":"C","text":"可以一起犯点傻、开玩笑，不需要一直表现得很成熟。","subtype":"莓果","signal":"自然玩心"},{"id":"D","text":"我会很享受那些照顾彼此的小细节，比如顺手记住对方喜欢什么。","subtype":"桃李","signal":"细节亲密"}],"kind":"subtype-pair"},"热带果|莓果":{"id":"SP-果香-热带果|莓果","question":"如果突然多出三天完整假期，你更容易怎么安排？","options":[{"id":"A","text":"不做太多计划，到了当地再临时决定今天想干什么。","subtype":"莓果","signal":"随兴体验"},{"id":"B","text":"我会想趁三天真正去一个和平时生活明显不一样的地方。","subtype":"热带果","signal":"体验幅度"},{"id":"C","text":"行程里留很多空白，有意外发生反而更有意思。","subtype":"莓果","signal":"偶然性"},{"id":"D","text":"既然难得放假，我愿意稍微折腾一点，多体验一些新的东西。","subtype":"热带果","signal":"投入体验"}],"kind":"subtype-pair"},"桃李|樱桃":{"id":"SP-果香-桃李|樱桃","question":"一段关系进入稳定期以后，你最希望仍然保留什么？","options":[{"id":"A","text":"彼此之间仍然有很明确的吸引和偏爱，不只是“很合适”。","subtype":"樱桃","signal":"吸引强度"},{"id":"B","text":"日常越来越自然，彼此很多小习惯都能照顾到。","subtype":"桃李","signal":"生活融合"},{"id":"C","text":"重要的时候，对方仍然会让我清楚感觉到“你对我就是不一样”。","subtype":"樱桃","signal":"明确偏爱"},{"id":"D","text":"即使没有特别浪漫的事情，待在一起也能让人很舒服。","subtype":"桃李","signal":"稳定亲密"}],"kind":"subtype-pair"},"樱桃|热带果":{"id":"SP-果香-樱桃|热带果","question":"碰到一个让你很心动的新机会，你更容易因为什么决定去做？","options":[{"id":"A","text":"我对这件事本身真的特别想要，很难忽略这种感觉。","subtype":"樱桃","signal":"集中欲望"},{"id":"B","text":"它能让我进入一个以前完全没体验过的新环境。","subtype":"热带果","signal":"未知体验"},{"id":"C","text":"哪怕有一点风险，只要这件事足够吸引我，我还是可能选它。","subtype":"樱桃","signal":"为偏爱承担风险"},{"id":"D","text":"就算最后发现不适合，至少我真的亲自试过一种新的可能。","subtype":"热带果","signal":"体验优先"}],"kind":"subtype-pair"},"桃李|热带果":{"id":"SP-果香-桃李|热带果","question":"你理想中的一次旅行，更希望它带给你什么？","options":[{"id":"A","text":"和重要的人一起慢慢生活几天，吃饭、散步、待得很舒服。","subtype":"桃李","signal":"亲密体验"},{"id":"B","text":"看见很多从没见过的东西，真正感觉自己到了另一个世界。","subtype":"热带果","signal":"探索体验"},{"id":"C","text":"比起打卡，我更容易记住两个人相处时那些很具体的小瞬间。","subtype":"桃李","signal":"感官记忆"},{"id":"D","text":"我会因为尝试了以前没做过的事情，而觉得这趟旅行特别值得。","subtype":"热带果","signal":"新体验成就"}],"kind":"subtype-pair"}}},"花香":{"base":[{"id":"SB-花香-FL1","question":"进入一段真正重要的关系以后，你更希望自己是什么状态？","options":[{"id":"A","text":"我可以很爱一个人，但不会因此把自己的尊严和原则全部放掉。","subtype":"玫瑰","signal":"情感与自尊"},{"id":"B","text":"想念、开心、难过都可以自然表达，不想总是计算应该表现多少。","subtype":"茉莉","signal":"情绪自然流动"},{"id":"C","text":"如果真的爱，我希望彼此都能明显感觉到，而不是永远淡淡的。","subtype":"晚香玉","signal":"感情浓度"},{"id":"D","text":"我可能需要很久才能说清楚自己的感受，但这不代表我感受得少。","subtype":"鸢尾","signal":"内收感受"},{"id":"E","text":"我喜欢亲近和温柔，但不希望关系变成时时刻刻都必须绑在一起。","subtype":"橙花","signal":"轻盈亲密"}],"kind":"subtype-base"},{"id":"SB-花香-FL2","question":"哪一种“被理解”最容易让你真正感动？","options":[{"id":"A","text":"对方知道我可以温柔，但也尊重我很明确的底线。","subtype":"玫瑰","signal":"尊重完整人格"},{"id":"B","text":"我甚至还没完全说出来，他已经感觉到我最近状态有点不一样。","subtype":"茉莉","signal":"情绪共振"},{"id":"C","text":"他不会因为我的情绪比较强烈，就立刻觉得我太夸张、太麻烦。","subtype":"晚香玉","signal":"容纳强烈感受"},{"id":"D","text":"他不会逼我马上说，而是知道我需要先自己整理一阵。","subtype":"鸢尾","signal":"表达节奏"},{"id":"E","text":"他对我很好，但不会用“关心”为理由一直追问、一直确认。","subtype":"橙花","signal":"温柔边界"}],"kind":"subtype-base"}],"pairs":{"玫瑰|茉莉":{"id":"SP-花香-玫瑰|茉莉","question":"在一段很重要的关系里，你最希望彼此做到什么？","options":[{"id":"A","text":"再亲近，也尊重彼此明确的底线和原则。","subtype":"玫瑰","signal":"尊重完整人格"},{"id":"B","text":"开心、难过、脆弱都可以比较自然地表现出来。","subtype":"茉莉","signal":"情绪流动"},{"id":"C","text":"爱一个人不意味着谁都要不断牺牲自己的立场。","subtype":"玫瑰","signal":"爱与自尊并存"},{"id":"D","text":"真正状态不好时，可以坦率告诉对方，而不是一直装没事。","subtype":"茉莉","signal":"脆弱开放"}],"kind":"subtype-pair"},"晚香玉|玫瑰":{"id":"SP-花香-晚香玉|玫瑰","question":"一段感情真正打动你时，什么最重要？","options":[{"id":"A","text":"很爱彼此，但双方始终把对方当成一个值得尊重的人。","subtype":"玫瑰","signal":"爱与尊严"},{"id":"B","text":"两个人之间有非常明确的吸引，不会永远平平淡淡。","subtype":"晚香玉","signal":"吸引强度"},{"id":"C","text":"感情再深，也不会因为爱就无限放弃自己的原则。","subtype":"玫瑰","signal":"保持自我"},{"id":"D","text":"我希望重要时刻真的能让我有很强的情绪，而不是永远“还不错”。","subtype":"晚香玉","signal":"情绪浓度"}],"kind":"subtype-pair"},"玫瑰|鸢尾":{"id":"SP-花香-玫瑰|鸢尾","question":"自己情绪很重的时候，你通常怎样处理表达？","options":[{"id":"A","text":"即使很难受，我也会尽量把话说得清楚、有分寸。","subtype":"玫瑰","signal":"有分寸地表达"},{"id":"B","text":"我通常需要先自己想一阵，才知道到底想不想说。","subtype":"鸢尾","signal":"内部整理"},{"id":"C","text":"我可以主动表达感情，但不希望因为情绪重就失去自己的原则。","subtype":"玫瑰","signal":"情绪中的自我完整"},{"id":"D","text":"有时我不是不想说，而是觉得心里的感受比一句话复杂得多。","subtype":"鸢尾","signal":"复杂内感"}],"kind":"subtype-pair"},"橙花|玫瑰":{"id":"SP-花香-橙花|玫瑰","question":"你觉得一段长期关系最舒服的状态是什么？","options":[{"id":"A","text":"彼此很温柔，但遇到重要问题也认真尊重对方的立场。","subtype":"玫瑰","signal":"温柔与尊重"},{"id":"B","text":"两个人在一起不会觉得累，不需要总证明关系有多好。","subtype":"橙花","signal":"轻盈相处"},{"id":"C","text":"再亲近，也不会因为爱就默认对方应该一直让步。","subtype":"玫瑰","signal":"关系平等"},{"id":"D","text":"各自做自己的事也很自然，不必时时刻刻黏在一起。","subtype":"橙花","signal":"独立亲密"}],"kind":"subtype-pair"},"晚香玉|茉莉":{"id":"SP-花香-晚香玉|茉莉","question":"真正喜欢上一个人以后，你更希望自己的感情是什么样？","options":[{"id":"A","text":"喜欢就自然表达，不需要故意把感情弄得很戏剧化。","subtype":"茉莉","signal":"真实自然"},{"id":"B","text":"我希望彼此真的有很强的吸引，不只是舒服和合适。","subtype":"晚香玉","signal":"强烈吸引"},{"id":"C","text":"开心、难过、脆弱都能让对方看见，不用一直端着。","subtype":"茉莉","signal":"情绪开放"},{"id":"D","text":"真正重要的感情应该让我明显感觉到它的存在。","subtype":"晚香玉","signal":"情绪存在感"}],"kind":"subtype-pair"},"茉莉|鸢尾":{"id":"SP-花香-茉莉|鸢尾","question":"当你发现自己对一件事产生很强的情绪时，你更容易：","options":[{"id":"A","text":"先承认自己就是有这种感觉，不急着判断它合不合理。","subtype":"茉莉","signal":"接纳即时情绪"},{"id":"B","text":"先自己待一阵，我通常过一会儿才真正知道为什么这么在意。","subtype":"鸢尾","signal":"延迟理解"},{"id":"C","text":"如果和重要的人有关，我会比较愿意让对方知道自己真实状态。","subtype":"茉莉","signal":"关系透明"},{"id":"D","text":"即使事情和别人有关，我也可能先把一部分感受留给自己。","subtype":"鸢尾","signal":"私人感受空间"}],"kind":"subtype-pair"},"橙花|茉莉":{"id":"SP-花香-橙花|茉莉","question":"关系里出现小情绪时，你更希望怎么相处？","options":[{"id":"A","text":"有什么感觉就自然说一点，不想双方一直靠猜。","subtype":"茉莉","signal":"真实表达"},{"id":"B","text":"如果只是小情绪，我希望聊开以后就过去，不要反复确认很多遍。","subtype":"橙花","signal":"轻量处理"},{"id":"C","text":"偶尔显得脆弱或情绪化，我不觉得是什么很丢脸的事情。","subtype":"茉莉","signal":"允许脆弱"},{"id":"D","text":"我会关心对方，但不喜欢所有小变化都被当成关系危机。","subtype":"橙花","signal":"低黏连"}],"kind":"subtype-pair"},"晚香玉|鸢尾":{"id":"SP-花香-晚香玉|鸢尾","question":"对一件自己非常在意的事，你通常更接近：","options":[{"id":"A","text":"它会明显占据我的注意力，我很难假装没那么在乎。","subtype":"晚香玉","signal":"投入强度"},{"id":"B","text":"越重要，我有时反而越需要一点时间和距离去想清楚。","subtype":"鸢尾","signal":"距离思考"},{"id":"C","text":"如果真的喜欢或难过，我会明显感觉到情绪起伏。","subtype":"晚香玉","signal":"情绪幅度"},{"id":"D","text":"很重要的感受我不一定马上说出口，通常会先自己消化。","subtype":"鸢尾","signal":"表达克制"}],"kind":"subtype-pair"},"晚香玉|橙花":{"id":"SP-花香-晚香玉|橙花","question":"你更喜欢一段关系带给你哪种感觉？","options":[{"id":"A","text":"两个人之间有明显吸引力，会让我真正心动。","subtype":"晚香玉","signal":"吸引张力"},{"id":"B","text":"和这个人在一起以后，生活整体变得更轻松、更舒服。","subtype":"橙花","signal":"低负担关系"},{"id":"C","text":"我可以接受因为很在乎而有一点情绪起伏。","subtype":"晚香玉","signal":"承受强度"},{"id":"D","text":"我不需要一直靠强烈情绪确认感情，平静也可以很好。","subtype":"橙花","signal":"平静亲密"}],"kind":"subtype-pair"},"橙花|鸢尾":{"id":"SP-花香-橙花|鸢尾","question":"心里有一点事情的时候，你希望重要的人怎么对待你？","options":[{"id":"A","text":"给我一点时间，我通常需要先自己想清楚。","subtype":"鸢尾","signal":"整理空间"},{"id":"B","text":"可以关心我，但不需要把这件事马上谈得特别沉重。","subtype":"橙花","signal":"轻量关心"},{"id":"C","text":"不用要求我把所有细节都解释出来，我想好以后自然会说。","subtype":"鸢尾","signal":"表达节奏"},{"id":"D","text":"如果我说“没什么大事”，我希望对方可以相信我，不需要反复确认。","subtype":"橙花","signal":"不过度追问"}],"kind":"subtype-pair"}}},"东方":{"base":[{"id":"SB-东方-O1","question":"什么样的生活状态更容易让你觉得自己真正活得有内容？","options":[{"id":"A","text":"有足够时间独处、阅读、思考，偶尔把一些一直没想明白的问题想深一点。","subtype":"焚香","signal":"精神内省"},{"id":"B","text":"长期做一件值得积累的事，看着经验、能力或生活一点点变厚。","subtype":"树脂琥珀","signal":"时间积累"},{"id":"C","text":"即使生活很忙，也有让自己安心的人和地方，不需要永远处在防备和硬撑里。","subtype":"香草琥珀","signal":"温暖承接"},{"id":"D","text":"生活里一直有一点挑战、未知或者让我兴奋的变化，不想什么都太平。","subtype":"辛香琥珀","signal":"张力需求"}],"kind":"subtype-base"},{"id":"SB-东方-O2","question":"你越来越成熟以后，最不想失去哪一种东西？","options":[{"id":"A","text":"对“我到底为什么要这样生活”这种问题继续有兴趣。","subtype":"焚香","signal":"意义追问"},{"id":"B","text":"对长期价值的耐心，不因为一时看不到结果就马上放弃。","subtype":"树脂琥珀","signal":"长期主义"},{"id":"C","text":"仍然愿意接受照顾、依赖和温柔，不想把独立理解成什么都自己扛。","subtype":"香草琥珀","signal":"接受温柔"},{"id":"D","text":"对新鲜刺激、观点碰撞和强烈体验仍然有反应。","subtype":"辛香琥珀","signal":"刺激敏感"}],"kind":"subtype-base"}],"pairs":{"树脂琥珀|焚香":{"id":"SP-东方-树脂琥珀|焚香","question":"当你决定要不要长期投入一件事时，什么更容易让你觉得“值得”？","options":[{"id":"A","text":"它会不断让我重新思考自己真正相信什么。","subtype":"焚香","signal":"意义"},{"id":"B","text":"我能看见它经过很多年以后会积累出真正的价值。","subtype":"树脂琥珀","signal":"时间价值"},{"id":"C","text":"即使没有立刻的实际回报，它本身仍然让我觉得值得继续探索。","subtype":"焚香","signal":"精神价值"},{"id":"D","text":"它不是靠一时热度成立，而是越做越扎实。","subtype":"树脂琥珀","signal":"长期积累"}],"kind":"subtype-pair"},"焚香|香草琥珀":{"id":"SP-东方-焚香|香草琥珀","question":"当你状态很低、心里很乱的时候，哪一种恢复方式更像你？","options":[{"id":"A","text":"我想先自己安静下来，把最近发生的事慢慢想明白，知道自己到底在难受什么。","subtype":"焚香","signal":"理解自己"},{"id":"B","text":"我会很想和一个真正信任的人待在一起，哪怕不怎么说话，有人在旁边就会安心很多。","subtype":"香草琥珀","signal":"关系中的安全感"},{"id":"C","text":"我可能会看书、散步或者一个人待很久，让脑子慢慢沉下来，直到心里重新有一点方向。","subtype":"焚香","signal":"独处整理"},{"id":"D","text":"我会先把自己照顾舒服一点，吃好、睡好、把环境弄暖和，身体放松以后心情也会慢慢回来。","subtype":"香草琥珀","signal":"身体与环境的安慰"}],"kind":"subtype-pair"},"焚香|辛香琥珀":{"id":"SP-东方-焚香|辛香琥珀","question":"和一个刚认识但很有意思的人聊天时，什么最容易让你产生“我还想继续和他聊”的感觉？","options":[{"id":"A","text":"他会聊一些生活选择、价值观或者“人为什么会这样想”的问题，让我忍不住继续往深处想。","subtype":"焚香","signal":"意义型话题"},{"id":"B","text":"我们观点不完全一样，甚至会有一点争论，但这种碰撞反而让我觉得很有意思。","subtype":"辛香琥珀","signal":"观点碰撞"},{"id":"C","text":"他不会急着给结论，很多事情愿意慢慢想，也能聊一些平时不太容易和别人聊的话题。","subtype":"焚香","signal":"深度交流方式"},{"id":"D","text":"他反应很快，会不断抛出新的问题和角度，让整段对话一直有变化。","subtype":"辛香琥珀","signal":"交流刺激感"}],"kind":"subtype-pair"},"树脂琥珀|香草琥珀":{"id":"SP-东方-树脂琥珀|香草琥珀","question":"你认为什么最容易让一段长期关系越来越珍贵？","options":[{"id":"A","text":"一起经历过很多事情以后，彼此越来越了解、越来越信任。","subtype":"树脂琥珀","signal":"时间积累"},{"id":"B","text":"对方让我知道，累的时候我不需要一直表现得很坚强。","subtype":"香草琥珀","signal":"被承接"},{"id":"C","text":"关系经过很多变化以后，双方仍然愿意继续认真经营。","subtype":"树脂琥珀","signal":"长期坚持"},{"id":"D","text":"日常里一直有具体的关心和温柔，而不是只有重大时刻才表达。","subtype":"香草琥珀","signal":"日常温度"}],"kind":"subtype-pair"},"树脂琥珀|辛香琥珀":{"id":"SP-东方-树脂琥珀|辛香琥珀","question":"做一件自己真正感兴趣的事时，什么最容易让你持续投入？","options":[{"id":"A","text":"我能明显感觉到自己越做越深，理解和能力都在不断积累。","subtype":"树脂琥珀","signal":"深化"},{"id":"B","text":"它一直有新的难题出现，不会很快变成机械重复。","subtype":"辛香琥珀","signal":"持续刺激"},{"id":"C","text":"我觉得它几年以后依然会对自己有价值。","subtype":"树脂琥珀","signal":"长期价值"},{"id":"D","text":"它会逼我尝试以前没试过的方法，让我始终保持一点兴奋。","subtype":"辛香琥珀","signal":"挑战感"}],"kind":"subtype-pair"},"辛香琥珀|香草琥珀":{"id":"SP-东方-辛香琥珀|香草琥珀","question":"如果和一个很喜欢的人完整地度过一天，哪一种相处最让你觉得满足？","options":[{"id":"A","text":"不赶时间，好好吃饭、散步、回家待着，整天都很舒服。","subtype":"香草琥珀","signal":"舒适氛围"},{"id":"B","text":"临时决定去做一点原本没计划的事，整个过程有新鲜感、有点兴奋。","subtype":"辛香琥珀","signal":"意外刺激"},{"id":"C","text":"我累的时候对方会注意到，不用我说很多，就会自然照顾我一点。","subtype":"香草琥珀","signal":"被照顾"},{"id":"D","text":"两个人会互相逗、互相挑战，聊天也有一点针锋相对，但很好玩。","subtype":"辛香琥珀","signal":"关系张力"}],"kind":"subtype-pair"}}},"西普":{"base":[{"id":"SB-西普-CH1","question":"遇到一个让你很矛盾的人时，你更容易：","options":[{"id":"A","text":"不急着判断他到底是好还是坏，先看看这些矛盾为什么会同时存在。","subtype":"苔藓西普","signal":"容纳矛盾"},{"id":"B","text":"即使我对他有很多感情，也会提醒自己别因为情绪忽略现实。","subtype":"花香西普","signal":"情感与判断平衡"},{"id":"C","text":"我可能一边知道他有很多问题，一边仍然能享受和他相处时快乐的部分。","subtype":"果香西普","signal":"明暗并存"},{"id":"D","text":"我可以理解他为什么这样，但理解不代表我会接受所有行为。","subtype":"皮革西普","signal":"理解与边界"}],"kind":"subtype-base"},{"id":"SB-西普-CH2","question":"你越来越成熟以后，更希望自己拥有哪一种能力？","options":[{"id":"A","text":"面对复杂的人和事情，不急着给一个简单结论。","subtype":"苔藓西普","signal":"复杂判断"},{"id":"B","text":"感情很深的时候，也还能保持一点自己的判断。","subtype":"花香西普","signal":"情感分寸"},{"id":"C","text":"即使看见现实不完美，也不因此失去享受生活的能力。","subtype":"果香西普","signal":"现实中的鲜活"},{"id":"D","text":"能理解不同立场，但到了底线问题上还是会明确做决定。","subtype":"皮革西普","signal":"复杂中的立场"}],"kind":"subtype-base"}],"pairs":{"花香西普|苔藓西普":{"id":"SP-西普-花香西普|苔藓西普","question":"面对一个让你既喜欢又有点失望的人，你更接近哪种反应？","options":[{"id":"A","text":"我不会因为一个缺点就直接否定整个人，会把他的不同面放在一起看。","subtype":"苔藓西普","signal":"整体复杂性"},{"id":"B","text":"我会先让自己的情绪过去一点，再决定这段关系到底有没有问题。","subtype":"花香西普","signal":"情绪延迟判断"},{"id":"C","text":"我会试着从几个不同角度理解他的行为，不急着只用一种解释定性。","subtype":"苔藓西普","signal":"多视角"},{"id":"D","text":"就算很难过，我也会努力分清“我现在受伤”和“这段关系本身不值得”是不是同一件事。","subtype":"花香西普","signal":"感受与判断分开"}],"kind":"subtype-pair"},"果香西普|苔藓西普":{"id":"SP-西普-果香西普|苔藓西普","question":"当现实让你发现一件原本很期待的事并不完美时，你更接近：","options":[{"id":"A","text":"我可以接受它就是有好有坏，不一定非要得出一个干净结论。","subtype":"苔藓西普","signal":"接受复杂"},{"id":"B","text":"只要其中还有真正好玩的、让我开心的部分，我仍然愿意享受它。","subtype":"果香西普","signal":"现实中享乐"},{"id":"C","text":"有些矛盾我不一定非要解释清楚，留在那里也可以。","subtype":"苔藓西普","signal":"不强求统一"},{"id":"D","text":"我不希望因为看清现实以后，就变得什么都不期待、什么都没兴趣。","subtype":"果香西普","signal":"保留鲜活"}],"kind":"subtype-pair"},"皮革西普|苔藓西普":{"id":"SP-西普-皮革西普|苔藓西普","question":"一个很重要的朋友做了一个你不太认同的决定，并且来告诉你这件事，你更接近哪种反应？","options":[{"id":"A","text":"我会先听完整件事为什么会走到这一步，不想只根据最后一个决定评价他。","subtype":"苔藓西普","signal":"理解背景"},{"id":"B","text":"就算能理解他的理由，如果我确实不认同，我还是会把自己的看法说清楚。","subtype":"皮革西普","signal":"明确表达立场"},{"id":"C","text":"我可能会同时觉得“我能理解你”又觉得“我不赞同你”，这两件事对我来说可以一起存在。","subtype":"苔藓西普","signal":"容纳矛盾"},{"id":"D","text":"如果他的选择最后会直接影响到我，我会重新决定自己愿意参与到什么程度。","subtype":"皮革西普","signal":"实际边界行动"}],"kind":"subtype-pair"},"果香西普|花香西普":{"id":"SP-西普-果香西普|花香西普","question":"经历过一件让你非常失望的事以后，你最希望自己不要因此失去哪一种能力？","options":[{"id":"A","text":"以后再产生很深的感情时，还是愿意认真感受，而不是因为怕受伤就什么都压住。","subtype":"花香西普","signal":"保留情感深度"},{"id":"B","text":"即使这次结果不好，以后遇到新的机会时，我还是愿意期待一点。","subtype":"果香西普","signal":"保留期待"},{"id":"C","text":"仍然愿意和真正重要的人建立很深的关系，只是以后会更清楚地看现实。","subtype":"花香西普","signal":"保留深度关系能力"},{"id":"D","text":"不让一次失望把自己变成一个什么都觉得“没意思”的人，生活里该开心还是想开心。","subtype":"果香西普","signal":"保留生活鲜活感"}],"kind":"subtype-pair"},"皮革西普|花香西普":{"id":"SP-西普-皮革西普|花香西普","question":"关系里出现问题时，你更接近哪种处理？","options":[{"id":"A","text":"我会考虑彼此感受，不想只讲对错。","subtype":"花香西普","signal":"关系分寸"},{"id":"B","text":"我会听懂对方为什么这么做，但最后还是会判断这件事我能不能接受。","subtype":"皮革西普","signal":"理解后判断"},{"id":"C","text":"即使真的生气，我通常也不想用最伤人的方式解决。","subtype":"花香西普","signal":"控制伤害"},{"id":"D","text":"如果一件事反复触碰我的底线，再深的感情也不会让我无限让步。","subtype":"皮革西普","signal":"底线优先"}],"kind":"subtype-pair"},"果香西普|皮革西普":{"id":"SP-西普-果香西普|皮革西普","question":"面对一个有吸引力、但也明显有风险的新选择，你更接近：","options":[{"id":"A","text":"我知道它可能有风险，但如果真的很想体验，我还是可能会试。","subtype":"果香西普","signal":"鲜活中的冒险"},{"id":"B","text":"我可以接受事情复杂，但不喜欢因为“复杂”就什么立场都没有。","subtype":"皮革西普","signal":"复杂中的明确"},{"id":"C","text":"即使以前遇到过失望，我也不想因此以后什么都不期待。","subtype":"果香西普","signal":"保留期待"},{"id":"D","text":"经历得越多，我越知道哪些事情可以理解，哪些事情就是不能接受。","subtype":"皮革西普","signal":"边界成熟"}],"kind":"subtype-pair"}}},"皮革":{"base":[{"id":"SB-皮革-L1","question":"如果别人第一次认识你，哪一种误解最可能发生？","options":[{"id":"A","text":"觉得我很好说话，但其实我只是没必要每件事都表现得很强硬。","subtype":"麂皮","signal":"柔和边界"},{"id":"B","text":"觉得我有点老派或者慢热，但其实我只是比较看重长期积累出来的东西。","subtype":"旧皮革","signal":"时间偏好"},{"id":"C","text":"觉得我有点不好惹，因为我不太习惯把不同意见说得特别圆。","subtype":"烟熏皮革","signal":"直接立场"},{"id":"D","text":"觉得我有些想法太直接，但我只是觉得很多欲望和情绪没必要假装不存在。","subtype":"动物感皮革","signal":"本能诚实"}],"kind":"subtype-base"},{"id":"SB-皮革-L2","question":"你最欣赏自己身上的哪一种“不那么讨好”的部分？","options":[{"id":"A","text":"我可以温和，但不代表别人可以随便越过我的边界。","subtype":"麂皮","signal":"温和边界"},{"id":"B","text":"我越来越不在意自己是不是永远保持“最好状态”，经历本身也很重要。","subtype":"旧皮革","signal":"接受痕迹"},{"id":"C","text":"遇到明显不合理的事情，我很难为了维持气氛一直忍着不说。","subtype":"烟熏皮革","signal":"冲突能力"},{"id":"D","text":"我能承认自己也会嫉妒、想要、冲动，不需要把这些全部包装成正确答案。","subtype":"动物感皮革","signal":"接受本能"}],"kind":"subtype-base"}],"pairs":{"旧皮革|麂皮":{"id":"SP-皮革-旧皮革|麂皮","question":"你越来越欣赏一个人，最可能是因为什么？","options":[{"id":"A","text":"他很温和，但真正重要的地方一直有自己的底线。","subtype":"麂皮","signal":"温和边界"},{"id":"B","text":"你了解他的经历以后，会发现现在的样子是时间慢慢形成的。","subtype":"旧皮革","signal":"经历感"},{"id":"C","text":"他不需要表现得强势，也能让别人知道什么事情不能越过。","subtype":"麂皮","signal":"低攻击性力量"},{"id":"D","text":"他没有刻意把自己包装得完美，身上的痕迹反而让人觉得真实。","subtype":"旧皮革","signal":"不完美魅力"}],"kind":"subtype-pair"},"烟熏皮革|麂皮":{"id":"SP-皮革-烟熏皮革|麂皮","question":"和别人发生明显分歧时，你更希望自己怎么处理？","options":[{"id":"A","text":"先把自己的界限说清楚，不需要一开始就把气氛弄得很僵。","subtype":"麂皮","signal":"温和表达"},{"id":"B","text":"如果事情很重要，我宁愿产生冲突，也不想装作没有意见。","subtype":"烟熏皮革","signal":"正面对抗"},{"id":"C","text":"我希望态度明确，但不需要靠声音大或者攻击别人证明立场。","subtype":"麂皮","signal":"低攻击性立场"},{"id":"D","text":"有时候把话说重一点，也比大家都在回避真正问题好。","subtype":"烟熏皮革","signal":"承担冲突"}],"kind":"subtype-pair"},"动物感皮革|麂皮":{"id":"SP-皮革-动物感皮革|麂皮","question":"当自己出现一些“不那么体面”的情绪时，你更容易：","options":[{"id":"A","text":"情绪可以有，但我通常不会因此把它直接发泄到别人身上。","subtype":"麂皮","signal":"克制表达"},{"id":"B","text":"我会承认自己确实嫉妒、生气或者有欲望，不想假装没有。","subtype":"动物感皮革","signal":"承认本能"},{"id":"C","text":"即使很不爽，我还是会分清楚自己的情绪和别人的边界。","subtype":"麂皮","signal":"情绪边界"},{"id":"D","text":"比起让自己显得正确，我更想先诚实面对真实反应是什么。","subtype":"动物感皮革","signal":"真实优先"}],"kind":"subtype-pair"},"旧皮革|烟熏皮革":{"id":"SP-皮革-旧皮革|烟熏皮革","question":"看见一个人经历很多挫折以后，你最容易欣赏他哪一点？","options":[{"id":"A","text":"那些经历没有被他全部藏掉，反而变成了现在这个人的一部分。","subtype":"旧皮革","signal":"经历痕迹"},{"id":"B","text":"遇到真正重要的问题时，他比以前更敢明确表达立场。","subtype":"烟熏皮革","signal":"冲突能力"},{"id":"C","text":"他不再执着于维持一个完美形象，反而显得更真实。","subtype":"旧皮革","signal":"成熟真实"},{"id":"D","text":"他经历过事情以后更知道什么时候必须说“不”。","subtype":"烟熏皮革","signal":"明确拒绝"}],"kind":"subtype-pair"},"动物感皮革|旧皮革":{"id":"SP-皮革-动物感皮革|旧皮革","question":"当你说“一个人很真实”时，你更容易指哪一种真实？","options":[{"id":"A","text":"他不掩饰岁月和经历给自己留下的变化。","subtype":"旧皮革","signal":"经历真实"},{"id":"B","text":"他敢承认自己也有欲望、自私和不漂亮的念头。","subtype":"动物感皮革","signal":"本能真实"},{"id":"C","text":"他不会为了维持人设，假装自己从来没失败、没做错过。","subtype":"旧皮革","signal":"不完美历史"},{"id":"D","text":"他不会把所有动机都包装成很高尚的理由。","subtype":"动物感皮革","signal":"动机诚实"}],"kind":"subtype-pair"},"动物感皮革|烟熏皮革":{"id":"SP-皮革-动物感皮革|烟熏皮革","question":"面对一种大家都在假装没问题的情况，你最受不了什么？","options":[{"id":"A","text":"明明有人不认同，却因为怕冲突谁都不愿意说出来。","subtype":"烟熏皮革","signal":"压抑立场"},{"id":"B","text":"明明大家都有私心，却都装作自己完全没有。","subtype":"动物感皮革","signal":"虚假纯洁"},{"id":"C","text":"一件明显不合理的事，因为没人愿意当“坏人”就一直继续。","subtype":"烟熏皮革","signal":"回避对抗"},{"id":"D","text":"每个人都把真实欲望藏在漂亮理由后面，好像承认想要什么很丢脸。","subtype":"动物感皮革","signal":"否认欲望"}],"kind":"subtype-pair"}}},"馥奇":{"base":[{"id":"SB-馥奇-FO1","question":"如果你要长期待在一个工作环境里，什么最重要？","options":[{"id":"A","text":"大家的做事方式比较稳定，答应过的事情不会今天一套明天一套。","subtype":"薰衣草馥奇","signal":"稳定可靠"},{"id":"B","text":"规则够用就行，具体怎么做可以根据实际情况灵活调整。","subtype":"绿感馥奇","signal":"务实灵活"},{"id":"C","text":"信息、文件、流程都比较清楚，不会每天被各种杂乱的小事打断。","subtype":"皂感馥奇","signal":"低杂音秩序"},{"id":"D","text":"遇到问题时有人能快速做决定，不会所有事情都卡在讨论里。","subtype":"辛香馥奇","signal":"推进能力"}],"kind":"subtype-base"},{"id":"SB-馥奇-FO2","question":"你觉得一个人越来越成熟以后，最有价值的变化是什么？","options":[{"id":"A","text":"做事越来越让人放心，不需要别人反复确认。","subtype":"薰衣草馥奇","signal":"可信赖"},{"id":"B","text":"越来越知道什么时候该按规则来，什么时候其实可以变通。","subtype":"绿感馥奇","signal":"现实判断"},{"id":"C","text":"生活变得简单清楚，不再让很多没必要的事情占满注意力。","subtype":"皂感馥奇","signal":"减少杂音"},{"id":"D","text":"遇到问题敢做决定，也愿意承担决定之后的结果。","subtype":"辛香馥奇","signal":"果断负责"}],"kind":"subtype-base"}],"pairs":{"绿感馥奇|薰衣草馥奇":{"id":"SP-馥奇-绿感馥奇|薰衣草馥奇","question":"接手一套已经用了很多年的工作流程，你发现它还能用，但有些地方明显不顺。你更可能怎么处理？","options":[{"id":"A","text":"先保留那些已经长期证明有效的核心步骤，不会为了改变而全部推翻。","subtype":"薰衣草馥奇","signal":"保留成熟经验"},{"id":"B","text":"先去看实际做事的人到底卡在哪里，再根据现场情况修改。","subtype":"绿感馥奇","signal":"根据现实调整"},{"id":"C","text":"我会先弄清楚这套流程当初为什么这样设计，避免无意中改掉真正重要的部分。","subtype":"薰衣草馥奇","signal":"理解经验来源"},{"id":"D","text":"如果不同情况本来就适合不同方法，我不介意让几种做法同时存在。","subtype":"绿感馥奇","signal":"允许灵活路径"}],"kind":"subtype-pair"},"皂感馥奇|薰衣草馥奇":{"id":"SP-馥奇-皂感馥奇|薰衣草馥奇","question":"如果你要和别人长期合住，什么最影响你住得舒不舒服？","options":[{"id":"A","text":"对方生活比较有规律，不会今天一个习惯、明天又完全变掉。","subtype":"薰衣草馥奇","signal":"生活稳定"},{"id":"B","text":"公共区域保持整洁，用完东西基本会放回去。","subtype":"皂感馥奇","signal":"空间秩序"},{"id":"C","text":"说好的分工和约定能长期做到，而不是每次都重新谈。","subtype":"薰衣草馥奇","signal":"承诺持续"},{"id":"D","text":"家里不要堆太多没用的东西，我会因为环境太乱而明显烦躁。","subtype":"皂感馥奇","signal":"视觉减负"}],"kind":"subtype-pair"},"薰衣草馥奇|辛香馥奇":{"id":"SP-馥奇-薰衣草馥奇|辛香馥奇","question":"团队遇到一个突然出现的问题时，你最欣赏哪种同事？","options":[{"id":"A","text":"他不会慌，还是能按照过去靠谱的经验把事情稳住。","subtype":"薰衣草馥奇","signal":"稳定处理"},{"id":"B","text":"信息还不完全的时候，他也能先做一个阶段性的决定，让事情继续走。","subtype":"辛香馥奇","signal":"快速决策"},{"id":"C","text":"他平时就很可靠，所以真的出事时大家知道可以相信他。","subtype":"薰衣草馥奇","signal":"长期信用"},{"id":"D","text":"他愿意站出来负责推进，而不是等所有人都同意才行动。","subtype":"辛香馥奇","signal":"主动承担"}],"kind":"subtype-pair"},"皂感馥奇|绿感馥奇":{"id":"SP-馥奇-皂感馥奇|绿感馥奇","question":"你整理自己的工作区域时，哪种做法更像你？","options":[{"id":"A","text":"最常用的东西放在最顺手的位置，不一定特别整齐，但一定方便。","subtype":"绿感馥奇","signal":"实用优先"},{"id":"B","text":"不同类别的东西有比较固定的位置，找起来不用想。","subtype":"皂感馥奇","signal":"分类秩序"},{"id":"C","text":"最近做什么项目，我就会跟着调整桌面的布局，不喜欢一直维持同一种摆法。","subtype":"绿感馥奇","signal":"环境随任务变化"},{"id":"D","text":"做完一件事以后我会习惯把东西收回去，让下一件事重新从干净状态开始。","subtype":"皂感馥奇","signal":"完成后的清零"}],"kind":"subtype-pair"},"绿感馥奇|辛香馥奇":{"id":"SP-馥奇-绿感馥奇|辛香馥奇","question":"团队做到一半发现原来的方法效果不好，你更自然会做什么？","options":[{"id":"A","text":"找出现在真正卡住的地方，只改最影响结果的那部分。","subtype":"绿感馥奇","signal":"针对现实问题调整"},{"id":"B","text":"信息够用以后先选一个新方向试，不想一直停在讨论阶段。","subtype":"辛香馥奇","signal":"快速决策"},{"id":"C","text":"如果不同人用不同方法反而效率更高，我不会要求所有人必须统一做法。","subtype":"绿感馥奇","signal":"允许方法差异"},{"id":"D","text":"我会明确谁负责下一步、什么时候看结果，让事情重新往前走。","subtype":"辛香馥奇","signal":"推动执行"}],"kind":"subtype-pair"},"皂感馥奇|辛香馥奇":{"id":"SP-馥奇-皂感馥奇|辛香馥奇","question":"一天突然同时来了很多事情，你最希望先怎么处理？","options":[{"id":"A","text":"把所有事情列出来，清掉不重要的，让桌面和脑子都简单一点。","subtype":"皂感馥奇","signal":"减少杂项"},{"id":"B","text":"先判断哪件最急，直接从最关键的那件开始做。","subtype":"辛香馥奇","signal":"快速排序"},{"id":"C","text":"我会先关掉一些不必要的信息和提醒，避免注意力一直被切碎。","subtype":"皂感馥奇","signal":"减少干扰"},{"id":"D","text":"如果必须取舍，我会马上决定哪些暂时不做，不想一直犹豫。","subtype":"辛香馥奇","signal":"果断取舍"}],"kind":"subtype-pair"}}},"芳香":{"base":[{"id":"SB-芳香-A1","question":"一个讨论越来越乱、大家都在说自己的时候，你更容易怎么做？","options":[{"id":"A","text":"如果这个讨论已经没有意义，我会想赶快结束，不想一直耗着。","subtype":"薄荷","signal":"及时切断"},{"id":"B","text":"我会先听一阵，等自己判断清楚以后再说，不急着抢着表态。","subtype":"鼠尾草","signal":"延迟判断"},{"id":"C","text":"我会试着把大家说的东西整理成几个具体问题，看看下一步能做什么。","subtype":"迷迭香","signal":"把思考变行动"},{"id":"D","text":"如果大家观点真的不一样，我反而会觉得有意思，想看看谁的理由更站得住。","subtype":"辛香草本","signal":"思想碰撞"}],"kind":"subtype-base"},{"id":"SB-芳香-A2","question":"学习一个完全陌生的新东西时，你更像哪一种？","options":[{"id":"A","text":"我会先抓最核心的部分，太多无关信息会让我烦。","subtype":"薄荷","signal":"快速去杂"},{"id":"B","text":"我喜欢先了解背景和基本逻辑，不会太早觉得自己已经懂了。","subtype":"鼠尾草","signal":"谨慎理解"},{"id":"C","text":"学到一点以后我就想实际用起来，做的过程中再继续学。","subtype":"迷迭香","signal":"学习转实践"},{"id":"D","text":"我最容易被有争议、有不同流派的内容吸引，因为可以不断比较观点。","subtype":"辛香草本","signal":"观点兴趣"}],"kind":"subtype-base"}],"pairs":{"薄荷|鼠尾草":{"id":"SP-芳香-薄荷|鼠尾草","question":"别人突然提出一个让你不太舒服的要求时，你更容易怎么处理？","options":[{"id":"A","text":"如果它已经明显超过我的接受范围，我会比较快地说不。","subtype":"薄荷","signal":"即时边界"},{"id":"B","text":"我会先问清楚为什么会有这个要求，再判断它是不是合理。","subtype":"鼠尾草","signal":"了解背景"},{"id":"C","text":"如果类似的事情反复发生，我会主动把规则说清楚，免得以后一直出现。","subtype":"薄荷","signal":"提前阻断重复消耗"},{"id":"D","text":"即使第一反应不喜欢，我也可能给自己一点时间，等情绪过去后再决定。","subtype":"鼠尾草","signal":"冷却判断"}],"kind":"subtype-pair"},"薄荷|迷迭香":{"id":"SP-芳香-薄荷|迷迭香","question":"今天突然同时堆来很多事情，你最可能先做什么？","options":[{"id":"A","text":"直接删掉或者推迟一些没那么重要的事，先把总量降下来。","subtype":"薄荷","signal":"减少任务"},{"id":"B","text":"找出最重要的一件，马上开始做。","subtype":"迷迭香","signal":"优先行动"},{"id":"C","text":"暂时关掉提醒、消息和新的请求，不让事情继续往里面加。","subtype":"薄荷","signal":"控制新的输入"},{"id":"D","text":"把最模糊的一件事拆出一个非常具体的第一步，然后先完成它。","subtype":"迷迭香","signal":"把问题转成行动"}],"kind":"subtype-pair"},"薄荷|辛香草本":{"id":"SP-芳香-薄荷|辛香草本","question":"和一个观点完全不同的人讨论时，什么最影响你愿不愿意继续聊？","options":[{"id":"A","text":"如果讨论已经一直重复，没有新的信息，我会想结束。","subtype":"薄荷","signal":"及时停止无效交流"},{"id":"B","text":"只要对方有真正的理由，我反而会很想继续和他辩一辩。","subtype":"辛香草本","signal":"享受观点交锋"},{"id":"C","text":"如果讨论慢慢变成情绪拉扯和人身攻击，我会很快退出。","subtype":"薄荷","signal":"保护交流边界"},{"id":"D","text":"对方如果能提出一个我从来没想过的反例，我会立刻重新检查自己的观点。","subtype":"辛香草本","signal":"被挑战激活"}],"kind":"subtype-pair"},"迷迭香|鼠尾草":{"id":"SP-芳香-迷迭香|鼠尾草","question":"做一个重要决定时，你更接近哪一种过程？","options":[{"id":"A","text":"我会多看一点信息，宁愿慢一点，也不想太早下结论。","subtype":"鼠尾草","signal":"谨慎判断"},{"id":"B","text":"信息够用以后，我会尽快做决定，因为一直想也不会自动出现完美答案。","subtype":"迷迭香","signal":"行动阈值"},{"id":"C","text":"我通常会给自己一点时间，让最开始的情绪过去以后再看。","subtype":"鼠尾草","signal":"冷却判断"},{"id":"D","text":"一旦方向明确，我会希望马上开始，不喜欢决定完以后还拖很久。","subtype":"迷迭香","signal":"执行速度"}],"kind":"subtype-pair"},"辛香草本|鼠尾草":{"id":"SP-芳香-辛香草本|鼠尾草","question":"一场让你觉得“聊得很值”的对话，通常因为什么？","options":[{"id":"A","text":"对方不会急着说服我，而是能把一个问题慢慢讲清楚。","subtype":"鼠尾草","signal":"深思交流"},{"id":"B","text":"我们观点差得很远，但彼此都能拿出有意思的理由。","subtype":"辛香草本","signal":"观点碰撞"},{"id":"C","text":"聊完以后，我对原本模糊的事情有了更成熟、更完整的理解。","subtype":"鼠尾草","signal":"形成判断"},{"id":"D","text":"对方会不断提出我以前没想过的反例，让我重新检查自己的观点。","subtype":"辛香草本","signal":"思维刺激"}],"kind":"subtype-pair"},"辛香草本|迷迭香":{"id":"SP-芳香-辛香草本|迷迭香","question":"团队里有人提出一个很新的想法，你最自然会做什么？","options":[{"id":"A","text":"先想有没有办法用很小的成本试一次，看看它到底行不行。","subtype":"迷迭香","signal":"快速验证"},{"id":"B","text":"先找它最可能失败的地方，看看这个想法有没有明显漏洞。","subtype":"辛香草本","signal":"挑战假设"},{"id":"C","text":"如果决定继续，我会很快把“谁做什么、什么时候出第一版”定下来。","subtype":"迷迭香","signal":"组织行动"},{"id":"D","text":"我会主动听听反对它的人怎么说，看这个想法经不经得住不同观点。","subtype":"辛香草本","signal":"用反对意见检验"}],"kind":"subtype-pair"}}},"绿叶":{"base":[{"id":"SB-绿叶-G1","question":"如果一样东西大家评价很一般，但你自己很喜欢，你更可能因为什么坚持喜欢？","options":[{"id":"A","text":"它有某个很特别的小细节，刚好戳中我，别人没感觉也没关系。","subtype":"黑加仑叶","signal":"个人审美敏感"},{"id":"B","text":"用起来、看起来都很自然舒服，我不需要它特别证明什么。","subtype":"无花果叶","signal":"自然自洽"},{"id":"C","text":"它可能真的有点奇怪，但这种“不像常规答案”的感觉反而让我兴奋。","subtype":"番茄叶","signal":"非传统兴趣"},{"id":"D","text":"它简单、直接，没有为了显得高级加很多没必要的东西。","subtype":"青草","signal":"朴素真实"}],"kind":"subtype-base"},{"id":"SB-绿叶-G2","question":"你最希望自己的生活越来越接近哪一种状态？","options":[{"id":"A","text":"越来越知道自己真正喜欢什么，不太需要别人替我判断品味。","subtype":"黑加仑叶","signal":"审美自主"},{"id":"B","text":"按自己的节奏生活，舒服就好，不需要一直证明自己特别。","subtype":"无花果叶","signal":"松弛自主"},{"id":"C","text":"还有胆量不断尝试很不一样的东西，不因为年纪增长就越来越保守。","subtype":"番茄叶","signal":"实验精神"},{"id":"D","text":"事情尽量简单一点，不为了看起来厉害把生活弄得很复杂。","subtype":"青草","signal":"去包装"}],"kind":"subtype-base"}],"pairs":{"无花果叶|黑加仑叶":{"id":"SP-绿叶-无花果叶|黑加仑叶","question":"买一件准备长期使用的东西时，什么更容易让你最后选中它？","options":[{"id":"A","text":"有一个很特别的细节，一眼就让我觉得“这个东西有自己的性格”。","subtype":"黑加仑叶","signal":"独特细节"},{"id":"B","text":"用起来特别顺手自然，几乎不需要适应。","subtype":"无花果叶","signal":"自然舒适"},{"id":"C","text":"即使它不是大多数人的选择，只要真的符合我的口味，我也不会介意。","subtype":"黑加仑叶","signal":"相信个人审美"},{"id":"D","text":"我更在意长期用起来轻松、不麻烦，而不是第一眼有多特别。","subtype":"无花果叶","signal":"低负担耐用"}],"kind":"subtype-pair"},"番茄叶|黑加仑叶":{"id":"SP-绿叶-番茄叶|黑加仑叶","question":"看到一个非常不寻常的新设计时，什么情况下你会真的喜欢它？","options":[{"id":"A","text":"虽然特别，但细节很聪明，我能感觉到设计者有明确判断。","subtype":"黑加仑叶","signal":"有判断的独特"},{"id":"B","text":"它让我第一次意识到“原来这个东西还可以这样做”。","subtype":"番茄叶","signal":"打开新可能"},{"id":"C","text":"我喜欢它不是因为猎奇，而是它真的很符合我自己的审美。","subtype":"黑加仑叶","signal":"个人审美命中"},{"id":"D","text":"即使现在还不知道它到底好不好，我也会因为它够新而愿意试试。","subtype":"番茄叶","signal":"实验意愿"}],"kind":"subtype-pair"},"青草|黑加仑叶":{"id":"SP-绿叶-青草|黑加仑叶","question":"如果一个品牌说自己的东西“很有个性”，什么最容易让你相信？","options":[{"id":"A","text":"一眼就能看出它有自己的风格，不太像市场上其他东西。","subtype":"黑加仑叶","signal":"辨识度"},{"id":"B","text":"材料、功能、做法都很直接，不故意加很多没必要的东西。","subtype":"青草","signal":"本质直接"},{"id":"C","text":"它没有为了讨好更多人，把原本鲜明的特点全部磨掉。","subtype":"黑加仑叶","signal":"不迎合大众"},{"id":"D","text":"它不需要编很多故事解释自己，看见什么就是什么。","subtype":"青草","signal":"不包装"}],"kind":"subtype-pair"},"无花果叶|番茄叶":{"id":"SP-绿叶-无花果叶|番茄叶","question":"如果有机会用一年时间体验一种和现在完全不同的生活方式，什么最容易让你心动？","options":[{"id":"A","text":"时间可以更自由，能根据自己的状态决定一天怎么过。","subtype":"无花果叶","signal":"生活节奏松弛"},{"id":"B","text":"日常结构完全陌生，我很想知道自己进入以后会变成什么样。","subtype":"番茄叶","signal":"未知实验"},{"id":"C","text":"那种生活里比较少比较、少竞争，我觉得自己会轻松很多。","subtype":"无花果叶","signal":"减少外部压力"},{"id":"D","text":"身边几乎没人这样生活，但正因为少见，我反而更想亲自试一次。","subtype":"番茄叶","signal":"非主流尝试"}],"kind":"subtype-pair"},"无花果叶|青草":{"id":"SP-绿叶-无花果叶|青草","question":"一个完全属于自己的周末，你怎么过最舒服？","options":[{"id":"A","text":"不提前排满，睡醒以后根据当天状态决定做什么。","subtype":"无花果叶","signal":"顺着状态生活"},{"id":"B","text":"吃饭、走路、买菜、收拾房间，简单过一天就很好。","subtype":"青草","signal":"普通日常"},{"id":"C","text":"原来想出去，但突然觉得累，我会很自然地改计划，不觉得有什么。","subtype":"无花果叶","signal":"允许改变节奏"},{"id":"D","text":"完成一两件真正有用的小事，会比安排很多娱乐更让我踏实。","subtype":"青草","signal":"朴素的实际满足"}],"kind":"subtype-pair"},"番茄叶|青草":{"id":"SP-绿叶-番茄叶|青草","question":"看到一种和大家平时完全不同的新做法，你更容易因为什么接受它？","options":[{"id":"A","text":"它让我看到一种以前根本没想过的可能。","subtype":"番茄叶","signal":"探索未知"},{"id":"B","text":"它把原本很复杂的事情变得更简单、更直接。","subtype":"青草","signal":"回归简单"},{"id":"C","text":"即使现在还没有很多人验证，只要风险不大，我愿意先试。","subtype":"番茄叶","signal":"早期尝试"},{"id":"D","text":"我其实不在意它新不新，只要实际好用、不绕就行。","subtype":"青草","signal":"实用直接"}],"kind":"subtype-pair"}}},"水生":{"base":[{"id":"SB-水生-AQ1","question":"状态很累的时候，什么最容易让你慢慢恢复？","options":[{"id":"A","text":"自己出去走一走、换换环境，不一定要完全和人断开联系。","subtype":"海盐","signal":"自由活动"},{"id":"B","text":"有一整段没人找我的时间，真正一个人待着。","subtype":"海洋","signal":"彻底独处"},{"id":"C","text":"安静做一点自己的事，让那些说不清楚的情绪慢慢过去。","subtype":"雨水","signal":"情绪消化"},{"id":"D","text":"把消息、杂物和没必要处理的事情都减少，先让生活简单下来。","subtype":"矿物水感","signal":"减少刺激"}],"kind":"subtype-base"},{"id":"SB-水生-AQ2","question":"你最舒服的人际状态更接近：","options":[{"id":"A","text":"各自都有自己的生活，但想见的时候可以很自然地见面。","subtype":"海盐","signal":"自由连接"},{"id":"B","text":"即使关系很好，我也需要相当多完全不被打扰的私人时间。","subtype":"海洋","signal":"距离需求"},{"id":"C","text":"我比较在意相处时的情绪和气氛，太吵、太急会让我很累。","subtype":"雨水","signal":"情绪环境敏感"},{"id":"D","text":"有事说事、没事各忙各的，不希望关系里有太多反复确认和猜测。","subtype":"矿物水感","signal":"关系简化"}],"kind":"subtype-base"}],"pairs":{"海洋|海盐":{"id":"SP-水生-海洋|海盐","question":"和朋友一起旅行很多天以后，你最希望最后一天怎么过？","options":[{"id":"A","text":"自己出去逛几个小时，晚上再回来和大家一起吃饭。","subtype":"海盐","signal":"独立行动但保留连接"},{"id":"B","text":"最好整天都自己待着，不需要安排任何集体活动。","subtype":"海洋","signal":"完全独处"},{"id":"C","text":"就算单独行动，如果路上碰到有趣的人或事情，我也不介意聊几句、分享一点。","subtype":"海盐","signal":"保持轻度连接"},{"id":"D","text":"我希望这一天不用告诉任何人自己去了哪里、在做什么，也不用回应别人对行程的询问。","subtype":"海洋","signal":"信息与行程隐私"}],"kind":"subtype-pair"},"海盐|雨水":{"id":"SP-水生-海盐|雨水","question":"心情有点低落的周末，你更想怎么过？","options":[{"id":"A","text":"出去走走、换个地方，让身体动起来以后心情自然松一点。","subtype":"海盐","signal":"通过活动恢复"},{"id":"B","text":"找一个安静的地方待着，让自己的情绪慢慢沉下来。","subtype":"雨水","signal":"安静感受"},{"id":"C","text":"我不一定想谈心，但如果遇到舒服的人，随便聊聊也没关系。","subtype":"海盐","signal":"保持轻度连接"},{"id":"D","text":"我更希望少说话，可能看看电影、写点东西或者自己想一会儿。","subtype":"雨水","signal":"内部整理"}],"kind":"subtype-pair"},"海盐|矿物水感":{"id":"SP-水生-海盐|矿物水感","question":"行程突然变得特别满时，你最想先做什么？","options":[{"id":"A","text":"给自己留出一段完全没有安排的时间，哪怕只是出去走走。","subtype":"海盐","signal":"保留自由时间"},{"id":"B","text":"直接删掉一些意义不大的安排，让整个日程重新变简单。","subtype":"矿物水感","signal":"精简任务"},{"id":"C","text":"如果几件事可以自己完成，我不想每件都和别人绑定行动。","subtype":"海盐","signal":"行动自主"},{"id":"D","text":"把通知、群聊和临时信息减少，不想让注意力一直被打断。","subtype":"矿物水感","signal":"减少信息噪音"}],"kind":"subtype-pair"},"海洋|雨水":{"id":"SP-水生-海洋|雨水","question":"一件事情让你心里很不舒服时，你更希望别人怎么对待你？","options":[{"id":"A","text":"先让我真正一个人待一阵，不需要陪，也不用一直确认我怎么样。","subtype":"海洋","signal":"需要彻底距离"},{"id":"B","text":"可以安静地待在旁边，不一定要说很多话，我会觉得有人在也没关系。","subtype":"雨水","signal":"安静陪伴"},{"id":"C","text":"等我什么时候想重新联系，由我自己决定，不希望别人替我规定“该聊了”。","subtype":"海洋","signal":"掌握重新连接的时机"},{"id":"D","text":"如果我开始说，希望对方先把我的感受听完，不要马上分析或者给解决方案。","subtype":"雨水","signal":"情绪被承接"}],"kind":"subtype-pair"},"海洋|矿物水感":{"id":"SP-水生-海洋|矿物水感","question":"工作了一整天以后，你最希望回到怎样的状态？","options":[{"id":"A","text":"暂时没有人找我，我可以从所有社交里退出来一会儿。","subtype":"海洋","signal":"社交退出"},{"id":"B","text":"桌面、房间和待办尽量简单，让眼前没有太多东西需要处理。","subtype":"矿物水感","signal":"环境减负"},{"id":"C","text":"做一点完全属于自己的事，不需要拍照、分享或者告诉任何人。","subtype":"海洋","signal":"私人生活保留"},{"id":"D","text":"关掉没必要的提醒，只留下真正需要处理的信息。","subtype":"矿物水感","signal":"信息筛选"}],"kind":"subtype-pair"},"矿物水感|雨水":{"id":"SP-水生-矿物水感|雨水","question":"发生了一件让你心里一直不舒服的事，你最容易怎么整理自己？","options":[{"id":"A","text":"给自己一点时间，慢慢弄清楚我到底为什么这么难受。","subtype":"雨水","signal":"理解感受"},{"id":"B","text":"先把事实和自己的猜测分开，避免越想越乱。","subtype":"矿物水感","signal":"理清事实"},{"id":"C","text":"我可能会通过写东西、看作品或者安静待着，让情绪慢慢浮出来。","subtype":"雨水","signal":"让情绪自然显现"},{"id":"D","text":"我会主动减少继续刺激自己的信息，不反复看、不反复确认。","subtype":"矿物水感","signal":"控制信息输入"}],"kind":"subtype-pair"}}},"美食":{"base":[{"id":"SB-美食-GO1","question":"一段特别累的时期终于结束以后，你最想给自己什么？","options":[{"id":"A","text":"几天不用硬撑的舒服生活，好好睡、好好吃，也让别人照顾我一点。","subtype":"香草奶甜","signal":"被照顾"},{"id":"B","text":"给自己一个质量很好的奖励，不一定夸张，但要真正让我觉得值得。","subtype":"咖啡可可","signal":"成熟享受"},{"id":"C","text":"好好庆祝一次，请喜欢的人一起吃饭、玩，把快乐放大一点。","subtype":"蜂蜜焦糖","signal":"分享丰盛"},{"id":"D","text":"暂时不那么自律，想晚睡就晚睡、想出去玩就出去玩，允许自己松一点。","subtype":"酒香","signal":"释放控制"}],"kind":"subtype-base"},{"id":"SB-美食-GO2","question":"你最希望自己的生活始终保留哪一种快乐？","options":[{"id":"A","text":"累的时候知道有地方可以安心放松，不需要一直表现得很能扛。","subtype":"香草奶甜","signal":"安全感"},{"id":"B","text":"越来越会享受真正有品质的东西，而不是只追求更多、更刺激。","subtype":"咖啡可可","signal":"有分寸的享受"},{"id":"C","text":"开心的时候愿意表达、愿意分享，也舍得把好的东西给重要的人。","subtype":"蜂蜜焦糖","signal":"慷慨表达"},{"id":"D","text":"偶尔可以不那么计划、不那么正确，做一点纯粹因为当下想做的事。","subtype":"酒香","signal":"松开规则"}],"kind":"subtype-base"}],"pairs":{"咖啡可可|香草奶甜":{"id":"SP-美食-咖啡可可|香草奶甜","question":"忙完一周以后，你最理想的周五晚上是什么样？","options":[{"id":"A","text":"回家吃点舒服的东西、洗澡、窝着，不需要再表现任何状态。","subtype":"香草奶甜","signal":"彻底放松"},{"id":"B","text":"去一家真正喜欢、质量很好的店，认真享受这一顿。","subtype":"咖啡可可","signal":"品质享受"},{"id":"C","text":"如果有人愿意照顾我一点、替我准备好一些东西，我会特别幸福。","subtype":"香草奶甜","signal":"接受照顾"},{"id":"D","text":"我更愿意少一点但选好的，不需要堆很多东西才能觉得满足。","subtype":"咖啡可可","signal":"克制选择"}],"kind":"subtype-pair"},"蜂蜜焦糖|香草奶甜":{"id":"SP-美食-蜂蜜焦糖|香草奶甜","question":"生日当天，你最期待哪一种感觉？","options":[{"id":"A","text":"身边的人让我觉得自己被惦记、被好好照顾。","subtype":"香草奶甜","signal":"被关心"},{"id":"B","text":"大家真的一起庆祝，热热闹闹，把开心表现出来。","subtype":"蜂蜜焦糖","signal":"放大快乐"},{"id":"C","text":"不需要很大的场面，只要和让我安心的人舒服地待在一起就很好。","subtype":"香草奶甜","signal":"安全陪伴"},{"id":"D","text":"我会喜欢准备很多吃的、礼物或者小细节，让身边的人也一起开心。","subtype":"蜂蜜焦糖","signal":"主动给予"}],"kind":"subtype-pair"},"酒香|香草奶甜":{"id":"SP-美食-酒香|香草奶甜","question":"难得有一个完全不用负责的晚上，你最想怎么过？","options":[{"id":"A","text":"穿最舒服的衣服待着，什么都不用赶，让身体彻底松下来。","subtype":"香草奶甜","signal":"身体放松"},{"id":"B","text":"临时出去玩到比平时更晚，今天不太想管平常的规律。","subtype":"酒香","signal":"打破日常控制"},{"id":"C","text":"和很信任的人待在一起，我不需要一直保持“状态很好”。","subtype":"香草奶甜","signal":"卸下坚强"},{"id":"D","text":"做一点平时会觉得“算了，还是别”的事，只因为今天很想。","subtype":"酒香","signal":"允许冲动"}],"kind":"subtype-pair"},"咖啡可可|蜂蜜焦糖":{"id":"SP-美食-咖啡可可|蜂蜜焦糖","question":"手上突然多出一笔只准拿来享受的钱，你更想怎么花？","options":[{"id":"A","text":"买一件真正品质很好、能用很久的东西。","subtype":"咖啡可可","signal":"品质投资"},{"id":"B","text":"请重要的人一起吃顿好的，把快乐大家一起分。","subtype":"蜂蜜焦糖","signal":"分享快乐"},{"id":"C","text":"我不会因为“必须花掉”就买很多东西，更想慢慢挑一个自己真的觉得值得的选择。","subtype":"咖啡可可","signal":"克制与筛选"},{"id":"D","text":"我会把它变成一次很完整的庆祝，吃的、玩的、细节都尽量准备得丰盛一点。","subtype":"蜂蜜焦糖","signal":"营造丰盛"}],"kind":"subtype-pair"},"咖啡可可|酒香":{"id":"SP-美食-咖啡可可|酒香","question":"一段时间工作特别认真以后，你觉得怎样才算“真的休息了一次”？","options":[{"id":"A","text":"去一个自己一直想去、品质很好的地方，好好享受一次。","subtype":"咖啡可可","signal":"高质量奖励"},{"id":"B","text":"偶尔彻底不按平时的时间表来，玩晚一点、睡晚一点也没关系。","subtype":"酒香","signal":"暂时失序"},{"id":"C","text":"享受归享受，我还是希望第二天不用为今天的放纵付很大代价。","subtype":"咖啡可可","signal":"保留分寸"},{"id":"D","text":"做一点平时因为“太麻烦、太不理性”不会做的事，偶尔任性一次。","subtype":"酒香","signal":"打破理性约束"}],"kind":"subtype-pair"},"蜂蜜焦糖|酒香":{"id":"SP-美食-蜂蜜焦糖|酒香","question":"一群很熟的人难得聚在一起，你最享受哪种状态？","options":[{"id":"A","text":"我会很自然地想把好吃的、好喝的、好东西都拿出来和大家分享。","subtype":"蜂蜜焦糖","signal":"慷慨分享"},{"id":"B","text":"气氛起来以后，大家都比平时放松一点，说些平常不会说的话也没关系。","subtype":"酒香","signal":"卸下拘束"},{"id":"C","text":"我会留意每个人喜欢什么、有没有照顾到，想让大家都觉得今天过得很值。","subtype":"蜂蜜焦糖","signal":"照顾整体体验"},{"id":"D","text":"我最喜欢计划外突然续摊、临时决定再去一个地方的时刻。","subtype":"酒香","signal":"脱离计划"}],"kind":"subtype-pair"}}}},"results":[{"family":"柑橘调 Citrus","subtype":"佛手柑","first_line":"你像一片刚削开的佛手柑皮：明亮、干净，却始终保留一点克制的苦意。","core_perfume":"Le Labo — Bergamote 22","radar":{"明亮":85,"柔软":45,"尖锐":60,"深邃":35,"清冷":60,"温暖":45,"克制":60,"丰盛":35},"copy_perfume":["Le Labo — Bergamote 22这不是一支只负责“清新”的柑橘香。佛手柑的明亮很快被葡萄柚的微苦、苦橙叶的青绿、琥珀与麝香的暖意拉出层次，最后还有香根草把整个轮廓稳住。","当你想要表现出这样的一面时，你可以穿这支香水：轻松，但不轻浮；明亮，但不需要用热闹证明自己。你愿意让生活舒服一点，却仍然保留自己的判断、分寸和节奏。"],"copy_main":["你的气味轮廓很亮，但不是甜软的亮。它更干净、更有边缘，也始终保留着一点克制。就像佛手柑的皮刚被划开，空气里先出来的是明亮的柑橘油脂，下一秒才尝到一点微苦。它让人觉得轻，却不会让人联想到轻率；清爽，却并不单薄。你身上也有类似的分寸感。","你通常知道什么时候可以放松，也知道什么时候事情值得认真。你并不迷恋“永远紧绷”带来的可靠感，反而更希望自己能用比较轻的状态把事情做好。对你来说，真正成熟的松弛不是随便，而是即使不把自己逼得很紧，依然知道什么该做、什么不该做。所以你很少喜欢过度用力的表达。","无论是关系、工作还是审美，你更容易被那些看起来毫不费力、实际上细节都被照顾到的东西吸引。你可以很好相处，也愿意给人舒服的感觉，但这不代表你什么都无所谓。相反，你对方式、尺度、场合常常有一套很稳定的判断，只是通常不会把它变成对别人的要求。你的轻盈并不是因为生活从来没有重量。更像是你越来越知道：不是每一件事都值得被处理得很沉重。重要的事情认真对待，不重要的事情就让它轻一点。这个取舍本身，就是你身上很成熟的一部分。"],"copy_hidden":["因为你很会把事情处理得体，别人有时会以为你“什么都可以”。其实不是。","你只是通常不会为了证明自己有原则，就把每一个原则都表现得很锋利。很多时候，你先观察场合、方式和对方的状态，再决定要不要把自己的不认同完全表达出来。但如果一件事长期让你觉得失去分寸、没有边界，或者不断要求你牺牲自己的节奏，你会慢慢退出。你真正重视的并不是表面的优雅，而是：我可以轻松，但不能失去自己的标准。"]},{"family":"柑橘调 Citrus","subtype":"葡萄柚","first_line":"你像一瓣微苦的葡萄柚：第一口是明亮，留下来的却是清醒。","core_perfume":"Guerlain — Aqua Allegoria Pamplelune","radar":{"明亮":88,"柔软":30,"尖锐":80,"深邃":30,"清冷":72,"温暖":30,"克制":55,"丰盛":25},"copy_perfume":["Guerlain — Aqua Allegoria Pamplelune","葡萄柚在这里不是被处理成甜甜的果汁，而是保留了明亮、酸爽甚至略带苦感的一面。黑加仑芽让它多出一点青绿和锋利，广藿香又把明快的柑橘压出更深的阴影。","当你想要表现出这样的一面时，你可以穿这支香水：清醒、有判断，明亮里带一点“不好糊弄”。你可以快乐，也愿意享受生活，但不会为了维持好心情就假装没看见问题。"],"copy_main":["你的气味轮廓很亮、很锐，也明显偏冷。像一瓣刚从冰箱里拿出来的葡萄柚，果肉看起来清透多汁，咬下去却先尝到一点酸和苦。不是让人退后的苦，而是一种会让味觉立刻醒过来的苦。你也不太喜欢自己处在一种“什么都很好”的假性舒适里。","如果一件事不对，你通常会比较快感觉到。可能是一个人说话里的不真诚，一个安排里明显的不合理，或者某种别人觉得没关系、你却觉得哪里不太对劲的细节。你未必每次都立刻指出来，但判断往往已经形成。你真正珍惜的是自己的感受不要被磨钝。所以你并不会把“成熟”理解成越来越圆滑。相反，你希望自己越长大，越能承认什么适合自己、什么不适合，什么喜欢、什么就是不喜欢。这并不意味着你凡事都要对抗。","葡萄柚依然属于柑橘。你的底色仍然是轻的，你仍然喜欢明快、舒服和不拖泥带水的生活。只不过这种轻盈里一直带着一条清楚的线：快乐可以简单，判断不能含糊。"],"copy_hidden":["别人容易先看到你的利落、挑剔或者清醒，却不一定看到你其实非常珍惜“真”。你不是一定要听好听的话。很多时候，一句不那么漂亮但真实的表达，反而比非常圆润的安慰更容易得到你的信任。所以你有时会显得比实际更冷。真正让你退后的通常不是别人有缺点，而是你感觉对方一直在修饰、闪躲，或者希望你配合一种大家都知道不是真的东西。你的锋利不是为了伤人。更多时候，它是在保护一件很简单的东西：我希望自己还能相信自己的感觉。"]},{"family":"柑橘调 Citrus","subtype":"柠檬","first_line":"你像刚切开的柠檬：直接、清爽，没有太多需要猜的余地。","core_perfume":"Maison Margiela Replica — Under the Lemon Trees","radar":{"明亮":95,"柔软":25,"尖锐":82,"深邃":20,"清冷":75,"温暖":25,"克制":50,"丰盛":20},"copy_perfume":["Maison Margiela Replica — Under the Lemon Trees它不是糖渍柠檬，也不是甜饮料。卡拉曼西青柠、苦橙叶、芫荽、绿茶和干燥雪松一起，把“柠檬树下”做成一种很明亮、很绿、也很利落的空气。当你想要表现出这样的一面时，你可以穿这支香水：干净、直接、反应快。事情可以不完美，但最好不要黏在那里反复消耗；能处理就处理，处理完就继续往前。"],"copy_main":["你的气味轮廓非常明亮，也非常利落。柠檬不是一种需要慢慢辨认的东西。它的酸、亮和清爽几乎同时出现，一刀切开，空气就立刻变了。它不需要铺垫，也很少制造暧昧。你处理生活的方式也常常如此。","很多事情在别人那里可能会被拖成一个情绪问题，在你这里更容易先变成一个“现在到底能做什么”的问题。只要找到下一步，原本很烦的东西通常就会立刻减轻一半。所以你很讨厌无意义的堆积。","没回的消息、一直悬着的小任务、明明三句话可以说清楚却不断绕圈的沟通，都会持续占据你的注意力。你不一定特别追求高效率本身，而是你很享受那种——一件事终于清掉，脑子重新变空一点——的感觉。你也很少迷恋复杂本身。","在你看来，真正好的解决方式往往不是看起来多厉害，而是能不能把事情变简单。复杂的问题当然可以复杂，但没有必要为了显得深刻，把原本简单的事情弄得越来越难。这也是柠檬式的轻。它不是逃避重量，而是不断把生活里那些不需要的重量削掉。"],"copy_hidden":["因为你翻篇比较快，别人有时会误以为你不在意。其实很多时候，你只是不会用“反复想”来证明这件事曾经重要。你可能已经认真生气过、认真失望过，也认真处理过。等事情真的结束，你就很难理解为什么还需要一次又一次重新把它打开。所以真正让你难受的，往往不是一次明确的冲突，而是那些始终没有结论、没有下一步、一直处在悬空状态里的东西。你并不是没有耐心。你只是希望自己的精力最终能流向生活，而不是永远停在同一个问题里。"]},{"family":"柑橘调 Citrus","subtype":"柑橘","first_line":"你像冬日下午剥开的橘子：明亮、柔和，快乐并不需要太复杂的理由。","core_perfume":"Guerlain — Aqua Allegoria Mandarine Basilic","radar":{"明亮":92,"柔软":55,"尖锐":50,"深邃":25,"清冷":45,"温暖":60,"克制":35,"丰盛":40},"copy_perfume":["Guerlain — Aqua Allegoria Mandarine Basilic多汁的柑橘是绝对主角，但罗勒和绿茶让它没有滑向单纯甜美。它依然明亮、好亲近，只是带着一点绿色的清醒和木质底色。当你想要表现出这样的一面时，你可以穿这支香水：温暖、轻快、好相处。不是刻意制造热闹，而是你真的有能力从很普通的一天里找到一点值得开心的东西。"],"copy_main":["你的气味轮廓非常明亮，但比柠檬、葡萄柚更柔和，也更暖。像冬天有人在房间里剥开一只橘子。果皮裂开的那一瞬间，整个空气都变得轻快了一点。它没有很大的戏剧性，却会让一个原本普通的下午突然变得很好。你也很懂这种“小快乐”的价值。","你不一定需要事情多么特别，才觉得今天值得。天气不错、吃到喜欢的东西、和熟悉的人闲逛、工作比预想中早一点结束，这些很小的东西都可能真实地改善你的状态。这并不代表你没有野心，也不代表你只想舒服。","更准确地说，你不愿意为了证明一件事很重要，就把生活里的所有轻松都牺牲掉。你知道一个人可以一边认真做事，一边好好吃饭；可以有目标，也可以因为一杯好喝的东西高兴。你的恢复方式也通常比较生活化。","比起把每一次低落都处理成一个需要彻底想明白的问题，你可能更愿意先睡一觉、出去走走、见一个让自己舒服的人。很多时候，生活重新变得有滋味，情绪自然就没有那么重了。你很擅长给日子留一点甜。而且这种甜不是幼稚，是你不愿意让现实把感受快乐的能力一起拿走。"],"copy_hidden":["因为你给人的感觉通常比较轻松，别人可能会低估你面对坏情绪的能力。其实你不是只接受好的部分。你当然会难过，也会失望，只是你本能地不愿让一件坏事吞掉所有其他东西。哪怕今天只有一小部分还不错，你也会想办法把那一小部分留下来。有时别人会把这种状态理解成“想得开”。但它更像一种选择。你知道生活不可能一直轻松，所以你才更愿意在可以轻松的时候，真的让自己轻松。你不是看不见重量，而是不愿意把重量当成生活唯一真实的部分。"]},{"family":"果香调 Fruity","subtype":"黑加仑","first_line":"你像一颗刚压破的黑加仑：酸甜之外，还有一点锐利的青涩。","core_perfume":"Lalique — Amethyst","radar":{"明亮":72,"柔软":55,"尖锐":65,"深邃":50,"清冷":50,"温暖":55,"克制":40,"丰盛":70},"copy_perfume":["Lalique — Amethyst它不是一支单纯甜美的莓果香。黑莓、黑加仑、覆盆子一起出现，但其中始终夹着一点青绿叶片的脆感，后面才慢慢落到麝香、木质和香草里。","当你想要表现出这样的一面时，你可以穿这支香水：敏锐、鲜活、有一点不好归类。你当然会被人和事情打动，但你不会因为产生了感情，就自动放弃自己的判断。"],"copy_main":["你的气味轮廓是鲜活的，却不是毫无防备的甜。","黑加仑很有意思。它有果实的酸甜，也有靠近枝叶时才会闻到的青涩和一点近乎尖锐的气息。第一反应可能是“好闻、好吃、很有生命力”，再多停留一会儿，却会发现它并没有那么乖。你也是这种有两层反应的人。你很容易捕捉到细节。一个人语气里很轻微的变化、一件东西与同类之间说不上来的差别、一段关系里突然多出来或少掉的某种东西，你经常比别人更早感觉到。这种敏锐让你很容易产生感受，同时也很难彻底把判断交给感受。","你可以很喜欢一个人，又同时知道对方哪里让你不舒服；可以被某件东西惊艳，又很快发现它其实还有一个不够好的地方。别人有时候会觉得这种状态矛盾，但对你来说，它们本来就可以同时存在。你真正想保留的是一种“我还能感觉到差别”的能力。","不是所有东西都差不多，不是所有选择都可以互换，也不是只要大家说好，你就必须跟着觉得好。你的偏爱往往有非常具体的理由，只是这个理由未必总能被轻易说出来。这就是黑加仑式的鲜活——它不是毫无阴影的快乐，而是在感受很丰富的时候，依然没有失去自己的味觉。"],"copy_hidden":["你的敏锐有时会让别人觉得你想得多。但很多时候，你并不是主动在分析。你只是确实看见了。一个很轻的迟疑、一个突然改变的习惯、一句和以前不太一样的话，对别人来说可能什么都不是，对你来说却已经足够形成一种感觉。真正麻烦的地方在于：你的感觉往往比证据先到。所以你有时会处在一种微妙的位置——你知道哪里不太对，却还没有足够的事实把它说清楚。这会让你偶尔怀疑自己是不是太敏感。可你真正需要学会信任的，也许不是每一个瞬间的猜测，而是那种更稳定的东西：你确实拥有很细的感受力，而感受力和胡思乱想并不是一回事。"]},{"family":"果香调 Fruity","subtype":"莓果","first_line":"你像一把刚摘下来的野莓：酸甜不规则，却有未经修饰的生命力。","core_perfume":"L’Artisan Parfumeur — Mûre et Musc","radar":{"明亮":88,"柔软":70,"尖锐":40,"深邃":35,"清冷":30,"温暖":70,"克制":20,"丰盛":75},"copy_perfume":["L’Artisan Parfumeur — Mûre et Musc","黑莓是主角，但它并没有被做成黏稠的果酱。柠檬先把空气打开，随后是多汁的黑莓，最后落在轻柔的白麝香里。果实的快乐还在，却多了一层贴近皮肤的自然感。","当你想要表现出这样的一面时，你可以穿这支香水：轻快、自然、有一点顽皮。你不需要每一次快乐都有很大的理由，也不觉得人长大以后就必须把所有幼稚和即兴都收起来。"],"copy_main":["你的气味轮廓很亮、很软，也明显不太克制。但这种“不克制”不是浓烈，而是你不太想时时刻刻管理自己的反应。野莓不会长得每一颗都一样。大小不同，甜度不同，偶尔还酸得皱眉。可正因为如此，它才有一种很难复制的活气。你身上也有这种未经修整的部分。","当你真的开心时，你希望自己可以开心得明显一点；遇到有趣的事情，你很容易顺着那个兴奋继续往下走；原本计划好的路线，也可能因为突然看到一个更好玩的东西而临时改变。你对“体验有没有意义”的要求没有那么苛刻。有些事情就是好玩。有些人就是让你觉得轻松。有些下午最后什么成果都没留下，但因为当时真的笑得很开心，所以仍然值得。这让你身上有一种很容易被压掉、却其实非常珍贵的生命力：你还愿意因为小事情产生真实反应。","你不需要每一份快乐都被包装成成长，也不需要每一次兴趣最后都发展成技能。对你来说，活着本来就应该有一部分，是没有目的的。"],"copy_hidden":["因为你看起来比较容易开心，别人有时会误以为你的快乐也很容易被替代。其实不是。你只是对“有趣”的入口很多，但真正让你持续喜欢的人和东西，仍然有自己的标准。","你尤其容易对那种过度计划、过度设计、什么都必须产生结果的环境感到疲倦。不是因为你不认真，而是当生活的每一部分都开始被要求“有用”，你会很快觉得自己像被抽掉了氧气。所以你偶尔的随性，并不是缺少方向。它更像是在保护一个很重要的部分：我不希望自己最后只能通过完成任务，才能证明今天值得。"]},{"family":"果香调 Fruity","subtype":"樱桃","first_line":"你像一颗颜色过深的樱桃：甜是真的，暗色也是真的。","core_perfume":"Tom Ford — Lost Cherry","radar":{"明亮":65,"柔软":60,"尖锐":55,"深邃":65,"清冷":25,"温暖":75,"克制":20,"丰盛":88},"copy_perfume":["Tom Ford — Lost Cherry","黑樱桃的甜、酸和汁水被苦杏仁一下压出更深的边缘，随后还有樱桃酒、玫瑰、茉莉以及木质底色。它很明确，不是若有若无的果香，而是一种几乎无法假装没闻到的偏爱。","当你想要表现出这样的一面时，你可以穿这支香水：浓烈、明确、有欲望。你不想把真正重要的喜欢说成“都可以”，也不希望自己最后对所有事情都只剩下一种安全的、淡淡的感觉。"],"copy_main":["你的气味轮廓浓、暖、丰盛，克制感却很低。这里的低克制不是说你没有自控力，而是你并不真正欣赏一种把所有感受都削弱之后得到的安全。樱桃很适合描述这种偏爱。它有一种过于明确的颜色。深红、甜、酸，有时候甚至带一点酒意和苦核。它很难成为背景，因为它从一开始就在说：这里有东西正在发生。你对真正想要的人和事也常常如此。你可以对很多东西无所谓，但一旦真正产生偏爱，就很难继续保持完全中立。你会想靠近，会期待，会因为结果受到影响，也会因为得到而产生很真实的快乐。","你并不一定喜欢戏剧。你真正排斥的是寡淡。","一段关系如果长期只有“合适”，没有吸引；一件事情如果永远只是“还不错”，没有真正想要；一种生活如果什么都安全，却很久没有让你明显兴奋过，你会慢慢觉得里面少了什么。你需要的是一种足够清楚的感觉——我知道自己正在喜欢什么。哪怕这会让人比保持无所谓更容易受伤。"],"copy_hidden":["你身上的强烈，并不意味着你会对所有东西都强烈。恰恰相反，你的偏爱常常很集中。这也是为什么一旦真正喜欢，你很难接受别人用“别那么在意”来安慰你。因为对方试图降低的是情绪，而你珍惜的恰恰是：有一些东西对我来说就是不一样。所以你真正害怕的可能不是失控。而是有一天，你变得什么都能接受、什么都差不多、什么都不会真的让你产生渴
