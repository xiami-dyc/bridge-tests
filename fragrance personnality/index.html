<body>
  <header class="topbar shell"><div class="test-type">香气人格测试</div><div class="bridge-mark">Bridge Test</div></header>
  <main id="app" class="shell" aria-live="polite"></main>
  <script src="./data.js"></script>
  <script>
    const DATA=window.BRIDGE_FRAGRANCE_DATA,DIMS=DATA.dimensions,FAMILIES=new Set(DATA.families);
    const compat=new Map([['blackberry|patchouli',.9],['blackberry|rum',.8],['blackberry|white_musk',.7],['black_cherry|rum',.9],['black_cherry|vanilla',.8],['black_cherry|leather',.8],['black_cherry|cognac',.9],['iris|white_musk',1],['cedar|iris',.9],['aldehydes|iris',.8],['bergamot|tea',.9],['osmanthus|tea',.9],['tea|white_musk',.8],['patchouli|rose',.9],['rose|saffron',.8],['osmanthus|sandalwood',.8],['patchouli|rum',.9],['cognac|tobacco',.9],['fig_leaf|sea_salt',.9],['sea_salt|vetiver',.8]]);
    const allowed=new Set(['iris|violet','jasmine|tuberose','blackberry|black_cherry','cedar|sandalwood','cognac|rum']); const key=(a,b)=>[a,b].sort().join('|');
    const niche={pear:{dims:['A','D','G','J'],threshold:.235,span:.075,cap:.42},grapefruit:{dims:['A','C','D','G','I'],threshold:.225,span:.05,cap:.34},lemon:{dims:['A','C','D','G','I'],threshold:.18,span:.065,cap:.36},mint:{dims:['C','D','G','H'],threshold:.215,span:.065,cap:.48},linen:{dims:['B','C','D','G','I','J'],threshold:.175,span:.065,cap:.4},soap:{dims:['C','D','G','H','J'],threshold:.225,span:.065,cap:.34},neroli:{dims:['A','D','E','G','I','J'],threshold:.215,span:.065,cap:.3},bergamot:{dims:['A','C','D','E','G','I','J'],threshold:.195,span:.06,cap:.34}};
    const perfumeNiche={P007:{threshold:.34,span:.16,cap:1.1},P034:{threshold:.17,span:.13,cap:1.35}};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const dist=(a,b,ds=DIMS)=>Math.sqrt(ds.reduce((s,d)=>s+(a[d]-b[d])**2,0)); const sim=(a,b,ds=DIMS)=>1/(1+dist(a,b,ds));
    function profile(){const sums=Object.fromEntries(DIMS.map(d=>[d,0])),counts=Object.fromEntries(DIMS.map(d=>[d,0]));state.answers.forEach((id,i)=>{const o=DATA.questions[i].options.find(x=>x.id===id);Object.entries(o.scores).forEach(([d,v])=>{sums[d]+=v;counts[d]++})});return Object.fromEntries(DIMS.map(d=>[d,Number((sums[d]/counts[d]).toFixed(2))]));}
    function nicheBonus(p,f){const t=niche[f.id];if(!t)return 1;const s=sim(p,f,t.dims),a=Math.max(0,Math.min(1,(s-t.threshold)/t.span));return 1+a*t.cap;}
    function baselines(){const sums=Object.fromEntries(DIMS.map(d=>[d,0])),counts=Object.fromEntries(DIMS.map(d=>[d,0]));DATA.questions.forEach(q=>q.options.forEach(o=>Object.entries(o.scores).forEach(([d,v])=>{sums[d]+=v;counts[d]++})));const e=Object.fromEntries(DIMS.map(d=>[d,sums[d]/counts[d]]));const raw=DATA.factors.map(f=>[f.id,sim(e,f)*f.roles.main]);const med=raw.map(x=>x[1]).sort((a,b)=>a-b)[24];return new Map(raw.map(([id,v])=>[id,v/med]));}
    const factorBase=baselines();
    function scoredFactors(p,role){return DATA.factors.map(f=>({...f,similarity:sim(p,f),score:sim(p,f)*f.roles[role]/(role==='main'?Math.pow(factorBase.get(f.id),.95):1)*(role==='main'?(f.family==='CLEAN'?1+Math.min(.18,['D','G','I','J'].filter(d=>Math.abs(p[d]-f[d])<=1.15).length*.045):1):1)*nicheBonus(p,f)})).sort((a,b)=>b.score-a.score)}
    function familyPenalty(c,s){if(!s.length)return 1;if(!s.some(x=>x.family===c.family))return 1;if(s.some(x=>allowed.has(key(x.id,c.id))))return .9;return .35}
    function diversity(c,s){if(!s.length)return 1;const m=Math.min(...s.map(x=>dist(c,x)));if(m<1.5)return .82;if(m<=3.5)return 1;return compat.get(key(s[0].id,c.id))>.5?1.05:1}
    function coverage(c,s,p){const top=[...DIMS].sort((a,b)=>p[b]-p[a]).slice(0,3),before=new Set(s.flatMap(f=>top.filter(d=>f[d]>=p[d]))),n=top.filter(d=>c[d]>=p[d]&&!before.has(d)).length;return 1+Math.min(.15,n*.05)}
    function combo(p){const main=scoredFactors(p,'main')[0],textures=DATA.factors.map(f=>{const s=sim(p,f)*nicheBonus(p,f),co=compat.get(key(main.id,f.id))||0;return {...f,score:s*f.roles.texture*familyPenalty(f,[main])*(1+co*.2)*diversity(f,[main])}}).sort((a,b)=>b.score-a.score).slice(0,12);let best=null;for(const t of textures.filter(x=>x.id!==main.id)){const bases=DATA.factors.filter(f=>f.id!==main.id&&f.id!==t.id).map(f=>{const s=sim(p,f)*nicheBonus(p,f),co=((compat.get(key(main.id,f.id))||0)+(compat.get(key(t.id,f.id))||0))/2;return {...f,score:s*f.roles.base*familyPenalty(f,[main,t])*(1+co*.2)*diversity(f,[main,t])*coverage(f,[main,t],p)}}).sort((a,b)=>b.score-a.score).slice(0,16);for(const b of bases){const co=((compat.get(key(main.id,t.id))||0)+(compat.get(key(main.id,b.id))||0)+(compat.get(key(t.id,b.id))||0))/3,cover=Math.min(1.15,coverage(t,[main],p)*coverage(b,[main,t],p),1.15),score=main.score*.45+t.score*.25+b.score*.3+co*.1+cover*.15;if(!best||score>best.score)best={main,texture:t,base:b,score}}}return best}
    function factorMatch(c,p){return [[c.main.id,.5],[c.texture.id,.25],[c.base.id,.25]].reduce((s,[id,w])=>{const direct=p.coreFactors[id]||0,near=Object.entries(p.coreFactors).reduce((m,[o,v])=>Math.max(m,v*(compat.get(key(id,o))||0)),0);return s+w*Math.min(1,direct+near*.35)},0)}
    function recommend(p,c){const raw=DATA.perfumes.map(x=>({...x,profile:perfumeProfile(x),personality:sim(p,perfumeProfile(x)),baseline:sim(population(),perfumeProfile(x)),match:factorMatch(c,x)}));const med=raw.map(x=>x.baseline).sort((a,b)=>a-b)[30];const values=raw.map(x=>({...x,adjusted:x.personality*Math.pow(med/x.baseline,.5)}));const norm=k=>{const a=values.map(x=>x[k]),mi=Math.min(...a),ma=Math.max(...a);return v=>ma===mi?1:(v-mi)/(ma-mi)};const rn=norm('recognition'),cn=norm('classic'),sn=norm('personalityStrength');const scored=values.map(x=>{const t=perfumeNiche[x.id],bonus=t&&x.match>t.threshold?1+Math.min(1,(x.match-t.threshold)/t.span)*t.cap:1;return {...x,first:x.adjusted*bonus*.72+x.match*.2+rn(x.recognition)*.04+cn(x.classic)*.04,alt:x.adjusted*bonus*.65+x.match*.25+rn(x.recognition)*.05+sn(x.personalityStrength)*.05}});const first=[...scored].sort((a,b)=>b.first-a.first)[0];return [first,...scored.filter(x=>x.id!==first.id).sort((a,b)=>b.alt-a.alt)]}
    function population(){const sums=Object.fromEntries(DIMS.map(d=>[d,0])),counts=Object.fromEntries(DIMS.map(d=>[d,0]));DATA.questions.forEach(q=>q.options.forEach(o=>Object.entries(o.scores).forEach(([d,v])=>{sums[d]+=v;counts[d]++})));return Object.fromEntries(DIMS.map(d=>[d,sums[d]/counts[d]]));}
    function perfumeProfile(p){const f=new Map(DATA.factors.map(x=>[x.id,x])),out=Object.fromEntries(DIMS.map(d=>[d,0]));Object.entries(p.coreFactors).forEach(([id,w])=>DIMS.forEach(d=>out[d]+=f.get(id)[d]*w/p.weightTotal));return out}
    const traitCopy={FLORAL:['细腻','有画面感'],FRUIT:['有生命力','不按常理'],CITRUS:['清醒','有分寸'],GREEN:['好奇','自由'],WOODY:['稳定','有重量'],SPICE:['锋利','有记忆点'],BOOZY:['成熟','有欲望'],GOURMAND:['丰盛','会享受'],DARK:['深沉','有力量'],CLEAN:['克制','让人想靠近']};
    const materialIcons={FLORAL:'<circle cx="9" cy="9" r="2.2"/><path d="M9 6.2c-2.5-4-5.8-.9-3.7 1.5C1 7.8 1.4 12.4 5 11.4 4.1 15.2 8.2 16.1 9 12.5c1.2 3.4 5.1 2 3.9-1.1 3.6.7 4-3.8.1-3.7C15.1 4.4 10.7 2.7 9 6.2Z"/>',FRUIT:'<circle cx="8" cy="10" r="4.4"/><path d="M11 5.8c.3-2 1.5-3.1 3.6-3.2-.3 2-1.3 3.1-3.6 3.2Z"/><path d="M8 5.6c.8-1.6 2-2.4 3.6-2.5"/>',CITRUS:'<circle cx="9" cy="9" r="5.2"/><path d="M9 3.8v10.4M3.8 9h10.4M5.3 5.3l7.4 7.4M12.7 5.3l-7.4 7.4"/>',GREEN:'<path d="M14.5 2.8C7.5 3 3.7 6.5 3.5 13.8c7.2.2 10.8-3.8 11-11Z"/><path d="M3.8 13.6c2.5-2.5 4.9-4.5 8-6.2"/>',WOODY:'<circle cx="9" cy="9" r="5.3"/><path d="M4.1 9c1.6-1.2 3-.4 4.4.3 1.4.7 2.9 1.5 5.4.2M5.5 5.7c1.1.8 2.1 1 3.2.7 1.2-.3 2.1-.8 3.7-.1"/>',SPICE:'<path d="m9 2.5 1.7 4.7 4.8 1.8-4.8 1.7L9 15.5l-1.7-4.8-4.8-1.7 4.8-1.8L9 2.5Z"/>',BOOZY:'<path d="M7 2.5h4M8 2.5v4l-2.2 3.2c-1.2 1.8-.3 5.2 3.2 5.2s4.4-3.4 3.2-5.2L10 6.5v-4"/><path d="M6.2 10.1h5.6"/>',GOURMAND:'<path d="M9 2.5c2.5 3.1 4.2 5.5 4.2 8a4.2 4.2 0 0 1-8.4 0c0-2.5 1.7-4.9 4.2-8Z"/><path d="M7.1 11.4c.2 1.1.9 1.8 1.9 2"/>',DARK:'<path d="M12.8 3.4a5.8 5.8 0 1 0 1.1 10.8A5.7 5.7 0 0 1 12.8 3.4Z"/><path d="M5 5.1h.1M3.8 8.2h.1"/>',CLEAN:'<path d="M3.5 5.2h11M3.5 9h11M3.5 12.8h11"/><path d="M6 3.5v11M10 3.5v11M14 3.5v11"/>'};
    function materialIcon(f){return `<span class="material-icon" aria-hidden="true"><svg viewBox="0 0 18 18">${materialIcons[f.family]||materialIcons.GREEN}</svg></span>`}
    const dimensionLabels={A:'温度',B:'外放度',C:'锋利度',D:'浓郁度',E:'野性度',F:'感性度',G:'距离感',H:'实验度',I:'明暗度',J:'欲望度'};
    let state={screen:'intro',index:0,answers:[]},last=null;const app=document.getElementById('app');
    function intro(){app.innerHTML=`<section class="screen fade-in"><div class="intro"><div class="eyebrow">Bridge Test · Fragrance Personality</div><h1>你的内在香气<br>闻起来是什么味道</h1><p class="lead">有些人像刚洗好的白衬衫，有些人像夜里打开的一瓶酒。用 30 个问题，找到最接近你的三层香气，以及一支真正像你的香水。</p><p class="intro-note">这不是专业心理量表，也没有标准答案。凭第一反应选择，结果会更接近你此刻真实的气质。</p><button class="button" data-action="start">开始测试</button></div></section>`}
    function quiz(){const q=DATA.questions[state.index],selected=state.answers[state.index]||'',pct=Math.round((state.index/ DATA.questions.length)*100);app.innerHTML=`<section class="screen quiz-screen fade-in"><div class="quiz-header"><div class="progress-wrap"><div class="progress-label">${pct}% 完成</div><div class="progress"><span style="width:${pct}%"></span></div></div><div class="question-count">${String(state.index+1).padStart(2,'0')} / ${DATA.questions.length}</div></div><div class="question-card"><div class="eyebrow">Question ${String(state.index+1).padStart(2,'0')}</div><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${selected===o.id?'selected':''}" data-option="${o.id}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="option-text">${esc(o.text)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="button secondary" data-action="prev" ${state.index===0?'disabled':''}>上一题</button><button class="button" data-action="next" ${selected?'':'disabled'}>${state.index===DATA.questions.length-1?'查看结果':'下一题'}</button></div></div></section>`}
    function result(){const p=profile(),c=combo(p),rec=recommend(p,c),factors=[c.main,c.texture,c.base],headline=factors.map(f=>f.phrase).join(' × ');last={p,c,rec};const traits=[...new Set(factors.flatMap(f=>traitCopy[f.family]||[]))].slice(0,5);app.innerHTML=`<section class="results fade-in"><div class="result-hero"><div class="eyebrow">Your Inner Fragrance</div><h1>你的内在香气</h1><div class="result-name">${factors.map(f=>esc(f.label.split(' ')[0])).join(' × ')}</div><p class="headline">${esc(headline)}</p></div><div class="result-layout"><div><section class="copy-section"><h2>主调｜${esc(c.main.label.split(' ')[0])}</h2><p>你给人的第一感觉，通常是${esc(c.main.phrase)}。你不需要刻意解释自己，气质会先于语言抵达。</p></section><section class="copy-section"><h2>肌理｜${esc(c.texture.label.split(' ')[0])}</h2><p>真正靠近你以后，会发现你还有${esc(c.texture.phrase)}的一面。熟悉之后，你比第一眼更有层次。</p></section><section class="copy-section"><h2>底色｜${esc(c.base.label.split(' ')[0])}</h2><p>更深的地方，你保留着${esc(c.base.phrase)}。它不总是主动展示，却决定了你最后留下的印象。</p></section><div class="conclusion">你不是一种固定的味道，而是一种会在靠近之后慢慢展开的气息。</div><div class="keyword-list">${traits.map((t,i)=>`<div class="keyword">${esc(t)}<small>0${i+1}</small></div>`).join('')}</div><section class="recommendations"><h2>最像你的香水</h2><div class="perfume-list">${rec.slice(0,4).map((x,i)=>`<article class="perfume-card"><div><div class="perfume-brand">${esc(x.brand)}</div><div class="perfume-name">${esc(x.name)}</div><div class="perfume-note">${i===0?'与你的三层香气高度相合':'如果你想让这份气质更换一种表达'}</div></div><div class="perfume-score">${Math.round(84-i*5)}%</div></article>`).join('')}</div></section><p class="disclaimer">匹配值是一次自我观察的展示，不是概率，也不是专业诊断。香气没有标准答案。</p><div class="result-actions"><button class="button" data-action="restart">再测一次</button></div></div><aside class="side-sticky"><div class="share-card"><strong>我的内在香气</strong><p>${esc(factors.map(f=>f.label.split(' ')[0]).join(' × '))}<br>${esc(headline)}</p></div></aside></div></section>`}
    function render(){if(state.screen==='intro')intro();else if(state.screen==='quiz')quiz();else result();window.scrollTo({top:0,behavior:'smooth'})}
    app.addEventListener('click',e=>{const option=e.target.closest('[data-option]');if(option){state.answers[state.index]=option.dataset.option;quiz();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='start'){state={screen:'quiz',index:0,answers:[]};render()}if(action==='prev'&&state.index>0){state.index--;render()}if(action==='next'&&state.answers[state.index]){if(state.index===DATA.questions.length-1){state.screen='result';render()}else{state.index++;render()}}if(action==='restart'){state={screen:'intro',index:0,answers:[]};render()}});render();
  </script>
  <script>
    const materialTitleObserver=new MutationObserver(()=>{const combo=last?.c;if(!combo)return;[combo.main,combo.texture,combo.base].forEach((factor,i)=>{const heading=document.querySelectorAll('.copy-section h2')[i];if(heading&&!heading.classList.contains('material-title')){heading.classList.add('material-title');heading.insertAdjacentHTML('beforeend',materialIcon(factor));}})});
    materialTitleObserver.observe(document.getElementById('app'),{childList:true,subtree:true});
  </script>
</body>
</html>
