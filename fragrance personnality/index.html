望。你并不需要永远处在高潮里。你只是想保留一种能力：当真正重要的东西出现时，我还认得出自己的心动。"]},{"family":"果香调 Fruity","subtype":"桃李","first_line":"你像成熟桃李柔软的果肉：不锋利，却很容易留下触感。","core_perfume":"Byredo — Bibliothèque","radar":{"明亮":72,"柔软":82,"尖锐":30,"深邃":45,"清冷":25,"温暖":78,"克制":25,"丰盛":72},"copy_perfume":["Byredo — Bibliothèque","李子的成熟果感在最前面，随后慢慢沉进紫罗兰、皮革、桦木、广藿香和香草里。它并不是一支明亮的新鲜水果香，更像果实已经成熟，触感变得柔软，旁边还有旧书页、木头和皮革留下的温度。","当你想要表现出这样的一面时，你可以穿这支香水：柔软、成熟、靠近皮肤。你想表现的不是热闹的甜，而是那种相处久了以后才出现的亲密——熟悉、舒服，有很多只属于彼此的小细节。"],"copy_main":["你的气味轮廓很柔软，也很暖。它不是奶油式的包裹，而是一种成熟果肉的触感：有水分，有重量，靠近的时候甚至会让人想到皮肤。你很重视这种具体的亲近。","比起一段关系有没有很多戏剧性时刻，你往往更容易被日常里那些细小的东西打动。对方记得你不吃什么，知道你累的时候更想安静，走路时自然地等你半步，或者某一天什么都没安排，两个人仍然可以舒服地待很久。这种东西在别人看来可能太普通。可对你来说，真正的亲密本来就不是只发生在高光时刻。它更像生活慢慢把两个人的边缘磨得熟悉。你开始知道对方的节奏，对方也慢慢知道你的。不是失去自己，而是彼此之间出现一种不需要反复解释的舒适。","所以你对关系的要求其实并不低。表面的热情很容易，真正让你留下来的，是一个人能不能进入你的日常，而且进入以后没有让日常变得更累。你要的是一种有触感的感情。不是“我知道你爱我”，而是我在很多很小的地方，都确实感觉得到。"],"copy_hidden":["你看起来柔软，但这种柔软并不等于谁都可以靠近。恰恰因为你很看重亲密，所以你对身体距离、情绪气氛和相处细节其实很敏感。有些人没有做错什么，你却就是很难真正放松；有些关系条件看起来很好，但你始终感觉自己在“做关系”，而不是自然地生活。这种时候，你很难靠理性说服自己。因为对你来说，舒服不是一个附加项。它本身就是判断关系是否适合的重要证据。你真正想要的不是一直被照顾，而是：在这个人身边，我可以自然地成为自己，而不用时时调整姿势。"]},{"family":"果香调 Fruity","subtype":"热带果","first_line":"你像被阳光晒熟的热带水果：汁水、热度和生命力都很直接。","core_perfume":"Vilhelm Parfumerie — Mango Skin","radar":{"明亮":92,"柔软":62,"尖锐":45,"深邃":30,"清冷":20,"温暖":82,"克制":15,"丰盛":90},"copy_perfume":["Vilhelm Parfumerie — Mango Skin","芒果和黑莓一上来就非常饱满，中间又有黑胡椒把果肉的甜推得更有张力。随后是鸢尾、黑莲花、茉莉，最后落进广藿香、香草和一点粉红糖感里。它并不安静，而是很像一种已经成熟到快要溢出来的生命力。","当你想要表现出这样的一面时，你可以穿这支香水：热烈、开放、想真正去经历。你不是只想知道世界上还有什么，而是会想亲自走进去，看一看、试一次、让生活真的发生在自己身上。"],"copy_main":["你的气味轮廓很亮、很热、很丰盛。如果说莓果的快乐像路边突然发现的一小片野果，热带果更像整片阳光一下扑到身上。颜色很浓，空气很热，果实成熟得几乎快要裂开。你的生命力也更偏向这种“我想亲自进去”的形式。你容易对陌生的地方、新的活动、不同的生活方式产生兴趣。只是听别人说通常不太够；如果有机会，你会更想自己去一次、做一次，看看真实感受到底是什么。你需要生活偶尔超出原来的边界。","不是因为现在的一切都不好，而是如果日子太久没有任何变化，你会开始感觉自己的感受也跟着变钝。新的环境会重新打开注意力，让你注意光线、声音、人的状态，甚至注意到一个和平时不同的自己。所以你很难完全理解“为什么要折腾”。对你来说，有些折腾本身就是生活。一次旅行、一个临时决定、一项以前没做过的活动，即使最后没有成为长期爱好，也可能因为它让你的世界扩大了一点，而依然值得。你的快乐很身体化。","不是在脑子里知道“这应该很有趣”，而是真的想去看、去吃、去走、去碰到新的东西。"],"copy_hidden":["因为你很容易对新的东西兴奋，别人可能会觉得你只是追求刺激。其实真正让你难受的不是平静。而是停滞。你完全可以享受熟悉的人和生活，只要里面仍然有一点流动：新的计划、新的话题、新的地方，甚至只是换一种方式过同一天。一旦很久没有这种变化，你可能会比自己想象中更容易烦躁。因为你需要的并不是不断逃离现在。你是在通过新的体验不断确认：世界还很大，而我和世界之间仍然有东西正在发生。这也是你身上最有感染力的一部分。","你不是只想“拥有更多”，你是真的还对生活本身抱有胃口。"]},{"family":"花香调 Floral","subtype":"玫瑰","first_line":"你像一朵完全展开的玫瑰：柔软是真的，枝上的刺也是真的。","core_perfume":"Frédéric Malle — Portrait of a Lady","radar":{"明亮":60,"柔软":70,"尖锐":50,"深邃":65,"清冷":30,"温暖":70,"克制":50,"丰盛":90},"copy_perfume":["Frédéric Malle — Portrait of a Lady玫瑰在这里并没有被做成单纯的柔美。高浓度玫瑰被黑加仑、覆盆子和丁香托起，下面又压着广藿香、檀香和焚香。花很盛，但骨架同样很清楚。","当你想要表现出这样的一面时，你可以穿这支香水：丰盛、完整、有分量。你可以非常柔软，也可以非常认真地爱，但所有靠近都建立在一个前提上：你仍然是你自己。"],"copy_main":["你的气味轮廓是丰盛的、温暖的，却并不松散。玫瑰很容易被误解成一种单纯的浪漫。可真正完整的玫瑰从来不只有花瓣。它有湿润的香气，有颜色，有柔软，也有枝条和刺。你对感情的理解也更接近这种完整。","你可以很认真地进入一段关系，也愿意表达爱、关心和偏爱。你不是那种必须始终保持安全距离，才觉得自己没有失去力量的人。对你来说，真正的力量反而是——我可以很深地感受，也仍然知道自己的位置在哪里。所以你在关系里最看重的，往往不是谁更冷静，谁更占上风。而是尊重。","一个人可以和你意见不同，可以有自己的生活，甚至可以让你难过，但如果他开始把你的温柔当成理所当然，把你的投入理解成可以无限退让，你会非常快地感觉到某种东西正在失去平衡。你不是不愿意让步。你只是不喜欢靠缩小自己来维持爱。这也是玫瑰真正好看的地方：它不需要因为柔软就删除锋利，也不需要为了证明强大，就拒绝开放。你更接近一种很完整的状态——我可以盛开，但我不因此失去自己的形状。"],"copy_hidden":["你真正冷下来的时候，往往比别人预想得更彻底。因为你平时愿意表达、愿意投入，也愿意给机会，所以别人容易以为你的边界可以一直往后退。其实很多时候，你不是没有察觉，只是在认真衡量一段关系值不值得继续修复。当你最终确认一件事已经伤到了尊严，而不是普通的摩擦，你会突然变得很清楚。不是因为感情消失得快。而是你很难接受一份爱最后需要以否定自己为代价。所以你身上的刺从来不是为了让人不敢靠近。它只是提醒所有靠近的人：这里有柔软，也有一个完整的人。"]},{"family":"花香调 Floral","subtype":"茉莉","first_line":"你像夜里自然散开的茉莉：不急着收住自己，感受会先于解释抵达。","core_perfume":"Mugler — Alien Eau de Parfum","radar":{"明亮":70,"柔软":78,"尖锐":35,"深邃":55,"清冷":25,"温暖":75,"克制":30,"丰盛":92},"copy_perfume":["Mugler — Alien Eau de Parfum","它几乎把茉莉推到了整个香气的中央。明亮而浓郁的茉莉 Sambac 被 Cashmeran 木质感托住，再被白琥珀包裹。花香很直接，却不是轻飘的。当你想要表现出这样的一面时，你可以穿这支香水：有生命力、愿意靠近、感受鲜明。你不太想把所有情绪都先整理成正确答案，再允许自己表达。"],"copy_main":["你的气味轮廓很丰盛，也很柔软。茉莉不是一种安静待在瓶子里的花。尤其到了夜里，它会自己向空气里扩散。不是刻意表现，却很难完全忽略。你的感受也常常有类似的流动感。","开心的时候，你很难把自己装得特别冷；真的难过，也不一定觉得“情绪被看见”是一件多么丢脸的事。你对人与人之间的连接有一种天然的信任：如果我真的在乎，那么这件事被感觉到并没有什么不好。你也容易被真实的情绪打动。一个人承认自己很想念、很害怕、很开心，或者说出一句并不完美但确实出自真心的话，往往比一段控制得非常好的表达更容易让你靠近。因为你在意的是“活的”。不是每句话都正确，不是每个情绪都漂亮，而是一个人真的在这里，真的有反应，真的愿意和别人发生连接。","这也让你对关系中的空气非常敏感。一段关系如果长期所有人都很礼貌、很理性、很会处理，却很少再有真正的感受流动，你会渐渐觉得某种东西正在变薄。你需要的不是戏剧，而是情绪还有温度，关系还有生命。"],"copy_hidden":["因为你愿意表达，别人有时会觉得你应该也很容易放下。可真正进入你感受里的东西，未必消失得那么快。一句话可能当时已经谈开了，你还是会记得说那句话时对方的表情；一段关系已经翻篇了，某些很细的气氛仍然可能在很久以后重新回来。你的记忆很多时候不是事件式的，而是感受式的。所以你并不只是“情绪来得快”。你只是允许感受先出现，而不是先要求它证明自己的合理性。这让你容易受影响，也让你拥有一种很强的能力：你真的可以被世界打动。"]},{"family":"花香调 Floral","subtype":"晚香玉","first_line":"你像夜里盛开的晚香玉：白得明亮，却有几乎压不住的浓度。","core_perfume":"Frédéric Malle — Carnal Flower","radar":{"明亮":55,"柔软":70,"尖锐":45,"深邃":75,"清冷":20,"温暖":82,"克制":20,"丰盛":98},"copy_perfume":["Frédéric Malle — Carnal Flower这里的晚香玉不是温顺白花。最开始有瓜果和植物的青绿感，随后极高浓度的晚香玉慢慢显出乳白、樟脑感、甚至微妙的动物性，最后落到白麝香与奶感里。当你想要表现出这样的一面时，你可以穿这支香水：有存在感、有吸引力、不怕浓度。你不想把真正重要的东西都处理得淡淡的，只为了显得从容。"],"copy_main":["你的气味轮廓非常丰盛，也明显偏暖、偏深。晚香玉是一种很难只当背景的花。它可以有刚摘下来时的绿色和清凉，也可以在体温里慢慢变得奶白、厚重、近乎令人眩晕。它同时有花的洁白和一种很难称为“乖”的肉感。你对真正重要的人和事，也往往需要这样的浓度。你不一定每天都想活得轰轰烈烈。大部分时候，你完全可以安静、正常，甚至相当理智。但当某件东西真的进入你的核心，你希望自己能够明确感觉到它。喜欢是有重量的，吸引是有方向的，重要的人和普通的人之间应该有区别。","你不喜欢把一切都处理得过于安全。因为如果一个人为了避免受伤，把期待调低、把欲望调低、把感受也一起调低，最后当然比较稳定，可那种稳定未必真的让你觉得活着。你真正需要的并不是永远强烈。而是生命里始终存在一些东西，值得你产生强烈反应。晚香玉的丰盛就在这里。它并不道歉。它只是让整个空间知道：这里有东西正在盛开。"],"copy_hidden":["你的高浓度并不等于你没有分寸。事实上，正因为你知道自己的感受可以很强，你反而未必会把所有强度都立刻表现出来。有些时候，你会先观察：这个人接不接得住，这件事值不值得，我的投入有没有地方可以落下。所以真正进入你核心的人，看到的你往往比普通人看到的更热、更直接，也更有欲望。而真正让你失望的，也很少只是“事情没成”。更可能是你发现，自己如此认真地感受过，而对面却始终只愿意停留在浅层。你要的不是永远轰烈。","你只是不想让最重要的部分，最后变成一句轻描淡写的“都行”。"]},{"family":"花香调 Floral","subtype":"鸢尾","first_line":"你像一层冷而细的鸢尾粉末：柔软，却始终隔着一点距离。","core_perfume":"Prada — Infusion d’Iris","radar":{"明亮":45,"柔软":72,"尖锐":45,"深邃":70,"清冷":65,"温暖":40,"克制":75,"丰盛":65},"copy_perfume":["Prada — Infusion d’Iris","鸢尾在这里被处理得非常干净。Iris Pallida 被橙花、柑橘轻轻提亮，最后落在安息香的柔和底色上。它不是浓重的花香，更像一层贴着皮肤和布料的冷淡粉雾。当你想要表现出这样的一面时，你可以穿这支香水：敏感、克制、安静。你并不是没有情绪，只是很多感受在真正说出口以前，已经先在心里经过了很长一段路。"],"copy_main":["你的气味轮廓柔软、偏冷，也明显克制。鸢尾最迷人的地方之一，是它明明属于花，却很少给人湿润盛放的感觉。它更容易让人想到粉末、纸张、根茎、干净皮肤，甚至某种灰白的光。柔软是真实的，可它总像隔着半步。你处理自己的感受也经常如此。事情发生的第一秒，你未必立刻知道自己到底怎么想。甚至别人问你“你是不是不开心”，你可能真的还没有答案。你需要先让感觉在身体里待一会儿。它会慢慢沉淀、分层，然后你才开始知道：原来让我介意的是这个，原来那句话留下来的并不是生气，而是某种很难命名的失望。","所以你的表达通常比情绪慢。这并不是隐藏，也不完全是防备。更多时候，是因为你不喜欢在自己还没有真正理解时，就把一个复杂的感受压缩成一句过于简单的话。你宁愿晚一点说，也希望那句话确实接近自己。你的距离感因此常常很微妙。你愿意亲近，却不喜欢所有东西都需要即时共享。对你来说，一个人的内心仍然应该保留一些不必立刻被翻译、不必马上被理解的空间。"],"copy_hidden":["别人容易把你的克制理解成冷静。可你真正安静的时候，内心可能已经发生了很多层变化。你不是没有被一句话刺到，也不是没有因为一个细节反复想很久。只是你习惯让这些东西先停留在内部，而不是立刻变成外部事件。这让你看起来比实际更加平稳。可也正因为如此，一旦你真的开口说出一件很私人的感受，那往往不是随口而来的。它通常意味着：这件事已经在你心里存在了很久，而你决定让另一个人看见。"]},{"family":"花香调 Floral","subtype":"橙花","first_line":"你像晒过太阳的橙花：柔和、干净，靠近时仍有空气流动。","core_perfume":"Diptyque — Eau des Sens","radar":{"明亮":82,"柔软":78,"尖锐":25,"深邃":45,"清冷":40,"温暖":68,"克制":45,"丰盛":70},"copy_perfume":["Diptyque — Eau des Sens","它并没有只取橙花最柔美的一面，而是把整棵苦橙树一起放进香气里：花、枝叶、果实，再加入当归根、杜松与广藿香。白花是明亮的，周围却始终有青绿和微苦的空气。当你想要表现出这样的一面时，你可以穿这支香水：温柔、清醒、很好靠近，但不会黏住谁。你喜欢关系有温度，也同样珍惜两个人之间仍然有空气。"],"copy_main":["你的气味轮廓很明亮，也很柔软。但它和茉莉不一样。茉莉更像情绪自然地向外流动，而橙花的柔软里始终留着一块清爽的空间。它可以靠近皮肤，可以温柔，却不会把整个空气填满。你喜欢的关系也更接近这种状态。有温度，能表达关心，愿意在重要的时候认真出现。但不需要时时刻刻确认，不需要靠大量的情绪交换证明彼此还在，也不需要因为亲密就自动共享所有时间和注意力。你很看重“舒服”。可这种舒服不是浅。它反而建立在一种相当清楚的信任上：我知道你在乎我，所以今天各自忙自己的事情也没有关系；我知道这段关系存在，所以不用每一次安静都被解释成疏远。","这使你对过度黏连非常敏感。不是因为你不喜欢爱，而是当爱开始变成一种持续需要回应、需要解释、需要证明的任务，它原本的柔软就会迅速消失。你真正想要的是一种会呼吸的亲密。靠近是真的，自由也是真的。"],"copy_hidden":["你看起来很好相处，因为你通常不会把关系弄得过度紧张。但这不代表你对距离没有要求。相反，你可能比很多看起来更独立的人，更早感受到一种关系什么时候开始“太满了”。太多追问、太多确认、太多需要随时报告的细节，都可能让你一点点向后退。而这种后退通常并不激烈。你不一定马上争吵，也不一定立刻指出哪里有问题。只是原本自然流动的靠近，会渐渐变得没那么主动。所以对你来说，最舒服的爱从来不是抓得最紧的那一种。","而是两个人都知道：我随时可以呼吸，但我仍然愿意回到你身边。"]},{"family":"东方调 Oriental","subtype":"焚香","first_line":"你像一缕缓慢升起的焚香：越安静，越能感觉到它往更深处走。","core_perfume":"Armani Privé — Bois d’Encens","radar":{"明亮":20,"柔软":35,"尖锐":45,"深邃":95,"清冷":55,"温暖":55,"克制":85,"丰盛":70},"copy_perfume":["Armani Privé — Bois d’Encens","它几乎没有多余的甜。焚香是核心，香根草和雪松把它压得更干、更静，也更接近石头、木头和空气里的烟。它不是为了讨好，而是为了制造一种很明确的内部空间。当你想要表现出这样的一面时，你可以穿这支香水：安静、深邃、有一点难靠近，但并不冷漠。你只是更愿意先把注意力收回来，听清楚自己到底在想什么。"],"copy_main":["你的气味轮廓很深，也很克制。","焚香最迷人的地方，是它并不会一下把房间填满。它只是慢慢升起来，先有烟，再有木头，再有一点温热和灰烬。越靠近，越容易感觉到它里面并不是空，而是层层往里收。你也更习惯这种向内的方式。","遇到真正重要的事情，你很少满足于“事情就是这样”。你会继续往下问：为什么我会这么在意？这件事到底改变了什么？如果把眼前的情绪拿开，我真正相信的又是什么？你并不一定总能立刻得到答案。可对你来说，问题本身很多时候就值得被保留。","这也是你和很多人不同的地方。别人可能更想尽快解决、尽快翻篇，而你有时会愿意让一个问题在自己心里多待一阵。不是为了折磨自己，而是你知道，有些真正重要的东西，本来就需要时间沉下去，才会露出更深的一层。所以你对“精神空间”有很高的需求。一个人待着、读东西、散步、发呆、反复想一个问题，对别人来说可能像是在暂停；对你来说，却常常是重新找到方向的方式。你并不排斥现实。只是你很难接受一种只剩下现实、却没有意义的生活。","你需要知道自己为什么在做，为什么在爱，为什么还愿意继续。你真正想守住的，是一种内在方向感。"],"copy_hidden":["因为你很习惯自己消化，别人有时会觉得你并不需要被理解。其实你很需要。只是你想要的理解，不是对方马上给你一个结论，也不是不断追问“你到底怎么了”。你更需要的是一种允许：允许你还没想清楚，允许你暂时不说，允许有些问题没有马上能回答的版本。真正让你靠近的人，往往不是最会说话的人。而是那些能和你一起停在一个问题旁边，不急着把它处理掉的人。你的距离感很多时候不是拒绝关系。更像是在保护一种很珍贵的内部秩序：有些东西，我必须先自己听见，才能决定要不要交给别人。"]},{"family":"东方调 Oriental","subtype":"树脂琥珀","first_line":"你像被时间慢慢加热的树脂：不是一下子亮起来，而是越来越有重量。","core_perfume":"Serge Lutens — Ambre Sultan","radar":{"明亮":15,"柔软":45,"尖锐":35,"深邃":95,"清冷":25,"温暖":90,"克制":70,"丰盛":95},"copy_perfume":["Serge Lutens — Ambre Sultan它不是轻盈明亮的琥珀，而是一块被时间放在木盒里、慢慢积出气味的树脂。琥珀、香草、广藿香一起形成一种很厚的温度，甚至带一点药感和干燥感。","当你想要表现出这样的一面时，你可以穿这支香水：沉稳、有分量、不急着证明。你相信真正值得的东西，往往不是第一眼最亮的，而是时间越久，越能看出它到底站不站得住。"],"copy_main":["你的气味轮廓很深、很暖，也很有重量。树脂不是一种瞬间形成的东西。它从树木里慢慢渗出，经过空气、时间、温度，最后变成一种更稠、更暗、更有质感的存在。它不像花那样盛开，也不像果实那样立刻给出甜味。它更像积累本身。你对很多事情的判断，也更相信这种“时间会说话”。","一段关系刚开始时有多热烈，不一定最重要；一个人第一次表现得多优秀，也不一定能让你立刻信任。你更在意的是：过了一段时间以后，他是不是还是这样？做过的承诺有没有落下来？遇到变化以后，原来的选择还能不能继续成立？你对长期价值有一种天然敏感。所以你不太容易被一时的热度彻底说服，也很少因为暂时没有结果，就立刻觉得一件事没有意义。你知道很多真正有分量的东西，本来就慢。能力是慢慢形成的，关系是慢慢累积的，审美会沉淀，判断也会改变。","你并不讨厌新鲜。你只是更在意：当新鲜过去以后，还剩下什么。这种倾向让你的气质显得比实际年龄更稳。你容易对有历史、有材料感、有长期积累的东西产生敬意。不是因为它们“老”，而是你能感觉到其中有时间留下来的厚度。"],"copy_hidden":["你看起来很有耐心，但你真正没有耐心的，是毫无积累的重复。","同样的问题发生很多次，却没人真正改变；一段关系维持很久，却始终没有更深的理解；一个人忙了很多年，却只是把同一种事情重复很多遍——这些反而会让你迅速疲倦。因为你尊重时间，所以你也不喜欢时间被白白消耗。你愿意慢。但这个“慢”必须有东西在里面发生。哪怕变化很小，只要你能感觉到事情正在变深、变稳、变得更有质地，你就可以继续。所以你的长期主义并不是忍耐。而是你相信：真正值得留下来的东西，应该在时间里越来越有内容。"]},{"family":"东方调 Oriental","subtype":"香草琥珀","first_line":"你像暗色琥珀里融进的一点香草：厚重，却没有拒绝柔软。","core_perfume":"Guerlain — Spiritueuse Double Vanille","radar":{"明亮":25,"柔软":78,"尖锐":20,"深邃":80,"清冷":15,"温暖":95,"克制":40,"丰盛":98},"copy_perfume":["Guerlain — Spiritueuse Double Vanille香草在这里非常丰盛，却不只是甜。朗姆把它加热，雪松和木质让它变得更深，安息香、茉莉与依兰又把边缘慢慢包圆。它有包裹感，也有烟熏和木头的阴影。","当你想要表现出这样的一面时，你可以穿这支香水：温暖、成熟、允许自己柔软。你不觉得真正的独立一定意味着“什么都不需要”，也不觉得被照顾会削弱一个人的力量。"],"copy_main":["你的气味轮廓很暖、很丰盛，也有很明显的深度。香草琥珀不是轻飘的甜。它更像一间灯光很暗但很暖的房间。木头、树脂、酒液和香草一起，把空气慢慢压得柔软。你会觉得自己被包住，却不会觉得轻浮。你身上的温柔也更接近这种成熟的温度。你并不把“能扛”当成人的最高价值。当然，你可以承担责任，也可以在需要的时候很独立。但如果一段关系只允许你强大、只允许你可靠、只允许你永远处理好自己，你会慢慢觉得那不是亲密。","真正让你留恋的，是一种可以卸力的地方。在那里，你不用永远保持状态，不用每次都先想清楚再说，不用证明自己足够成熟，才值得被好好对待。你并不排斥依赖。你只是希望依赖不是失去自我，而是两个本来都能站住的人，偶尔愿意把一部分重量交给彼此。这让你对“温暖”有很高的要求。它不能只是嘴上说得好听，也不能只发生在漂亮时刻。你更在意一个人会不会真的注意到你累了，会不会在你状态不好时少要求一点，会不会让你知道——你今天不那么厉害，也没有关系。","你真正珍惜的，是深度里仍然保留温度。"],"copy_hidden":["因为你能照顾别人，别人很容易默认你也是那个“不太需要被照顾”的人。可真正让你心软的，往往恰恰是有人先一步看见你的疲惫。不是大张旗鼓的拯救。可能只是把一件你本来要处理的事接过去，记得你今天没吃饭，或者在你已经很累的时候，不再要求你继续解释。这些东西对你来说很重。因为你并不是缺少能力。你缺少的往往只是一个可以暂时不使用能力的地方。所以你真正想要的柔软，并不是依赖谁才能活。而是：我已经可以照顾好自己，但在你这里，我偶尔可以不用。"]},{"family":"东方调 Oriental","subtype":"辛香琥珀","first_line":"你像被香料点热的琥珀：深色底子里，一直有一点灼人的温度。","core_perfume":"Penhaligon’s — Halfeti","radar":{"明亮":35,"柔软":40,"尖锐":65,"深邃":88,"清冷":20,"温暖":92,"克制":45,"丰盛":92},"copy_perfume":["Penhaligon’s — Halfeti它不是单纯厚重的东方香。葡萄柚先带来一点明亮，随后乌木、玫瑰和辛香料慢慢压上来。里面一直有碰撞：明和暗、花和木、冷空气和热香料。","当你想要表现出这样的一面时，你可以穿这支香水：有张力、有刺激感、不容易被一眼看完。你喜欢深度，但深度如果永远安静不动，也会让你觉得少了一点东西。"],"copy_main":["你的气味轮廓很深、很暖，也带着明显的张力。辛香料最有意思的地方，是它并不只是“热”。黑胡椒、豆蔻、丁香、肉桂，每一种热感都不完全一样。有的尖，有的暖，有的会让人觉得麻，有的会让原本厚重的东西突然活起来。你需要的也是这种被激活的感觉。你可以很享受稳定，也能在熟悉里待很久。但如果生活太久没有任何挑战、任何新观点、任何让你心跳稍微快一点的东西，你会逐渐感觉自己像在自动运行。你喜欢的不是混乱。","是张力。一场真正有内容的争论，一个和自己完全不同的人，一次有风险但有意思的选择，甚至是一项让你重新怀疑原来判断的事情，都可能让你突然变得很有精神。这种刺激并不只是寻求新鲜。它更像一种确认：我还在回应世界。所以你很容易被“有东西的人”吸引。不是最温柔的人，不是最标准的人，而是那些身上有判断、有锋芒、有一点不那么容易预测的部分的人。你不怕不同。某种程度上，你甚至需要一点不同，才能真正产生兴趣。"],"copy_hidden":["你看起来喜欢刺激，但你其实很挑刺激。单纯的吵闹、没有内容的情绪波动、为了制造戏剧而制造戏剧，往往只会让你觉得烦。你真正喜欢的是那种会让自己变得更清醒的碰撞。一个不同观点，如果只是为了反对，你很快会失去耐心；但如果它真的指出了你没有看到的东西，你反而会开始兴奋。所以你追求的不是“永远不平静”。而是一种持续的活性。你希望自己不要太早变成一个什么都已经想好、什么都已经见过、再也不会被改变的人。","你想保留的，是被世界再次点燃的能力。"]},{"family":"木质调 Woody","subtype":"香根草","first_line":"你像一支干燥、清醒的木质香：安静、有根，不需要靠热闹证明自己。","core_perfume":"Frédéric Malle — Vétiver Extraordinaire","radar":{"明亮":38,"柔软":28,"尖锐":74,"深邃":76,"清冷":82,"温暖":32,"克制":88,"丰盛":36},"copy_perfume":["Frédéric Malle — Vétiver Extraordinaire","它没有把香根草处理成沉闷的泥土，而是保留了根系本身干燥、微苦、清醒的质感。佛手柑、苦橙和粉红胡椒把轮廓拉得更利落，雪松、檀香、橡木苔与麝香再把它稳稳压回地面。","当你想要表现出这样的一面时，你可以穿这支香水：清醒、安静、有根。哪怕外界不断变化，你也不需要急着证明自己没事——你更相信自己有能力慢慢重新长回来。"],"copy_main":["你的气味轮廓偏冷、偏干、偏克制。就像扎进湿润泥土里的香根草，干燥、清醒，带着微苦的根系感。","香根草不是那种第一秒就扑面而来的气味。它更像泥土下面纵深生长的根——地面发生什么，它都先往下扎。风吹过、雨落下来、环境改变，它并不会要求一切恢复原样，而是在新的地方重新找到可以站住的位置。这也是你身上很明显的一种力量。","你未必执着于让所有事情始终按照计划发生。真正重要的是，无论外界怎样变化，你最后都能重新找回自己的判断、节奏和生活秩序。你对“稳定”的理解不是一成不变，而是：我知道自己即使被打乱，也有能力重新长出来。所以你给人的感觉往往比实际经历显得更平静。","你不太需要通过夸张的表达证明自己，也不容易因为短暂的失控就彻底否定之前的一切。遇到问题时，你更习惯先撑住最基本的部分：吃饭、睡觉、工作、把今天过完。然后一点一点，状态重新回来。你的锋利也并不浮在表面。","香根草有一点天然的苦，有土壤、草根和被雨水打湿之后的冷意。对应到人身上，就是你并不特别迷恋“永远积极”“永远柔软”这种漂亮答案。你知道生活很多时候就是有不舒服、有损耗、有无法控制的变化，而成熟并不是假装这些东西不存在。你更在意的是：发生以后，我还能不能继续生活。这让你的气质里有一种很安静的生命力。不是明亮地向外生长，而是即使没人看见，根系也还在向下延伸。"],"copy_hidden":["因为你很会自己恢复，别人有时会误以为你并不需要被照顾。","你也确实不太喜欢把自己的脆弱无限放大。很多事情发生时，你的第一反应不是立刻寻找一个人接住自己，而是先留出一点空间，把最混乱的部分自己处理掉。等你重新能够站稳以后，别人看到的往往已经是整理过的版本。但“能恢复”并不等于“没有被影响”。","你其实会记得很多东西。一次失望、一段关系、某个阶段留下的疲惫，并不会因为你继续往前走就彻底消失。它们更像进入土壤，慢慢变成你之后判断事情的方式。所以你的边界很少凭空出现。很多你现在能够平静说出的“不”、能够及时离开的地方、能够不再勉强自己的选择，背后可能都曾经有过一次真实的消耗。你真正少见的地方并不是坚硬，而是：你允许环境改变自己，却不会因此把自己交出去。"]},{"family":"木质调 Woody","subtype":"雪松","first_line":"你像一块切面清楚的雪松木：干净、笔直，每一条边界都有来由。","core_perfume":"Byredo — Super Cedar","radar":{"明亮":42,"柔软":35,"尖锐":72,"深邃":70,"清冷":70,"温暖":35,"克制":92,"丰盛":35},"copy_perfume":["Byredo — Super Cedar","它几乎把雪松写得非常直接：玫瑰花瓣轻轻开场，核心很快落到弗吉尼亚雪松，最后是海地香根草和丝滑麝香。木头的垂直感非常明显，像刚削开的铅笔木屑，干净、直接、有结构。","当你想要表现出这样的一面时，你可以穿这支香水：清楚、可靠、有边界。你不需要把自己变得很强硬，但你希望事情最好各归其位，人也知道什么该做、什么不该越过。"],"copy_main":["你的气味轮廓很克制，也很清楚。","雪松不像香根草那样往土里扎，它更像一根向上生长的直线。干燥的木纹、清晰的切面、铅笔木屑一样的粉尘感，都让它天然带着一种“事情应该有结构”的感觉。你身上的稳定感也更接近这一种。你并不是特别害怕变化。真正让你疲惫的，往往是混乱——责任不清、边界模糊、谁都在做一点但没人真正负责、今天一个说法明天又是另一个。这种环境会很快消耗你。因为你需要知道自己正在面对什么。哪些事情是我该处理的，哪些不是；什么值得投入，什么可以放下；一段关系里彼此应该承担什么，什么不能默认由其中一个人无限吸收。","当这些东西清楚以后，你反而会非常稳定。你可以做很多事，也可以承担很大的责任，只要你知道自己为什么承担、承担到哪里。所以你对“成熟”的理解里，一直有很强的结构感。成熟不是永远忍耐，也不是事情来了就都接住。成熟更像是：知道什么值得负责，也知道什么不属于自己。这让你在很多时候显得冷静、可靠。不是因为你没有情绪，而是你的第一反应经常是先把事情放回正确的位置。等结构清楚以后，你才有空间真正感受。"],"copy_hidden":["别人容易把你的边界理解成控制欲。但你真正想控制的，很多时候并不是别人。而是混乱。当一个人反复改变规则、模糊责任、靠“关系”要求你承担本不属于你的东西，你会比单纯的意见不合更难受。因为这种状态会破坏你对世界的可预期感。你并不是要求所有事情都按照自己的方式运行。你只是很难长期生活在一种“什么都说不清”的环境里。所以你真正珍惜的秩序，并不是死板。它更像一种节省：省掉不必要的猜测、不必要的拉扯、不必要的消耗，把精力留给真正值得的东西。","你的边界，不是墙。更像是一条让生活能够顺畅运行的线。"]},{"family":"木质调 Woody","subtype":"檀香","first_line":"你像被体温慢慢焐热的檀香木：安静，却让人愿意靠近。","core_perfume":"Diptyque — Tam Dao Eau de Parfum","radar":{"明亮":35,"柔软":68,"尖锐":35,"深邃":65,"清冷":35,"温暖":72,"克制":75,"丰盛":50},"copy_perfume":["Diptyque — Tam Dao Eau de Parfum","檀香是绝对核心，雪松、柏树和香菜籽让木头保持清晰，亚洲香料则把檀香本身柔滑、奶感、略带辛意的一面慢慢放大。它并不甜，却天然带着一种温润和包裹感。","当你想要表现出这样的一面时，你可以穿这支香水：稳定、温和、有余裕。你不是靠冷硬让自己站住，而是希望自己足够稳定以后，还能让重要的人在你旁边放松一点。"],"copy_main":["你的气味轮廓稳定、温润，也带着明显的克制。檀香是一种很特别的木头。","它不像雪松那样干净笔直，也不像广藿香那样潮湿复杂。真正好闻的檀香更接近一种被体温慢慢加热的木质：有一点奶感，有一点油润，又始终没有失去木头本身的安静。你也更接近这种温和的稳定。你不太需要通过“我什么都能扛”来证明自己有力量。真正让你安心的，是生活大体有一个可以依靠的底子，而自己在这个底子上仍然有余地照顾感受。包括自己的，也包括别人的。你很容易成为关系里那个让人放松的人。","别人状态不好时，你未必第一时间分析问题。很多时候，你更自然的反应是先让事情不要继续变得更难：吃点东西，休息一下，把要求降下来，让人先恢复一点力气。你知道一个人不是每时每刻都需要被“解决”。有时候，他只是需要一个不用继续防备的地方。这并不代表你没有原则。恰恰因为你内在比较稳，所以你没有那么强烈的冲动去时时证明边界。你更容易在真正需要的时候才把它拿出来。你的力量不是硬。而是我可以站住，也有余力让别人靠一下。"],"copy_hidden":["因为你很会承接别人，你自己的疲惫反而容易被忽略。你可能已经很累了，还是会先问对方是不是没吃饭；自己状态不好，仍然可以把重要的事情处理完；关系里出现问题，也常常先考虑怎么让两个人都不要太难受。久而久之，别人容易形成一种错觉：你应该一直有余力。但稳定并不是无穷无尽的资源。真正让你受伤的，往往不是一次大的要求，而是别人慢慢把你的温柔当成默认配置。你真正需要的关系，不只是让你可以照顾别人。","还应该有一些时刻，让你知道：今天你也可以坐下来，什么都不用撑。"]},{"family":"木质调 Woody","subtype":"广藿香","first_line":"你像潮湿土壤里的广藿香：暗、厚，有生命正在腐烂，也有生命正从里面重新长出来。","core_perfume":"CHANEL — Coromandel Eau de Parfum","radar":{"明亮":25,"柔软":40,"尖锐":65,"深邃":92,"清冷":45,"温暖":55,"克制":65,"丰盛":80},"copy_perfume":["CHANEL — Coromandel Eau de Parfum这里的广藿香非常厚，却不是单纯的泥土。香草和安息香把它压出一种丝绒般的琥珀感，让暗色的广藿香既有土地、树脂和阴影，也有某种华丽和温暖。","当你想要表现出这样的一面时，你可以穿这支香水：复杂、深色、不急着让自己显得干净无瑕。你愿意承认人身上有欲望、有矛盾、有不那么漂亮的部分，而这并不会自动让一个人失去价值。"],"copy_main":["你的气味轮廓很深，也很丰盛。广藿香天然有一种“土壤正在发生事情”的感觉。","它可以潮湿，可以暗，可以带一点发酵、叶片甚至泥土的气息。它不像一块被抛光过的木头，更像地下那些看不见的部分：落叶在分解，根系在延伸，旧东西正在变成新东西的养分。你对人的理解也更容易进入这种复杂层。你不太相信一个人可以被一句“好人”或者“坏人”彻底解释。很多行为背后都可能同时存在欲望、恐惧、虚荣、善意和自私。你并不因为看见这些，就一定变得悲观。反而是因为你愿意承认这些东西存在，所以你对“真实的人”有更高的容忍度。","你能理解一个人为什么做错，也能承认自己同样可能嫉妒、冲动、矛盾、想要不属于自己的东西。你不需要把这些东西全部清理掉，才允许自己认为自己是一个完整的人。这让你的成熟里有一种很少见的暗度。你不急着把每个感受变得漂亮。有些东西可以先在里面待着，慢慢被看懂。你相信：一个人不是因为没有阴影才完整，而是因为连阴影也属于他。"],"copy_hidden":["因为你能理解复杂，别人有时会误以为你什么都可以接受。其实不是。理解一个人为什么这样做，和允许他继续这样对待你，是完全不同的两件事。你甚至可能比很多更快下判断的人，看得更清楚。只是你不急着用一个标签结束观察。你愿意多看几层：他为什么这样、这件事发生在什么背景下、里面是不是有我还没看到的部分。可一旦你确认某种伤害不是偶发，而是一种稳定模式，你并不会因为“我理解他”就无限留下来。你的复杂不是没有边界。","而是：我可以看见黑暗，但不需要住在黑暗里。"]},{"family":"木质调 Woody","subtype":"沉香","first_line":"你像沉进暗色木心里的沉香：越靠近，越知道它并不急着被读懂。","core_perfume":"Tom Ford — Oud Wood Eau de Parfum","radar":{"明亮":18,"柔软":30,"尖锐":70,"深邃":98,"清冷":55,"温暖":60,"克制":88,"丰盛":72},"copy_perfume":["Tom Ford — Oud Wood Eau de Parfum","沉香调在这里被放进一组非常深色的木质和香料里：豆蔻、粉红胡椒、广藿香、琥珀、沉香调、檀香、香根草和零陵香豆。它有烟、有土、有暖意，却始终保持一种不完全向外展开的距离感。","当你想要表现出这样的一面时，你可以穿这支香水：深、慢、难被一下看透。你不是没有感情，也不是拒绝靠近；只是你不会因为关系刚刚变好，就立刻把自己的核心全部交出去。"],"copy_main":["你的气味轮廓极深，也很克制。沉香最迷人的地方之一，是它很少把自己一次性交出来。木头、烟、树脂、辛香、暖意，一层压着一层。你很难在第一秒说清它到底是什么，却会在靠近以后不断发现新的东西。你对“被了解”也有类似的节奏。你并不一定排斥别人走近自己。真正让你不舒服的是：关系还没有经过足够时间，对方就默认自己已经拥有进入你所有内部空间的权利。你很看重信任的形成过程。","不是因为你天然怀疑所有人，而是你觉得有些东西只有时间能证明。一个人是否尊重你、是否稳定、是否能承担自己说过的话，很多时候都需要在不同场景里慢慢看见。所以你真正的开放通常很慢。但慢不代表浅。恰恰相反，当你真的决定把一部分很深的自己交给另一个人，那往往意味着这段关系已经经过了很长的内部判断。你也很珍惜隐私。不是所有感受都必须共享，不是所有经历都需要被解释。一段关系再亲近，你也希望自己仍然有一块不被要求打开的地方。","对你来说，这不是距离。而是一个人仍然完整属于自己的证明。"],"copy_hidden":["你的距离感很容易被误解成冷。可你真正冷的地方并不多。更多时候，你只是把温度藏得比较深。你可能不会很快说“我很在乎”，却会记得很多年；不会随便把自己的过去讲出来，但一旦讲了，那通常意味着对方已经进入一个非常少有人能到的位置。你也很少因为别人想知道，就觉得自己有义务解释。有些东西你愿意自己保存。它们不是秘密，也不是防御。只是你认为，亲密并不意味着一个人必须被彻底透明化。真正让你安心的关系，是别人知道你仍然有没说出口的部分，却不会因此焦虑。","你愿意靠近，但你不会为了证明亲密，把自己全部摊开。"]},{"family":"皮革调 Leather","subtype":"麂皮","first_line":"你像一块柔软的麂皮：有触感、有边界，却不需要把自己变硬。","core_perfume":"BDK Parfums — Crème de Cuir","radar":{"明亮":30,"柔软":55,"尖锐":60,"深邃":70,"清冷":45,"温暖":60,"克制":75,"丰盛":65},"copy_perfume":["BDK Parfums — Crème de Cuir","它把皮革写得很柔软。前面有柑橘、菠萝和粉红胡椒的轻盈，核心落到白麂皮、檀香和太阳感，最后被香草、白桦与麝香包住。皮革的轮廓还在，却像被磨成了哑光。当你想要表现出这样的一面时，你可以穿这支香水：温和、清楚、不讨好。你不需要靠尖锐证明自己有边界，也不需要为了显得好相处，把自己的不舒服吞下去。"],"copy_main":["你的气味轮廓柔软、克制，却并不松。麂皮和硬挺的新皮革不一样。它有摩擦感，也有温度。手指划过去时，表面会留下方向，但它不会因此失去形状。你身上的边界也更接近这种质地。你并不热衷于让所有人都知道“我很不好惹”。很多时候，你甚至显得很好说话。你愿意听解释，也愿意给别人余地，不会因为一点不合就迅速把关系切断。但这不意味着你没有自己的线。你只是觉得真正有效的边界，不需要时时展示。它应该在需要时出现，而且足够明确。","所以你很少欣赏那种为了证明独立，就把所有亲近都变成攻防的人。你更愿意保持柔软——可以接受别人照顾，可以承认自己在意，可以因为关系做一点调整。前提是这些都出自选择，而不是被迫。你很清楚两件事可以同时成立：我可以理解你。但我仍然可以说不。这也是你身上很成熟的一点。你并不把温柔理解成无限让步，也不把坚定理解成必须变得冷硬。真正让你舒服的状态，是两者都在。"],"copy_hidden":["因为你的边界通常表达得并不激烈，别人有时会低估它的真实性。你可能已经明确说过自己不喜欢，只是语气没有很重；已经给过一个选择，只是没有用最后通牒的方式表达。如果对方因此把你的温和理解成“还可以继续试”，你会一点点失去耐心。真正让你冷下来的，往往不是第一次越界。而是一个人在已经知道你的感受以后，仍然选择继续忽略。那一刻，你在意的已经不只是事情本身。而是：你到底有没有把我说的话当回事。","所以你的柔软从来不是模糊。它只是没有噪音。"]},{"family":"皮革调 Leather","subtype":"旧皮革","first_line":"你像一只被时间磨亮的旧皮箱：痕迹很多，却因此更有质地。","core_perfume":"Parfum d’Empire — Cuir Ottoman","radar":{"明亮":15,"柔软":30,"尖锐":70,"深邃":92,"清冷":45,"温暖":65,"克制":75,"丰盛":82},"copy_perfume":["Parfum d’Empire — Cuir Ottoman","这不是崭新皮具的干净皮革。鸢尾让它有粉感，烧灼的安息香脂与白桦带出烟，安息香、焚香、香草和零陵香豆把皮革压进一种温暖、厚重、略带旧时代感的东方底色里。","当你想要表现出这样的一面时，你可以穿这支香水：成熟、有故事、不急着抹平痕迹。你并不认为经历过什么以后，最好的状态一定是恢复到“像没发生过一样”。"],"copy_main":["你的气味轮廓很深，也明显带着时间感。新的皮革通常完整、光滑、没有划痕。旧皮革却完全不同。它可能变软，颜色变深，边角被磨亮，甚至留下无法去掉的折痕。可正是这些东西，让它慢慢从“一个物件”变成“这个物件”。你看待自己也更容易接受这种变化。你并不执着于永远保持某个最初版本。人经历过关系、工作、失败、选择以后，本来就会变。某些地方更谨慎，某些地方没那么天真，某些标准比以前更清楚。你不会自动把这些变化理解成损耗。","很多时候，它们只是时间留下的纹理。所以你对“成熟”的想象并不光滑。一个真正成熟的人可以有遗憾，可以承认自己做错过，也可以身上还留着某段过去的影子。重要的不是彻底消除它。而是你现在怎么看待它。你很少相信“过去不重要”。过去当然重要。只是它不应该永远拥有最后解释权。你允许经历留下痕迹，但不允许痕迹替你决定余生。"],"copy_hidden":["你很少真正后悔自己已经认真活过的部分。哪怕某段经历最后没有留下好结果，你也未必愿意简单把它定义为浪费。因为你知道，今天很多判断、边界甚至审美，都来自以前走过的路。但你也因此非常讨厌别人轻易否定你的过去。一句“你当时怎么那么傻”，可能比对方预想中更让你不舒服。不是因为你觉得过去的自己永远正确。而是你不愿意站在今天的位置上，傲慢地嘲笑那个当时已经尽力理解世界的自己。你真正拥有的成熟不是：","我以前怎么会那样。而是：我知道当时的我为什么会那样，而现在的我已经走到了别处。"]},{"family":"皮革调 Leather","subtype":"烟熏皮革","first_line":"你像一块被烟火熏黑的皮革：立场清楚，不怕留下烧灼的痕迹。","core_perfume":"Tom Ford — Tuscan Leather","radar":{"明亮":10,"柔软":15,"尖锐":95,"深邃":95,"清冷":60,"温暖":55,"克制":85,"丰盛":80},"copy_perfume":["Tom Ford — Tuscan Leather","它的皮革并不温吞。藏红花、覆盆子和百里香先给出辛香与果感，随后焚香、夜开茉莉、皮革和黑麂皮一起压上来，最后落进琥珀木。它既有光滑的皮革表面，也有烟、热和一点近乎挑衅的动物感。","当你想要表现出这样的一面时，你可以穿这支香水：明确、有立场、能承受冲突。你不是为了赢而反对别人，但如果一件事真的重要，你不会为了让场面好看就假装自己没有意见。"],"copy_main":["你的气味轮廓很深，也非常锋利。烟熏皮革不是为了让所有人都觉得舒服而存在的。火、烟、皮革和香料本身就带着一种明确的存在感。它可以精致，却很难完全无害。你对“立场”也有类似的理解。不是每一件事都值得争。很多小事你甚至可以非常随意，别人怎么选都行。但当某个问题真正碰到你的原则、利益、价值判断，或者你认为非常重要的人，你会迅速从“都可以”变成“这件事不可以”。而且你不太害怕因此产生摩擦。","你知道有些关系能够维持，并不是因为双方从来不冲突，而是冲突出现以后，彼此仍然能把话说完。所以你不太欣赏一种表面和平：大家都很客气，但真正的问题没人敢碰；所有人都说没事，实际上怨气一直累积。你宁愿某些时刻不好看一点。只要事情是真的。这并不意味着你喜欢伤害人。你只是觉得，真正有价值的关系和合作，应该承受得住一些真实的分歧。如果一段关系只能在你没有立场时成立，那它本身就不够牢固。"],"copy_hidden":["你的锋利经常会遮住一个事实：你其实非常认真地选择自己要为什么事情变锋利。真正没有意义的争执，你往往懒得进入。你也不是任何时候都想“压过”谁。很多时候，一旦发现对方只是想赢、不想理解，你反而会迅速失去兴趣。所以你愿意正面冲突，通常意味着这件事对你仍然有价值。你还愿意说，还愿意争，还愿意指出哪里出了问题，本身就说明你还没有彻底放弃。真正危险的反而是你完全不想争了。那时通常不是你变温柔了。","而是你已经决定：这件事不再值得消耗我的锋利。"]},{"family":"皮革调 Leather","subtype":"动物感皮革","first_line":"你像仍然带着体温的皮革：不够无菌，也因此更像真实的人。","core_perfume":"Serge Lutens — Cuir Mauresque","radar":{"明亮":10,"柔软":25,"尖锐":88,"深邃":90,"清冷":35,"温暖":78,"克制":50,"丰盛":95},"copy_perfume":["Serge Lutens — Cuir Mauresque","它没有把皮革处理成干净的皮包，而是保留了更原始、更动物性的皮革联想。官方也直接把它描述为精致、动物感、带强烈个性的皮革，并把灵感指向用金合欢树皮鞣制的摩尔皮革。","当你想要表现出这样的一面时，你可以穿这支香水：本能、真实、不被过度修饰。你不想把人性里所有不体面的部分都删掉以后，才允许自己成为一个“好的人”。"],"copy_main":["你的气味轮廓很深、很暖，也非常丰盛。动物感皮革会让人想到一个经常被香水世界隐藏起来的事实：身体本来就有气味。皮肤、汗、体温、欲望、毛发、呼吸——这些东西并不总是干净、整齐、适合被摆进漂亮橱窗里。可它们是真实的。你对自己也更容易接受这种“不够漂亮”的真实性。你知道人会嫉妒，会虚荣，会产生占有欲，会突然想做一件并不高尚的事。你也知道一个人可能既爱别人，又在某个瞬间只想保护自己。你不急着因为这些念头出现，就立刻审判一个人。","因为在你看来，念头、欲望和真正采取的行动之间，本来就还有很大的空间。真正重要的是：你是否认识它，是否承担选择，是否知道自己最终愿意成为怎样的人。这让你的人格里有一种很强的“肉身感”。你不是只活在原则里。你需要真实体验，需要吸引力，需要身体知道自己在回应什么。你也很难长期留在一种“什么都正确，但什么都没有感觉”的生活里。对你来说，真实不是永远体面，而是不用假装自己没有本能。"],"copy_hidden":["别人可能以为你的本能感意味着放纵。其实你对“承担”这件事往往比想象中更认真。你可以承认自己想要什么，也可以承认自己有不那么漂亮的情绪。但你并不觉得“我有这种感觉”就自动等于“所以我做什么都合理”。甚至恰恰相反。因为你愿意直视欲望，所以你更清楚选择需要由自己负责。你不需要把自己包装成一个没有阴影的人。你真正想做到的是：我知道自己身上有哪些东西，也知道哪些东西最终不能替我做决定。这不是纯洁。","但它是一种很真实的自我掌控。"]},{"family":"西普调 Chypre","subtype":"苔藓西普","first_line":"你像雨后石阶边的一层苔藓：安静、克制，却把复杂都留在了表面之下。","core_perfume":"CHANEL — Pour Monsieur Eau de Parfum","radar":{"明亮":35,"柔软":25,"尖锐":60,"深邃":95,"清冷":72,"温暖":35,"克制":92,"丰盛":65},"copy_perfume":["CHANEL — Pour Monsieur Eau de Parfum","它不是一支单纯清爽的绅士香。柑橘先把空气打开，薰衣草和肉豆蔻让结构变得干净而有分寸，后面的香根草、广藿香与橡木苔则把整支香稳稳压回更成熟的西普底色。","当你想要表现出这样的一面时，你可以穿这支香水：成熟、克制、很少被第一反应带着走。你不是没有复杂情绪，而是更习惯先让它们沉下去，等自己真正知道在意什么，再决定怎么处理。"],"copy_main":["你的气味轮廓很深、很冷，也非常克制。苔藓西普不是那种把所有内容都摆在表面的气味。柑橘可能先出现，随后是花、木头、香料，最后真正决定它气质的，往往是那层湿冷、阴影般的苔藓底色。它让前面的明亮都多了一层现实感。你看事情也更容易看到这一层。你很少因为一个人此刻表现得好，就立刻把他定义成“很好的人”；也不会因为一次失误，就简单把一切都推翻。你更习惯观察整体。这个人长期怎么做，发生冲突以后怎么处理，事情不顺的时候会不会暴露另一面——这些对你来说，比漂亮的第一印象重要得多。","所以你的判断通常来得慢一点。但一旦形成，也比较稳定。你能够容纳很多互相矛盾的事实：一个人可以善良，同时也很自私；一段关系可以有很多美好，但仍然不适合继续；一件选择可能正确，却依然伴随着遗憾。你不需要强迫这些东西最后只剩一个答案。这让你显得很成熟。不是因为你看淡一切，而是因为你能接受：真实世界本来就很少只有一种颜色。"],"copy_hidden":["因为你很能容纳复杂，别人有时会误以为你不会轻易失望。其实你只是不会太快表现出来。你通常会先观察、解释、给背景，甚至替对方理解一些自己本来不必理解的部分。但这并不意味着你的底线很低。恰恰相反，当你终于做出判断，往往已经不是一时情绪。那通常意味着你已经看过足够多次。所以你真正离开的时候，反而很少戏剧化。不是因为事情不重要。而是因为很多结论，在你真正说出口之前，已经在心里形成很久了。","你不是没有锋利，只是你的锋利通常最后才出现。"]},{"family":"西普调 Chypre","subtype":"花香西普","first_line":"你像一束被阴影托住的花：柔软依然存在，却从来不失去分寸。","core_perfume":"Narciso Rodriguez — For Her Eau de Toilette","radar":{"明亮":50,"柔软":55,"尖锐":55,"深邃":82,"清冷":50,"温暖":55,"克制":80,"丰盛":82},"copy_perfume":["Narciso Rodriguez — For Her Eau de Toilette它的核心不是一束铺张的花，而是麝香。橙花与桂花把花香轻轻提亮，琥珀和香草让它贴近皮肤，广藿香与木质则把整支香拉回一种透明而克制的现代西普结构。","当你想要表现出这样的一面时，你可以穿这支香水：有感情，但不被感情完全带走。你可以非常在意，也可以很温柔，但仍然希望自己在关系里保留判断、尊严和一点属于自己的距离。"],"copy_main":["你的气味轮廓很平衡。它既不是彻底柔软，也不是彻底冷。花香西普最迷人的地方，正是花与骨架同时存在。花可以有温度、有感情、有丰盛的部分，但下面始终有苔藓、木质或广藿香，把它拉回现实。你进入关系时也很像这样。你并不害怕认真。如果喜欢，你愿意投入；如果在乎，你会记得很多细节。你并不觉得“谁先认真谁就输了”。但你也很难彻底把判断关掉。哪怕正在爱一个人，你仍然会留意这段关系究竟有没有在变好，彼此是否尊重，自己的感受有没有长期被忽略。","你希望情绪是真实的。但你同样希望现实是成立的。所以你很难被一种只靠感觉维持的关系说服太久。“我们很相爱”当然重要。可如果相处方式一直消耗，承诺没有落地，未来只有模糊的期待，你会越来越清楚地意识到：感情不能替所有现实问题负责。这并不会让你的爱变得计算。反而是因为你认真，所以你才希望它有能力进入真实生活。你想要的不是最浓烈的感情，而是经得住现实以后仍然成立的感情。"],"copy_hidden":["你比外表看起来更容易心软。只是你的心软通常伴随着观察。你可能嘴上已经很清楚地说“不应该”，心里却仍然会理解对方为什么变成这样；知道一段关系不适合继续，也不妨碍你承认其中真的有过很好的一部分。所以你最难处理的，往往不是纯粹的坏。而是那些“有很多好，但还是不够”的东西。它们没有一个足够明确的反派，让你可以轻松地恨。于是你必须自己做一个更难的决定：承认爱是真的，同时承认离开也是真的。","这就是你身上最复杂、也最成熟的一部分。"]},{"family":"西普调 Chypre","subtype":"果香西普","first_line":"你像一颗成熟水果落进潮湿树林：鲜活是真的，阴影也没有被藏起来。","core_perfume":"Guerlain — Mitsouko Eau de Parfum","radar":{"明亮":60,"柔软":45,"尖锐":60,"深邃":75,"清冷":45,"温暖":55,"克制":70,"丰盛":88},"copy_perfume":["Guerlain — Mitsouko Eau de Parfum","它把柔软桃子放进了典型西普骨架里。桃子的果肉感和茉莉、五月玫瑰相遇，下面却一直有广藿香、苔藓、香根草、树林和辛香料的暗面。甜和现实没有互相取消，而是一起存在。","当你想要表现出这样的一面时，你可以穿这支香水：鲜活、聪明、有现实感。你愿意享受快乐，也愿意相信美好的事情，但你不会为了保持漂亮的想象，就故意不去看那些不那么好看的部分。"],"copy_main":["你的气味轮廓很丰盛，却始终带着一层深色底子。Mitsouko 式的果香很少让人想到新鲜果汁。它更像一颗已经成熟的桃子落进潮湿树林。果肉是软的，是甜的，周围却有苔藓、木头、泥土、香料和一点冷空气。你身上的乐观也更像这一种。你不是因为看不见问题才快乐。很多时候，你明明知道事情并不完美，仍然愿意享受其中好的部分。你会看见关系的缺口，也能承认一段关系曾经给过自己快乐；知道一个选择有风险，却仍然可能因为它值得体验而去做。","这让你的快乐里有一种很特别的现实感。不是“都会好的”。而是：不一定都会好，但现在有些东西确实很好。你不太需要把世界处理成全好或者全坏，才知道自己应该怎么感受。一件事可以有遗憾，同时值得；一个人可以让你失望，也曾经真的打动你；一段经历最后没有成功，也不代表里面所有东西都应该被抹掉。你很擅长保留这种多层次。于是你的生命力并不轻浮。它更像经历过现实以后，仍然没有失去感受快乐的能力。"],"copy_hidden":["别人可能以为你很会“想得开”。但你真正做的，并不是把坏的部分想成好的。你只是很少允许一个坏结果，重新改写整段过去。如果一段关系结束了，你可以承认结束是对的，却不必因此告诉自己“以前都是假的”。如果一个选择失败了，你也可以承认失败，同时保留其中真正得到的东西。这让你比很多人更难被彻底击碎。不是因为你没有痛感。而是你不轻易把自己的过去交给最后一个结果定义。结局可以改变意义，但不能垄断意义。"]},{"family":"西普调 Chypre","subtype":"皮革西普","first_line":"你像深色皮革下的一层苔藓：复杂、锋利，却始终知道自己的立场在哪里。","core_perfume":"Amouage — Memoir Woman","radar":{"明亮":30,"柔软":20,"尖锐":82,"深邃":95,"清冷":60,"温暖":45,"克制":92,"丰盛":78},"copy_perfume":["Amouage — Memoir Woman","它是一支非常深色的西普。苦艾、豆蔻和粉红胡椒先制造出冷而辛辣的开场，随后玫瑰、茉莉、白花、焚香与黑色木质逐渐加深，最后落到橡木苔、皮革、海狸香、劳丹脂和麝香里。复杂，但绝不模糊。","当你想要表现出这样的一面时，你可以穿这支香水：有判断、有深度，也有清楚的边界。你可以理解一个问题为什么复杂，却不会因为理解得越多，就自动觉得所有选择都一样合理。"],"copy_main":["你的气味轮廓非常深，也非常克制。皮革西普和广藿香式的“容纳复杂”不同。它当然能看到复杂，但最后仍然会回到判断。你很容易理解事情为什么变成这样。你知道人会受环境影响，会因为恐惧做错，会因为欲望选择不那么漂亮的方式，也知道有些矛盾确实没有完美解决办法。可理解这些，并不会让你失去立场。这是你很重要的一点。你不太认同“既然一切都有原因，所以就没有谁需要负责”。原因可以解释一件事。但它未必能免除后果。","所以你经常能同时说出两句话：我理解你为什么这么做。但我仍然认为这件事不对。这种能力让你很难被简单的话术带走。你既不容易被道德口号完全说服，也不容易被“大家都有难处”这种解释彻底软化。你需要自己判断。什么是可以接受的人性弱点，什么已经跨过了原则；哪里值得原谅，哪里即使原谅，也不应该再继续靠近。你的复杂从来不等于模糊。反而是因为看得多，你才更需要知道自己的位置。"],"copy_hidden":["你对别人有判断，对自己其实更严格。当你真的做错一件自己认为重要的事，你未必很快放过自己。别人说“算了”“大家都会这样”，有时候并不能让你舒服多少。因为你在意的不是自己有没有被宽恕。而是：我有没有违背自己原本相信的东西。这也是为什么你真正的成长，很少来自别人告诉你应该成为什么样的人。更多时候，是你发现自己曾经做过一个和自己价值观并不一致的选择，然后重新校准。你允许世界复杂。但你不希望自己因此失去方向。","理解一切，不等于同意一切。"]},{"family":"馥奇调 Fougère","subtype":"薰衣草馥奇","first_line":"你像一件被反复穿过仍然合身的外套：不靠新鲜感，却越来越让人放心。","core_perfume":"Maison Francis Kurkdjian — masculin Pluriel","radar":{"明亮":62,"柔软":45,"尖锐":55,"深邃":60,"清冷":65,"温暖":45,"克制":85,"丰盛":40},"copy_perfume":["Maison Francis Kurkdjian — masculin Pluriel","它不是柔软的薰衣草花束，而是一支带皮革与木质骨架的芳香作品。薰衣草的干净、经典感被雪松、广藿香、香根草与皮革感托住，最后呈现的不是“清新”，而是一种经得起反复闻的稳定。","当你想要表现出这样的一面时，你可以穿这支香水：可靠、成熟、经得住时间。你不太需要每次都给人惊喜，比起一瞬间让人眼前一亮，你更希望自己是那个长期相处以后依然让人放心的人。"],"copy_main":["你的气味轮廓稳定、克制，也带着一种很经典的清洁感。薰衣草馥奇很少依赖某一个特别夸张的瞬间。它真正迷人的地方，是结构完整。薰衣草、草本、木质、苔藓、皮革感或香豆素一起，把气味撑成一种“无论什么时候闻，都站得住”的形状。你也更看重这种长期成立。","你不太容易被一个人某一次表现得特别好彻底说服。真正让你产生信任的，是他很多次都差不多：答应的事情会做，遇到压力不会突然换一副样子，关系熟了以后也没有开始敷衍。你自己也是如此。你未必每天状态都完美，也不觉得可靠意味着从不犯错。可你很重视一件事：如果是我答应的、属于我的、我认为重要的，我会尽量把它落下来。这种稳定让你在很多关系里天然容易成为“可以找的人”。出了问题可以问你，事情交给你比较放心，约好的东西不用反复确认。","你可能不会因为这些获得最戏剧性的注意力。但时间越长，你的价值反而越明显。你不追求每一次都被重新认识。你更希望自己经得起认识。"],"copy_hidden":["可靠有一个很隐蔽的代价：别人很容易慢慢忘记，这其实是你的选择，而不是你的义务。因为你很多次都做到了，大家就开始默认你下一次也会做到；因为你平时很稳定，偶尔状态不好时，反而更容易被问“你今天怎么了”。你真正反感的不是被需要。而是自己的可靠被当成免费的公共资源。你愿意承担，是因为你认为这件事值得。一旦你发现一个人只是不断使用你的稳定，却从来没有把你的时间、精力和承诺同样认真地对待，你会慢慢收回。","所以你的可靠并不是“我永远在”。而是：只要我们彼此都认真，我会是一个很值得依靠的人。"]},{"family":"馥奇调 Fougère","subtype":"绿感馥奇","first_line":"你像清晨踩过还带露水的草地：实际、清醒，却随时能换一个方向继续走。","core_perfume":"Creed — Green Irish Tweed","radar":{"明亮":72,"柔软":30,"尖锐":62,"深邃":45,"清冷":80,"温暖":30,"克制":65,"丰盛":35},"copy_perfume":["Creed — Green Irish Tweed","这是一支非常典型的绿色馥奇。柠檬、佛手柑、马鞭草、白松香与薄荷先制造出清凉的绿意，中间是薰衣草、天竺葵和紫罗兰，最后落在橡木苔、雪松、檀香与木质上。它有传统结构，却一直保持着户外空气感。","当你想要表现出这样的一面时，你可以穿这支香水：务实、灵活、不僵。你需要一个可靠的基本盘，但如果现实发生变化，你也不会为了证明自己“有原则”就死守已经不合适的方法。"],"copy_main":["你的气味轮廓很绿、很清醒，也带着明显的行动感。绿感馥奇和雪松那种“结构必须清楚”不完全一样。它当然有结构，但结构是拿来帮助生活的，不是拿来绑住生活的。","草、薄荷、薰衣草、苔藓和木头，都有一种很具体的现实感。它不太让人联想到精心摆好的室内，更像人在外面走路：天气可能改变，路线可能临时绕开，但仍然知道自己大致要去哪里。你处理事情也很像这样。你喜欢有计划，却不太迷恋计划本身。如果原来的办法已经不适合，你通常愿意改；别人提出一个更有效的方法，只要是真的更好，你也不需要为了面子坚持“这是我一开始定的”。你更看重结果是否实际。很多漂亮但无法落地的东西，会很快让你失去兴趣。","而那些不一定特别高级、但真的省时间、省力、能让事情继续往前走的方法，反而容易得到你的认可。这让你的可靠不是一种僵硬的可靠。而是一种很实用的可靠：情况变了，我也可以调整，但事情不会因此彻底掉在地上。"],"copy_hidden":["因为你适应得快，别人可能会误以为你对变化没有成本。其实你当然也会烦。计划突然被打断、别人临时改口、事情不得不重做，你一样会产生情绪。只是你很少让“我不喜欢这个变化”进一步变成“所以我拒绝面对这个变化”。你会先处理。等事情真的稳定下来以后，你才有空回头发现：原来这段时间其实挺累。所以你真正需要的，不是一个永远不变的世界。而是周围的人至少能和你一样，对现实有基本的反应能力。你可以接受变化，但你很难长期替所有人收拾他们拒绝变化的后果。"]},{"family":"馥奇调 Fougère","subtype":"皂感馥奇","first_line":"你像一件刚晒干的白衬衫：不是空，而是把多余的东西都清掉了。","core_perfume":"CHANEL — Platinum Égoïste","radar":{"明亮":82,"柔软":45,"尖锐":45,"深邃":35,"清冷":78,"温暖":35,"克制":90,"丰盛":25},"copy_perfume":["CHANEL — Platinum Égoïste","它是一支非常干净的绿感馥奇。薰衣草、迷迭香和苦橙叶先打开空气，鼠尾草与天竺葵把草本结构撑起来，最后落到温暖而纯净的木质底色。整支香非常整洁、有秩序，也没有多余的甜腻。当你想要表现出这样的一面时，你可以穿这支香水：干净、简单、低噪音。你不需要所有事情都丰富到极致，很多时候，减少干扰本身就会让你重新变得舒服。"],"copy_main":["你的气味轮廓很清、很亮，也非常克制。皂感最迷人的地方，不是“香”。而是它给人的感觉像很多东西刚刚被清走。皮肤是干净的，衣服晒透了，桌面上没有堆太多东西，空气里没有上一件事留下来的味道。你很需要这种低噪音状态。你的压力未必总来自真正的大事。很多时候，真正持续消耗你的反而是那些细小、零散、一直没有结束的东西：桌面太乱、消息不断弹出来、很多人同时问你不同的事、事情做一半又插进另一件。","它们单独看都不严重。可一旦叠在一起，你会明显感觉自己的脑子开始变得黏。所以你很依赖“清空”。收拾、整理、把事情逐个做掉、一个人待一会儿、把不必要的通知关掉，都会让你重新恢复。这不是因为你的人生必须极简。而是你的注意力需要空间。你真正舒服的状态，不是什么都没有。而是：重要的东西在，不重要的东西不要一直来碰我。"],"copy_hidden":["别人可能把你的清洁感理解成“要求高”或者“有点洁癖”。但你真正无法忍受的，很多时候并不是脏。而是持续的干扰。东西可以旧，可以不完美，生活也可以偶尔乱。只要这种乱不会不停要求你处理。你甚至可以在很简单的环境里过得很好，只要那里没有太多无意义的信息不断闯入。所以当你突然想把房间收拾一遍、删掉很多东西、减少社交、把安排砍掉一半时，那不一定是你变得冷淡。更可能只是你的系统在说：我需要重新听见自己的声音。"]},{"family":"馥奇调 Fougère","subtype":"辛香馥奇","first_line":"你像一套剪裁利落的衣服里藏着辛香：可靠的表面下，一直有很快的反应和行动力。","core_perfume":"Penhaligon’s — Sartorial","radar":{"明亮":65,"柔软":25,"尖锐":78,"深邃":55,"清冷":65,"温暖":42,"克制":78,"丰盛":50},"copy_perfume":["Penhaligon’s — Sartorial","它以经典馥奇为骨架，却不是保守的经典。薰衣草、豆蔻、黑胡椒、皮革、广藿香与零陵香豆构成主体，甚至用金属感醛香去模拟裁缝工作室里的蒸汽、工具与材料。稳定结构里一直有辛辣和机械般的行动感。","当你想要表现出这样的一面时，你可以穿这支香水：利落、能做决定、遇事会动。你当然看重可靠，但你不觉得“靠谱”只等于守住原样——真正靠谱的人，应该在事情发生时知道下一步做什么。"],"copy_main":["你的气味轮廓很利落，也明显偏尖锐。辛香馥奇依然有传统馥奇的可靠骨架。可香料一进来，整个气味就开始向前动。豆蔻、胡椒、草本、皮革会让原本稳定的结构多出一种判断和行动的速度。它不只是“我在这里”，而更像“事情来了，我开始处理”。你很难长时间停留在纯讨论里。当然，你愿意分析问题，也需要理解背景。但当信息已经足够，你会希望事情进入下一步。谁来做？先做什么？今天能推进到哪里？如果原方案不行，替代方案是什么？","这些问题会自然进入你的脑子。你对“靠谱”的理解因此很主动。不是永远按流程办事，而是在流程失效的时候仍然知道怎么让事情继续。这种能力让你在突发状态里反而容易变得更清醒。平时没事时，你可能还会拖一拖、懒一点。可真的出了问题，周围人开始慌，你却很容易突然进入一种很明确的模式：先解决最重要的。别的以后再说。你的稳定不是静止，而是行动中的稳定。"],"copy_hidden":["因为你很快进入解决模式，别人可能会觉得你不太在意过程里的情绪。其实很多时候，你只是把顺序排得不一样。事情正在发生时，你更愿意先处理事情。等问题真的解决以后，那些被暂时放到后面的烦、委屈、害怕，才可能慢慢追上来。所以你偶尔会出现一种很奇怪的延迟反应：当时没什么，过了两天反而突然觉得很累。这并不是情绪迟钝。而是你的系统非常习惯在关键时刻先保证功能。你真正需要学会照顾的，不是“怎么更能扛”。","而是有时候事情已经结束了，也允许自己承认：刚才那件事确实让我消耗了很多。"]},{"family":"芳香调 Aromatic","subtype":"薄荷","first_line":"你像一口刚吸进去的冷空气：清醒得很快，也知道什么时候该往后退一步。","core_perfume":"Guerlain — Aqua Allegoria Herba Fresca","radar":{"明亮":90,"柔软":20,"尖锐":90,"深邃":25,"清冷":95,"温暖":15,"克制":72,"丰盛":20},"copy_perfume":["Guerlain — Aqua Allegoria Herba Fresca它不是甜薄荷糖，而是一整把刚带着露水摘下来的草本。留兰香、绿茶与刚割下来的青草一起，把空气迅速拉冷、拉开，留下非常清楚的空间感。","当你想要表现出这样的一面时，你可以穿这支香水：清醒、轻快、有边界。你不是喜欢把人推远，而是很清楚一件事：有些时候，先把距离拉开一点，反而更容易知道自己真正想要什么。"],"copy_main":["你的气味轮廓很亮、很冷，也非常利落。薄荷不是一种需要慢慢建立存在感的气味。它一出现，整个空气就会发生变化。原本闷着的地方突然被拉开，呼吸变深，注意力也会瞬间重新回来。你很擅长做这种“切断”。当一个环境太吵、一段关系太黏、一件事反复消耗却没有进展时，你通常会比很多人更早产生一种很明确的需求：我要先出去一下。这个“出去”不一定是真的离开。可能只是关掉消息、停止争论、少说几句、独处一会儿，或者把自己从某种正在不断拉扯的情绪里暂时抽出来。","你需要空间，才能重新判断。所以你并不喜欢所有问题都必须“当场说开”。有时候越说越混乱，越靠近越看不清。对你来说，先冷下来不是逃避，而是一种非常有效的自我校准。等空气重新流动以后，你往往反而知道自己真正介意的是什么。你身上的边界也因此来得很快。不是每一条边界都需要长篇解释。有时一个地方让你持续不舒服，你会直接减少进入；一个人反复越线，你会迅速降低接近程度。你不是为了惩罚谁。你只是很清楚：","如果我连自己的呼吸空间都保不住，后面的所有判断都会失真。"],"copy_hidden":["别人可能会觉得你“说走就走”。但很多时候，你真正做的并不是离开。而是避免自己在过度刺激的状态里做出一个并不真正想做的决定。你知道人在太生气、太黏、太累的时候，很容易把短暂感受误认成最终答案。所以你会先降温。这也是为什么，有些关系在你暂时退开以后，反而还能继续；而那些连一点空间都不能允许你的关系，才真正容易让你失去兴趣。你需要的不是永远自由。而是确认一件事：我靠近你，是因为我还想靠近，而不是因为我已经没有地方可以退。"]},{"family":"芳香调 Aromatic","subtype":"鼠尾草","first_line":"你像一束晒干的鼠尾草：不喧哗，却带着一种很成熟的判断气息。","core_perfume":"Byredo — De Los Santos","radar":{"明亮":60,"柔软":25,"尖锐":72,"深邃":55,"清冷":78,"温暖":25,"克制":88,"丰盛":30},"copy_perfume":["Byredo — De Los Santos","鼠尾草在这里不是“草本清新”的装饰，而是开场就非常清楚的核心。黄李带来一点果感，鸢尾和岩蔷薇增加深度，最后落到 Ambroxan、Palo Santo 与麝香里。它安静，却很有判断力。","当你想要表现出这样的一面时，你可以穿这支香水：成熟、清醒、不急着反应。你很少因为一个瞬间就彻底站队，更愿意先看清楚事情真正的重量，再决定自己站在哪里。"],"copy_main":["你的气味轮廓很克制，也很清醒。鼠尾草不是一种特别讨巧的草本。它有干燥感，有一点苦，有时甚至显得偏灰。它不像薄荷那样一出现就让人觉得“醒了”，而更像某种慢慢稳定下来的理智。你的判断方式也更接近这一种。你不太喜欢在信息还很少的时候就立刻做结论。一个人说了一句话，你会先想那句话发生在什么场景；一件事看起来很糟，你也会想有没有自己还不知道的部分。这并不代表你没有立场。恰恰相反，你只是希望自己的立场值得信任。","所以你很少为了“反应快”牺牲准确。你愿意承认自己暂时不知道，也可以接受之后根据新信息修改判断。对你来说，这不叫摇摆，而是对现实保持诚实。你也比较抗拒情绪裹挟式的决定。当周围所有人都在说“必须马上选边”，你反而更容易慢下来。你需要确认：这真的是原则问题，还是只是群体情绪？我是真的认同，还是只是不想显得格格不入？这种能力让你显得很稳定。不是因为你永远正确，而是因为你愿意为自己的判断过程负责。","你真正珍惜的不是“我从不改口”，而是“我知道自己为什么这样想”。"],"copy_hidden":["你看起来理性，但并不等于你没有直觉。很多时候，你第一秒其实已经感觉到哪里不对。只是你不会立刻把这种感觉宣布成事实。你会继续看，继续确认，直到直觉和信息慢慢对上。所以你真正相信的判断，往往不是纯粹理性推出来的。它通常是：感受先到了，理性再帮你确认它有没有站得住。这也是为什么，一旦你真正形成结论，别人很难只靠几句话把你带走。不是因为你固执。而是因为这个判断已经在你里面走过了一整套过程。","你不是反应慢，你只是很少把第一反应当成最后答案。"]},{"family":"芳香调 Aromatic","subtype":"迷迭香","first_line":"你像被太阳晒热的迷迭香：清醒、明亮，想明白以后就会开始动。","core_perfume":"Acqua di Parma — Colonia","radar":{"明亮":82,"柔软":25,"尖锐":85,"深邃":35,"清冷":78,"温暖":30,"克制":65,"丰盛":35},"copy_perfume":["Acqua di Parma — Colonia","它以柠檬、甜橙和卡拉布里亚佛手柑开场，随后薰衣草、玫瑰、马鞭草和迷迭香把芳香心调撑起来，最后落到香根草、檀香和广藿香。结构经典，但一直有一种很明确的向前感。","当你想要表现出这样的一面时，你可以穿这支香水：清醒、主动、开始行动。你不是那种想明白很多以后依然愿意永远停在原地的人——思考最终应该帮你找到下一步。"],"copy_main":["你的气味轮廓很亮，也很有行动感。迷迭香是一种很“向前”的草本。它不只是清醒，还带一点干燥、阳光和刺激感。闻起来不像“停下来冥想”，更像一个人在早晨洗完脸，打开窗，知道今天该做什么。你也很容易把思考理解为一种工具。当然，你会分析。但分析的目的不是为了永远留在分析里。当你已经大致知道问题在哪里以后，你会自然开始问：那接下来呢？可以试什么？最小一步是什么？有没有一个方法先跑起来看看？","这使你比很多“很会想的人”更容易真正推进事情。你不需要所有信息都百分之百完整才开始。只要风险大致可控，方向基本合理，你通常愿意先做一个版本。因为很多答案，本来就只有做了以后才会出现。这种倾向也影响你看待成长的方式。你不太迷恋“我已经彻底想明白自己”。比起获得一个漂亮的解释，你更关心：这个理解能不能让我下一次做得不一样？所以你的反思最终总会回到现实。如果一件事只让我更懂，却没有让我更能行动，它对你的价值就会慢慢降低。"],"copy_hidden":["你行动得快，别人可能会觉得你很笃定。但很多时候，你其实只是接受“不确定也可以开始”。你并没有比别人更确定结果。你只是更能忍受边做边修。这也意味着，你并不是没有犹豫。只是你不愿意把犹豫变成无限等待。真正让你焦虑的，反而是明明知道一件事迟早要做，却很久没有任何实际动作。因为那会让你产生一种非常强的停滞感。所以你有时并不是急。你只是在确认自己仍然和现实保持连接。你需要行动，不只是为了得到结果，也是为了让想法重新获得重量。"]},{"family":"芳香调 Aromatic","subtype":"辛香草本","first_line":"你像草本里突然碾碎的一粒胡椒：理性还在，但空气一下变得更有火花。","core_perfume":"Creed — Viking","radar":{"明亮":70,"柔软":20,"尖锐":92,"深邃":50,"清冷":70,"温暖":45,"克制":60,"丰盛":55},"copy_perfume":["Creed — Viking","它的芳香骨架里一直有辛辣张力。佛手柑、柠檬、橙子和薄荷打开明亮感，粉红胡椒、苦艾很快加入锋利，随后多香果、丁香、薰衣草与鸢尾继续加深，最后落在雪松、香根草和麝香。它不是安静的清醒，而是会把头脑点亮的清醒。","当你想要表现出这样的一面时，你可以穿这支香水：锐利、有观点、喜欢真正有内容的碰撞。你不需要所有人都同意自己，甚至某种程度上，你会因为遇到一个值得反驳的人而变得更有精神。"],"copy_main":["你的气味轮廓很尖锐，也带着明显的活性。辛香草本和鼠尾草不一样。鼠尾草更像沉下来以后形成判断；辛香草本更像一个观点突然撞进来，原本安静的脑子一下开始运转。你喜欢有内容的碰撞。不是单纯争输赢。而是有人真的提出一个你没想过的角度，或者一个观点足够完整，让你必须重新检查自己原来的判断。这种时候，你反而容易兴奋。因为你对“被挑战”没有那么天然的排斥。只要挑战本身值得。你不需要对方为了照顾你的情绪，最后什么都说得模模糊糊。一个清楚、有逻辑、甚至和你完全相反的观点，有时候比一百句“都可以”更容易获得你的尊重。","这也让你对无内容的共识很容易失去兴趣。所有人都点头，却没人真正思考；一段讨论看起来和谐，其实只是每个人都在避免真正的问题——这种状态对你来说比冲突更无聊。你喜欢的是：我们可以不同，但最好都是真的在想。这种碰撞会让你的思维保持活性。而你也愿意因此修改自己的观点。真正有趣的不是证明自己一直对。而是发现：原来世界还可以这样理解。"],"copy_hidden":["你喜欢观点碰撞，却不代表你喜欢人身上的攻击性。事实上，你通常能很快区分：一个人在反驳我的观点，还是在试图贬低我这个人。前一种你可能非常享受。后一种会迅速让你失去兴趣。因为你真正追求的不是争斗感。而是智力上的活性。如果一场讨论最后只剩身份、面子和谁压过谁，你会觉得它已经失去价值。所以你真正尊重的人，往往不是永远同意你的人。而是那些能清楚地说出不同意见，同时又不需要通过否定你来证明自己的聪明的人。","你喜欢锋利，但你喜欢的是有内容的锋利。"]},{"family":"绿叶调 Green","subtype":"黑加仑叶","first_line":"你像一片揉碎的黑加仑叶：青、酸、带一点怪，却因此很难被认错。","core_perfume":"Diptyque — L’Ombre dans l’Eau","radar":{"明亮":65,"柔软":20,"尖锐":92,"深邃":45,"清冷":82,"温暖":20,"克制":55,"丰盛":40},"copy_perfume":["Diptyque — L’Ombre dans l’Eau","它没有把黑加仑做成甜果汁。真正醒目的反而是黑加仑叶与芽的青涩、酸感和略带锋利的植物气息，玫瑰则从这片深绿里慢慢长出来。它漂亮，但从来不圆润得没有脾气。","当你想要表现出这样的一面时，你可以穿这支香水：独立、有辨识度、不急着让所有人都觉得你好理解。你宁愿保留一点自己的怪，也不太愿意为了融入，把真正有意思的部分磨平。"],"copy_main":["你的气味轮廓很青、很锐，也有明显的清冷感。黑加仑叶是一种非常不像“标准好闻”的绿。它不是草地的清新，也不是森林的安静。把叶片揉碎以后，会出来一股酸、涩、甚至有一点奇怪的青气。有人第一秒不一定喜欢，但很难说它没有辨识度。你身上也有这种不太愿意被标准化的部分。你很难仅仅因为“大家都这样”，就自动觉得这样最好。流行的东西当然可以喜欢，但如果你真的没感觉，也不会因为怕显得不合群，就努力说服自己产生兴趣。","你的审美和判断里，有一种很强的个人口味。","你会被某些非常具体、甚至有点偏门的东西击中。别人可能说不上哪里好，你自己却知道——就是这个细节，就是这种不完全漂亮的地方，让它和其他东西不一样。你也不太喜欢过度修饰。一个人太会说正确的话、一件东西漂亮得没有任何毛刺，反而可能让你觉得少了一点生命感。你需要一点“没被处理干净”的东西。它可以是一个怪癖、一处不规则、一种别人不一定立刻理解的选择。因为对你来说，真正有趣的东西往往不是最符合标准的东西。","而是：它有自己的味道。"],"copy_hidden":["你的“不合群”其实没有想象中那么叛逆。你不是为了和别人不同，才故意选择不同。恰恰相反，如果你真的喜欢一件很主流的东西，你也完全可以大方承认。你真正抗拒的是另一件事：明明没有感觉，却因为所有人都在说好，而要求自己也必须喜欢。所以你很多时候显得很有个性，并不是因为你在经营个性。而是你不太愿意伪造自己的反应。这会让你偶尔显得挑剔、奇怪，甚至“不太好带”。可这也是你最难被替代的地方。你不是一直在寻找不同。","你只是一直在问：这真的是我的吗？"]},{"family":"绿叶调 Green","subtype":"无花果叶","first_line":"你像阳光下的一整棵无花果树：有奶绿的柔软，也有一种不急着证明自己的松弛。","core_perfume":"Diptyque — Philosykos Eau de Parfum","radar":{"明亮":72,"柔软":48,"尖锐":45,"深邃":35,"清冷":60,"温暖":45,"克制":40,"丰盛":45},"copy_perfume":["Diptyque — Philosykos Eau de Parfum","它不是只写无花果果肉，而是把整棵树放了进来：叶片、树液、木头、树皮，再用白雪松加强枝干的干燥感。绿意、奶感和阳光晒过木头的气息一起出现，让它天然带着一种很完整的植物感。","当你想要表现出这样的一面时，你可以穿这支香水：松弛、自洽、不慌。你不太需要时时确认自己是不是走在“正确的人生进度”上，只要现在的生活和自己还合得来，你就愿意按照自己的节奏继续长。"],"copy_main":["你的气味轮廓很绿，也有一种难得的松弛感。无花果叶不是那种特别锋利的绿。它更奶、更厚一点。叶子被阳光晒热以后，青气里会带一点白色树液和果肉般的柔软，旁边还有树干与树皮的干燥感。它很像一棵已经长在那里很久的树。不急。也不需要别人确认它正在生长。你身上也有这种天然的自洽。你当然会看别人，也会有比较，也会偶尔怀疑自己的选择。但你很难长时间活在“别人都到哪里了”这个问题里。因为最后真正决定你状态好不好的，往往还是：","我现在过得舒不舒服？这件事是不是我真的想要？这样的生活长期下去，我会不会越来越不像自己？你对进度的焦虑通常没有对“不合适”的敏感强。哪怕一条路看起来很漂亮，只要你在里面长期需要扭曲自己，你就会开始怀疑它值不值得。相反，一件事即使没有那么标准，只要你越来越自在、越来越像自己，你往往愿意给它时间。这让你身上有一种很植物性的力量。不是不断冲刺。而是：只要环境还允许，我就按照自己的方向继续长。"],"copy_hidden":["你的松弛有时会让别人误以为你没有野心。其实不是。你只是很难被“别人觉得厉害”这件事单独驱动太久。如果一个目标本身不能让你产生真实欲望，只靠排名、评价和体面，你很容易在得到以后发现自己并没有想象中开心。所以你真正想要的东西，往往比外界看起来更私人。它可能不是最标准的成功路径。但一旦你确定它真的适合自己，你反而可以很稳定地往前走。你不急着证明。因为你更相信一种很慢的东西：如果它真的属于我，我最终会长到那里。"]},{"family":"绿叶调 Green","subtype":"番茄叶","first_line":"你像手指蹭过番茄藤以后留下的青涩气味：生、生动，甚至有一点故意不讨巧。","core_perfume":"Maison Margiela Replica — From the Garden","radar":{"明亮":70,"柔软":18,"尖锐":95,"深邃":35,"清冷":88,"温暖":18,"克制":45,"丰盛":40},"copy_perfume":["Maison Margiela Replica — From the Garden","它直接把番茄园写进香水里。番茄叶是最醒目的绿色骨架，青柑橘带一点明亮酸意，广藿香和天竺葵则把泥土、茎叶和植物的湿气留在后面。它不是抽象的“清新”，而是真正能让人想到手上沾到植物汁液的绿。","当你想要表现出这样的一面时，你可以穿这支香水：好奇、实验、不怕有一点奇怪。你愿意试那些还没有被所有人验证过的东西，只要它真的让你觉得“这个有意思”。"],"copy_main":["你的气味轮廓很青、很锐，也非常有实验感。番茄叶是一种很有态度的植物气味。它不圆润，不甜，甚至有一点涩。摘番茄的时候手指碰过藤蔓，留下来的那股绿色汁液味，很具体，也很难伪装成别的东西。你很容易被这种“还没被驯化”的状态吸引。一个新工具、一种没人怎么做过的方法、一个风格有点怪但很有潜力的东西，你可能比看到一个已经被证明很成熟的方案更兴奋。不是因为成熟不好。而是未知里面有参与感。如果所有路径都已经被写好，所有答案都已经被别人验证，你反而很容易觉得无聊。","你喜欢自己去碰一下边界。试试看这个能不能成立，原来的规则是不是一定要这样，有没有别的方法。哪怕最后发现不行，这个过程本身也会让你觉得值得。你的非主流并不是为了标新立异。你只是对“尚未形成标准答案”的东西有更高容忍度。别人觉得风险大、奇怪、不够主流的地方，你第一反应未必是拒绝。更可能是：等一下，这里面会不会有东西？"],"copy_hidden":["你愿意实验，不代表你什么都接受。真正无聊的“怪”，你一样很快失去兴趣。你对新东西的兴奋建立在一个前提上：它必须真的有某种逻辑、潜力、或者新的可能性。仅仅为了不同而不同，在你看来反而很廉价。所以你其实比想象中更会筛选。只是你的筛选标准不完全依赖“别人已经证明过”。你愿意把判断往前放一点。这意味着你偶尔会踩空。但你也因此更容易在一件东西还没变成共识之前，就先看到它有意思的地方。你承担了一点试错，也换来了更早看到新可能的机会。"]},{"family":"绿叶调 Green","subtype":"青草","first_line":"你像刚割开的青草：没有太多修饰，第一口就是活着本来的味道。","core_perfume":"CHANEL — N°19 Eau de Parfum","radar":{"明亮":85,"柔软":30,"尖锐":60,"深邃":25,"清冷":78,"温暖":30,"克制":45,"丰盛":25},"copy_perfume":["CHANEL — N°19 Eau de Parfum","它的绿色非常明确。白松香带来鲜亮、近乎锋利的青感，鸢尾则用粉质与柔软把它拉住，后面还有依兰、铃兰与玫瑰增加花感。绿意没有被做得可爱，而是保留着一种清楚、直接、不妥协的生命感。","当你想要表现出这样的一面时，你可以穿这支香水：真实、直接、不需要过度包装。你更愿意相信一个有点笨拙但真的人，也很难长期对那些“什么都很好看，却感觉不到人”的东西产生兴趣。"],"copy_main":["你的气味轮廓很亮、很青，也很直接。刚割开的草不会问自己闻起来够不够高级。它就是草汁、泥土、太阳和一点水汽。这种气味很简单，可它的简单并不空。它让人立刻想到一个真实存在的地方。你对很多人的判断也很依赖这种“真实存在感”。你不一定要求一个人表达得很漂亮。相反，一个人讲话偶尔笨一点、承认自己不知道、做错以后直接说“是我弄错了”，往往比一套完美的表达更容易得到你的信任。你对过度包装非常敏感。","不是说你讨厌精致。你只是希望精致下面真的有东西。如果一个人所有表达都像经过设计，永远不会说错、不会尴尬、不会露出一点不合时宜的部分，你反而会开始怀疑自己到底有没有真正接触到这个人。你需要一点未经加工的质地。这让你对生活里的很多“小土”“小笨”“不完美”有很高容忍度。只要它是真的。真实在你这里，常常比漂亮更有吸引力。"],"copy_hidden":["你喜欢真实，却不是要求所有人什么都说出来。你其实很尊重保留。一个人可以不讲，可以慢一点，也可以有自己不愿意分享的部分。你真正反感的是“明明不是这样，却一定要演成这样”。这两件事在你看来完全不同。沉默是真实的一种。不确定也是真实的一种。甚至一个人承认“我现在就是不想说”，你可能都比听到一套漂亮但虚假的解释舒服。所以你的直接，并不是要求世界永远粗糙。而是希望表面和里面不要差得太远。","你可以接受不完美，但你很难接受长期表演。"]},{"family":"水生调 Aquatic","subtype":"海盐","first_line":"你像海风吹干以后留在皮肤上的一层盐：自由，却仍然带着体温。","core_perfume":"Jo Malone London — Wood Sage & Sea Salt","radar":{"明亮":88,"柔软":40,"尖锐":55,"深邃":25,"清冷":88,"温暖":35,"克制":65,"丰盛":30},"copy_perfume":["Jo Malone London — Wood Sage & Sea Salt它不是蓝色海洋香，而是风吹过海岸留下的矿物感。海盐、岩岸、鼠尾草和干燥木质一起，把“海边”写成一种有空气、有盐、有皮肤温度的感觉。","当你想要表现出这样的一面时，你可以穿这支香水：自由、松弛、仍然和世界保持接触。你需要空间，但并不是为了远离所有人；你更希望自己有足够大的活动范围，然后仍然可以主动选择靠近什么。"],"copy_main":["你的气味轮廓很亮、很冷，也有明显的空间感。海盐最特别的地方，是它从来不是“完全没有温度”的水。它来自海，但最后落在皮肤上。风是冷的，盐粒是干的，身体却仍然是热的。你对自由的理解也很像这样。你并不是一定要一个人。真正让你舒服的，是关系和生活都不要把人锁死。今天可以一起，明天也可以各自忙；很亲密没有问题，但最好不需要时时汇报；彼此在乎，也不意味着所有兴趣、朋友、时间和节奏都必须完全重叠。","你喜欢的是一种有回旋余地的靠近。你当然会参与现实生活。你会工作，会答应别人，会建立关系，也会认真经营真正重要的东西。只是你希望所有这些东西都还保留一点“我仍然能呼吸”的感觉。一旦生活变成很多连续的必须——必须回复、必须解释、必须出现、必须按照既定方式行动——你会很快感觉自己开始缩小。所以你真正需要的自由，不是逃跑。而是：我仍然可以在自己的生活里移动。海盐式的自由也因此不是孤独。","它有风，有身体，有人经过。只是没有谁必须永远站在同一个位置。"],"copy_hidden":["因为你很重视空间，别人可能会以为你对关系没有那么深的需求。其实你并不排斥深。你排斥的是一种把“深”理解成“越密越好”的方式。真正舒服的亲密，对你来说更像两个人都拥有自己的海岸线。可以走远，也知道回来以后对方仍然在那里。所以你真正容易留恋的人，往往不是最会抓住你的人。而是那些不会因为你暂时去做自己的事，就怀疑你是不是已经走远的人。这种信任会让你反而更愿意主动回来。空间并不会自动削弱关系。对你来说，空间常常正是关系可以长久的原因。"]},{"family":"水生调 Aquatic","subtype":"海洋","first_line":"你像望不到边的深海：冷、远，越往外看，反而越能听清自己。","core_perfume":"Giorgio Armani — Acqua di Giò Profondo","radar":{"明亮":65,"柔软":20,"尖锐":60,"深邃":45,"清冷":98,"温暖":10,"克制":90,"丰盛":20},"copy_perfume":["Giorgio Armani — Acqua di Giò Profondo","它把经典海洋水感压得更深。海洋调与芳香草本先带来冷蓝色的开阔感，随后木质、矿物和更深的水感慢慢沉下来。它不是沙滩，而更像离岸以后逐渐看不见陆地的海。","当你想要表现出这样的一面时，你可以穿这支香水：冷静、辽阔、有距离。你并不需要时时参与所有事情，很多时候，拉开一点距离以后，你反而更容易看清什么真正值得自己投入。"],"copy_main":["你的气味轮廓非常冷，也非常克制。海洋和海盐最大的不同，是距离。海盐还会让人想到皮肤、岩岸和风。海洋更像真正离开陆地以后，那种周围突然没有那么多参照物的感觉。世界变大，人也变小。这种距离对你并不一定意味着疏离。它更像一种整理视野的方式。当所有事情同时涌过来，每个人都有意见，每一件事都像很紧急，你反而容易觉得自己什么都看不清。真正让你重新稳定下来的，常常是把画面拉远一点。一个月以后，这件事还重要吗？如果不是我现在正在里面，我会怎么看？这到底是一个真正的问题，还是只是此刻非常吵？","这种“拉远镜头”的能力，是你很重要的判断方式。你不太容易被群体情绪长期裹着走。不是因为你没有感受，而是你需要确认自己究竟在感受什么。所以你有时会主动减少输入。不看消息，不参与讨论，一个人走很久，甚至暂时不想解释自己。距离够大以后，很多原本看起来铺天盖地的东西，会重新回到真实比例。你真正需要的不是冷漠。而是一个足够大的视野，让任何单一事件都不能立刻占据整个世界。"],"copy_hidden":["你的距离感有时会让别人觉得你很难真正靠近。可你其实并不是拒绝亲密。只是你很少因为关系亲近，就自动认为彼此应该共享所有判断。你需要自己的视角。哪怕所有人都在说一件事，你仍然希望保留一点独立观察的时间。真正让你信任的人，不会因为你没有立刻回应，就马上把沉默解释成冷淡。他们知道你有时只是需要先离岸一点。等声音变小，你才知道自己真正想说什么。你不是一直想远离人。你只是需要一些地方，世界没有那么贴近脸。"]},{"family":"水生调 Aquatic","subtype":"雨水","first_line":"你像一场刚停下来的雨：声音已经小了，空气里却还留着很多没说完的东西。","core_perfume":"Maison Margiela Replica — When the Rain Stops","radar":{"明亮":65,"柔软":58,"尖锐":35,"深邃":45,"清冷":88,"温暖":20,"克制":75,"丰盛":30},"copy_perfume":["Maison Margiela Replica — When the Rain Stops它写的不是暴雨，而是雨刚过去以后。水生气息、湿润玫瑰、广藿香、苔藓与松针把空气做得很湿，像地面还没有完全干，植物上仍然挂着水。","当你想要表现出这样的一面时，你可以穿这支香水：安静、敏感、留有余味。你不是每一种感受都必须马上说出来，有些东西更适合先在自己这里停一会儿，等它慢慢变清楚。"],"copy_main":["你的气味轮廓偏冷、偏柔，也很安静。雨水的存在感很奇怪。下雨时当然很明显。可真正让人记住的，常常是雨停以后。路面变深，树叶发亮，空气里有湿土和植物味，很多声音都比平时更近。你处理自己的情绪也很像这样。事情真正发生的时候，你未必是反应最大的人。有时候你甚至很正常。该做什么还是做，别人问你也会说没事。可等环境安静下来以后，那些当时没有完全出现的感受才会慢慢回来。一句话到底为什么让你难受，一个瞬间为什么一直记着，一段关系真正改变你的是什么——这些答案往往都来得比事件本身晚一点。","所以你需要私人时间。不是因为所有事情都必须独自消化。而是你有一部分感受，只有在没有人等着你回应时，才会真正露出来。你很难一边被问“所以你现在到底怎么想”，一边准确知道自己怎么想。越被催，反而越容易说出一个只是为了结束对话的答案。你真正舒服的是：先让雨停。等空气慢慢静下来以后，你通常比任何时候都更知道自己发生了什么。"],"copy_hidden":["因为你的感受来得比较安静，别人有时会低估事情对你的影响。你自己也可能低估。当下能正常吃饭、工作、聊天，就会觉得自己大概没有那么在意。直到某天路过一个地方、听到一句话，或者突然闻到某种很熟悉的味道，你才发现原来那件事一直还在。这并不代表你放不下。只是你的情绪很少喜欢用最大的声音出现。它更像潮气。不一定看得见，却真实存在于空气里。所以你真正适合的处理方式，从来不是逼自己“现在就想通”。","而是允许那些还没有成形的感受先存在。不是每一种情绪都需要立刻变成结论。"]},{"family":"水生调 Aquatic","subtype":"矿物水感","first_line":"你像冷水流过石头：干净、透明，几乎没有任何多余的东西。","core_perfume":"Le Labo — Baie 19","radar":{"明亮":80,"柔软":20,"尖锐":72,"深邃":25,"清冷":98,"温暖":10,"克制":95,"丰盛":12},"copy_perfume":["Le Labo — Baie 19它写的是雨落在干燥土地上的气味。湿空气、杜松、绿叶、广藿香与矿物感一起，做出一种非常冷、非常湿、却又不像传统水生香的“雨后石头”质地。","当你想要表现出这样的一面时，你可以穿这支香水：极简、清醒、低干扰。你不太喜欢把一个原本可以简单解决的问题，变成越来越复杂的系统；当东西太多时，你更本能的反应是删减。"],"copy_main":["你的气味轮廓极冷，也极度克制。矿物水感不是“很多水”。它反而像水把所有多余的东西冲走以后，留下来的石头、空气和一点湿气。你很容易被这种低复杂度的状态吸引。不是因为你无法理解复杂。而是你通常能很快察觉：很多复杂其实不是事情本身造成的，而是人不断往上叠加出来的。多一个流程，多一句解释，多一个选择，多一个其实没有必要的功能。最后每一个单独看都合理，整体却变得越来越沉。你对这种“人为复杂”耐心很低。","所以你经常会问：能不能删掉？真的需要吗？如果只留下最重要的一层，会发生什么？你喜欢清楚的界面、直接的表达、有限的选择和能够被快速理解的逻辑。这并不意味着你审美贫乏。恰恰相反。当东西变少以后，你反而更能感觉到比例、材质、留白和真正重要的差别。你的极简并不是“什么都不要”。而是：我只想让真正重要的东西拥有足够空间。"],"copy_hidden":["别人有时会觉得你删得太快。一个群聊、一项功能、一段低质量关系、一堆以后“说不定会用”的东西，你似乎很容易决定不要。可你并不是没有留恋。你只是对“占用”很敏感。任何东西只要持续占据注意力，就需要对得起它占据的空间。这也是为什么，你真正留下来的东西反而常常很稳定。因为它们已经经过了你的删减。你并不追求拥有得少。你追求的是：留下来的每一样东西，都值得在那里。"]},{"family":"美食调 Gourmand","subtype":"香草奶甜","first_line":"你像一杯刚刚温热起来的香草牛奶：柔软、安静，让人终于可以不用再撑。","core_perfume":"Giardini di Toscana — Bianco Latte","radar":{"明亮":25,"柔软":95,"尖锐":10,"深邃":55,"清冷":5,"温暖":98,"克制":15,"丰盛":95},"copy_perfume":["Giardini di Toscana — Bianco Latte它不是轻飘的香草糖。焦糖先带来浓度，蜂蜜与香豆素把中段压得柔软又奶感，香草和白麝香则让甜意贴近皮肤，像一层一直不急着散去的温度。","当你想要表现出这样的一面时，你可以穿这支香水：柔软、安心、可以完全放松。你并不觉得一个人只有一直强大才算成熟；真正安全的状态，应该允许你偶尔什么都不证明。"],"copy_main":["你的气味轮廓非常柔软，也非常温暖。香草奶甜最特别的地方，不是“甜”。而是它会让人想到一种已经解除防备的状态。牛奶是温的，香草是软的，空气里没有需要立刻解决的问题。它不像蜂蜜焦糖那样丰盛地向外给，也不像酒香那样从控制慢慢松开。它更像一句很简单的话：今天可以先不用努力。你其实很重视这种安全感。不是所有事情都必须有结果，不是每一天都必须推进，不是每次状态不好都要立刻分析原因。有些时候，人就是需要吃点东西、躺下来、把要求降到最低，然后允许身体重新变暖。","你很容易理解这种需要。所以你对“舒服”的敏感度很高。环境是不是让人放松，一段关系里能不能真正卸力，一个人靠近时会不会让你下意识紧张——这些看起来很细小的东西，对你其实很重要。你不太相信一种需要持续表现才能获得的爱。如果必须一直聪明、一直漂亮、一直有趣、一直懂事，才能维持对方的兴趣，那么无论那段关系看起来多么热烈，你都很难真正把它称为安全。你真正想要的是：我状态好的时候你会喜欢我，状态不好的时候我也不用立刻变回“好用”的样子。","这就是香草奶甜真正的温暖。不是纵容。而是一种允许人暂时不处于最佳状态的空间。"],"copy_hidden":["因为你很向往被接住，你有时反而会很认真地确认：这里真的安全吗？你并不是谁给一点温柔，就会立刻完全放松。真正让你卸下防备的，往往是很多很小的重复——你状态不好时对方没有嫌烦，你拒绝一次以后关系没有变质，你偶尔任性也没有立刻被扣分。等这些东西一次次成立以后，你才会真的软下来。所以你最深的柔软并不廉价。它需要被时间证明。你不是想找一个替你承担生活的人。你只是希望世界上确实有一个地方，你偶尔可以不用承担。"]},{"family":"美食调 Gourmand","subtype":"咖啡可可","first_line":"你像一杯不加太多糖的深烘咖啡：有苦味，但苦味并没有取消享受。","core_perfume":"Akro — Awake","radar":{"明亮":20,"柔软":65,"尖锐":35,"深邃":82,"清冷":10,"温暖":85,"克制":55,"丰盛":90},"copy_perfume":["Akro — Awake","咖啡是绝对核心，而且保留了刚磨开的苦香。柠檬把开场拉亮，绿豆蔻增加一点辛香，香根草则让咖啡落回干燥、成熟的底色。它不是甜品咖啡，更像真正让人醒来的那一杯。","当你想要表现出这样的一面时，你可以穿这支香水：成熟、清醒、会享受。你知道快乐不一定要没有苦味，甚至很多真正让你上瘾的东西，恰恰是因为甜和苦同时存在。"],"copy_main":["你的气味轮廓很暖、很深，也保留着一点苦。咖啡和可可都不是纯粹的甜。真正好喝的咖啡有烘烤、有酸、有苦；高浓度可可甚至会留下明显的涩。可正是这些味道，让最后那一点甜变得更有内容。你对生活的享受也更接近这种状态。你并不需要世界先变得完美，才允许自己过得好。事情可以还有麻烦，工作可以仍然很累，某个问题也许暂时没有解决。但今天这杯东西很好喝，晚上有一顿喜欢的饭，某个人发来一句很有意思的话——这些好，并不会因为其他地方还有问题就失效。","你很懂这种“成熟的快乐”。它不是逃避现实。反而是你已经知道现实不会永远整齐，所以更不愿意把所有快乐都延期到“等一切都好了以后”。你能够接受苦和甜同时存在。一段关系有困难，不等于里面所有快乐都是假的；一个目标很累，也可能真的值得；一个人身上有缺点，也不妨碍某些部分让你非常欣赏。你不需要把它们强行统一。生活本来就可以一边苦，一边很好喝。"],"copy_hidden":["你看起来很会自我调节，所以别人可能会以为你对很多困难都“挺能接受”。其实你不是接受困难。你只是不愿意因为困难存在，就把自己所有享受的权限一起关掉。你会生气，会疲惫，也会明确知道某件事很糟。只是到了吃饭的时候，你还是希望饭是好吃的。这听起来很小。却是一种很强的生活能力。因为你没有把“认真面对问题”和“允许自己快乐”放在同一个开关上。你可以承认日子有苦，也仍然坚持往里面加一点自己真正想要的味道。"]},{"family":"美食调 Gourmand","subtype":"蜂蜜焦糖","first_line":"你像一勺刚从火上离开的蜂蜜焦糖：金色、浓稠，丰盛得几乎要溢出来。","core_perfume":"Guerlain — Tobacco Honey","radar":{"明亮":40,"柔软":90,"尖锐":15,"深邃":65,"清冷":5,"温暖":98,"克制":20,"丰盛":100},"copy_perfume":["Guerlain — Tobacco Honey","这里的蜂蜜不是轻巧的甜，而是非常浓、非常金色的甜。烟草让它变得更暗，香草、零陵香豆和芝麻增加丰厚感，丁香与茴香带来辛香，最后还有檀香与沉香把甜压进更深的木质底色。","当你想要表现出这样的一面时，你可以穿这支香水：丰盛、热情、愿意给。你并不太欣赏把所有需求都压到最低的生活；真正喜欢的人和东西，你更愿意让对方感受到“这里是真的有很多”。"],"copy_main":["你的气味轮廓几乎是整套结果里最丰盛的一种。蜂蜜和焦糖都不是“刚刚好”的味道。它们会挂在勺子上，会拉丝，会留下明显的甜香。哪怕只放一点，也很难完全装作它不存在。你对真正重要的人和事也经常这样。一旦认定值得，你很少只给一个模糊的“还不错”。你会想让这件事变得更好一点：多准备一点，多照顾一个细节，多买一份，多问一句。这种给予有时甚至比语言更自然。你可能不一定擅长每天说很多好听的话。但你会记得别人随口提过的东西，会下意识想“这样是不是更舒服”，会因为看到适合对方的东西就想到他。","你喜欢让生活有一点“多出来”。不是最低限度满足，而是丰盛一点。桌上可以多一道菜，礼物可以多包一层，喜欢的人来时，家里最好多准备一些。这并不只是物质。你真正享受的是一种感觉：我这里有东西可以给。这种给予也会让你感觉自己和世界发生着很温暖的关系。"],"copy_hidden":["丰盛的人很容易遇到一个问题：别人慢慢习惯了你的“多”。最开始觉得惊喜的东西，后来会变成默认。而你真正委屈的时刻，常常不是“我给了这么多，你必须还我同样多”。更像是：你有没有看见这是我主动多给出来的？你并不一定要求完全对等。对方可能没有你的表达方式，也不需要复制你的给予。但你需要感受到一种回流。一句认真感谢、一次主动照顾、一个“我也想到你了”的细节，都可以。你想要的从来不是账面平衡。","你只是希望自己的丰盛不要像倒进一个没有底的容器。你愿意多给，但你也希望爱是会流回来的。"]},{"family":"美食调 Gourmand","subtype":"酒香","first_line":"你像一杯在木桶里慢慢变深的酒：平时很稳，真正放松时却会出现另一种温度。","core_perfume":"Kilian Paris — Angels’ Share","radar":{"明亮":25,"柔软":60,"尖锐":45,"深邃":82,"清冷":10,"温暖":92,"克制":35,"丰盛":98},"copy_perfume":["Kilian Paris — Angels’ Share","它直接从干邑开始。酒液的暖意被橡木托住，再加入肉桂、零陵香豆、果仁与香草般的甜暖感，像酒在木桶里慢慢浸出香气。它不是失控，而是控制松开以后出现的丰盛。","当你想要表现出这样的一面时，你可以穿这支香水：松开、释放、允许自己尽兴。你通常知道什么时候该控制，但真正舒服的人生也应该有一些时候，不必一直把自己收得那么整齐。"],"copy_main":["你的气味轮廓很暖、很深，也有非常明显的丰盛感。酒香和香草奶甜不一样。它不是从一开始就告诉你“可以放松”。它更像一个平时很有分寸的人，到了足够安全的地方，才慢慢把领口松开。你其实很理解控制的价值。很多事情当然不能只凭当下感受。工作要完成，重要决定需要判断，关系里也不能每次有情绪就把所有话都扔出去。你可以把自己管理得很好。可你也很清楚，人生如果永远只有管理，会慢慢失去味道。所以你需要一些“可以松开”的时刻。","可能是一场旅行、一顿吃很久的饭、喝一点东西、和很熟的人聊天到很晚，或者只是某一天突然决定原计划不要了。这些时刻的价值不在于失控。而在于你终于不用一直盯着自己。不用问这件事有没有效率，不用计算明天会不会后悔，也不用时时提醒自己应该表现成什么样子。你只是进入当下。酒香人格真正想要的不是放纵。而是：我知道自己收得回来，所以此刻可以松开一点。这种松弛需要安全感。也需要你对自己有基本的信任。"],"copy_hidden":["别人可能只看到你放松时很尽兴，却不知道你通常是在确认安全以后才真的放松。人不对、场合不对、明天还有重要的事，你往往根本不会进入那个状态。所以你的“释放”其实有很强的选择性。你并不是控制不住。而是偶尔主动决定：今天不用控制这么多。这也是为什么，真正能看到你非常松弛、非常孩子气、甚至有点胡闹一面的人，通常不会很多。那不是你“隐藏的真实性格”。而是另一种同样真实的你。平时会收住自己的人，也完全可以拥有一些不必收住的夜晚。"]}],"radar":{"dimensions":["明亮","柔软","尖锐","深邃","清冷","温暖","克制","丰盛"],"vectors":{"柑橘调 Citrus":{"佛手柑":[85,45,60,35,60,45,60,35],"葡萄柚":[88,30,80,30,72,30,55,25],"柠檬":[95,25,82,20,75,25,50,20],"柑橘":[92,55,50,25,45,60,35,40]},"果香调 Fruity":{"黑加仑":[72,55,65,50,50,55,40,70],"莓果":[88,70,40,35,30,70,20,75],"樱桃":[65,60,55,65,25,75,20,88],"桃李":[72,82,30,45,25,78,25,72],"热带果":[92,62,45,30,20,82,15,90]},"花香调 Floral":{"玫瑰":[60,70,50,65,30,70,50,90],"茉莉":[70,78,35,55,25,75,30,92],"晚香玉":[55,70,45,75,20,82,20,98],"鸢尾":[45,7
