<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15152a">
  <title>你有哪些负面集体潜意识？</title>
  <style>
    :root{--ink:#2d3038;--muted:#707582;--faint:#a6a9b0;--paper:#f8f5ef;--card:#fffdf9;--line:#e6e0d6;--accent:#a66b4b;--accent-soft:#f1dfd1;--max:760px}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;line-height:1.7}button{font:inherit;cursor:pointer}.shell{width:min(calc(100% - 32px),var(--max));margin:0 auto;padding:20px 0 64px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;color:var(--muted);font-size:12px;letter-spacing:.08em}.brand{font-family:Georgia,"Songti SC",serif;font-size:15px;color:var(--ink);letter-spacing:.04em}.view{display:none}.view.active{display:block;animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}h1,h2,h3{font-family:Georgia,"Songti SC",serif;font-weight:400;line-height:1.25}h1{font-size:clamp(38px,9vw,72px);margin:54px 0 24px;letter-spacing:.01em}h2{font-size:clamp(25px,5vw,40px);margin:10px 0 18px}h3{font-size:20px;margin:0 0 8px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.lede,.copy{color:var(--muted);font-size:16px;line-height:1.9}.lede{font-size:18px;max-width:34em}.note{border-left:2px solid var(--accent);padding-left:15px;color:var(--muted);margin:28px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:8px;padding:13px 22px;min-height:48px;background:var(--accent);color:#fff;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px #a66b4b2b}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:30px}.progress{height:4px;background:#ebe6dd;border-radius:4px;overflow:hidden;margin:10px 0 28px}.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}.question-card,.result-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 45px #574a3910}.question-kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:16px}.choices{display:grid;gap:10px;margin-top:22px}.choice{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--muted);background:#fffefa;transition:.2s}.choice:hover{border-color:#c79679}.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px #a66b4b1a}.choice input{margin-top:5px;accent-color:var(--accent)}.choice span{font-size:15px;line-height:1.65}.error{min-height:24px;color:#af574f;font-size:13px;margin:10px 0 0}.result-card{margin-top:36px}.result-title{margin-bottom:10px}.result-list{display:grid;gap:14px;margin-top:28px}.result-item{border-top:1px solid var(--line);padding-top:20px}.result-item .rule{font-family:Georgia,"Songti SC",serif;font-size:19px;line-height:1.55}.label{font-size:11px;letter-spacing:.12em;color:var(--accent);margin:0 0 6px}.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.asset{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fffefa}.asset strong{display:block;font-size:13px;margin-bottom:5px}.asset p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-line}.footer{color:var(--faint);font-size:12px;margin-top:28px}@media(max-width:600px){.shell{width:min(calc(100% - 24px),var(--max));padding-top:14px}h1{margin-top:42px;font-size:42px}.lede{font-size:16px}.question-card,.result-card{padding:22px 17px}.asset-grid{grid-template-columns:1fr}.choice span{font-size:14px}}
  </style>
  <style id="spectrum-overrides">
    :root{
      --paper:#15152a;--surface:#211f42;--surface-alt:#292750;--ink:#f0f1f7;--muted:#b4b6c8;--faint:#8589a5;--line:rgba(181,190,226,.2);
      --primary:#a8b9d8;--primary-dark:#c2c8ee;--primary-light:#8d9bd0;--accent:#8877b3;--accent-dark:#c6b9e5;
      --violet:#8d72b6;--indigo:#788dca;--cyan:#8dbed1;--mint:#9ccfc8;
      --spectrum:linear-gradient(135deg,#b49ad4 0%,#91a8dc 48%,#9ccfc8 100%);
      --wash:linear-gradient(110deg,rgba(112,74,157,.34) 0%,rgba(82,91,166,.28) 28%,rgba(92,143,175,.22) 58%,rgba(130,191,183,.2) 100%);
    }
    html{background:var(--paper)}
    body{background:radial-gradient(circle at 88% -6%,rgba(117,88,170,.34),transparent 34%),radial-gradient(circle at 0 44%,rgba(70,116,164,.2),transparent 32%),radial-gradient(circle at 50% 110%,rgba(75,138,139,.13),transparent 38%),var(--paper);color:var(--ink)}
    .shell{width:min(calc(100% - 24px),900px);padding:16px 0 72px}
    .top{border-bottom-color:var(--line);padding:4px 0 12px;margin-bottom:clamp(22px,5vw,72px);color:var(--muted);letter-spacing:.1em}
    .brand{color:var(--ink);font-size:17px}
    .top>span:last-child{background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
    .view.active{animation:rise .4s ease both}
    .eyebrow,.question-kicker,.label{background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
    h1{font:400 clamp(38px,8vw,72px)/1.08 Georgia,"Songti SC",serif;letter-spacing:0;margin:0 0 24px;background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{font:500 clamp(25px,5vw,42px)/1.2 Georgia,"Songti SC",serif;color:var(--primary);margin:10px 0 16px}
    h3{font-size:19px;font-weight:500;line-height:1.5}
    .lede,.copy{color:var(--muted);line-height:1.85}
    .lede{font-size:17px;max-width:38em}
    .note{border-left:3px solid transparent;border-image:linear-gradient(180deg,var(--violet),var(--cyan),var(--mint)) 1;padding:5px 0 5px 16px;color:var(--muted);line-height:1.85;background:linear-gradient(90deg,rgba(104,79,157,.25),transparent);border-radius:0 8px 8px 0}
    .hero-glow{position:relative;isolation:isolate}
    .hero-glow:after{content:"";position:absolute;right:-16px;top:-42px;width:170px;height:170px;border-radius:50%;background:var(--wash);filter:blur(22px);opacity:.62;z-index:-1;pointer-events:none}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0;color:var(--muted);font-size:12px}
    .hero-meta span{padding:7px 11px;border:1px solid rgba(174,163,224,.34);border-radius:999px;background:rgba(44,42,82,.7);color:#c5c8de}
    .actions{gap:12px;margin-top:30px}
    .question-card .question-actions{gap:24px;margin-top:32px;justify-content:space-between}
    .question-card .question-actions .btn{flex:0 0 auto;min-width:96px;padding-left:16px;padding-right:16px}
    .btn{min-height:48px;border:1px solid #aeb8e0;border-radius:4px;padding:12px 21px;background:linear-gradient(135deg,#66508f,#6f8fc5 56%,#77aaa9);color:#f7f9fd;font-weight:500;box-shadow:0 8px 18px rgba(43,37,86,.4),0 0 20px rgba(128,116,190,.12);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
    .btn:hover{background:linear-gradient(135deg,#745da0,#789bd1 56%,#83bebb);box-shadow:0 8px 18px rgba(65,52,116,.5),0 0 24px rgba(141,155,208,.23);transform:translateY(-1px)}
    .btn:focus-visible,.choice:focus-within{outline:3px solid #d8e7f5;outline-offset:3px}
    .btn.secondary{background:rgba(34,32,69,.56);color:#c2c8ee;border-color:rgba(174,184,224,.3);box-shadow:none}
    .btn.secondary:hover{background:rgba(70,66,116,.55)}
    .meta{margin-top:0;color:var(--muted)}
    .progress{height:5px;background:rgba(255,255,255,.09);border-radius:2px;margin:10px 0 28px}
    .progress span{background:linear-gradient(90deg,#71558e,#8d72b6,#788dca,#8dbed1,#9ccfc8);box-shadow:0 0 10px rgba(141,190,209,.48);border-radius:2px}
    .question-card,.result-card{position:relative;background:linear-gradient(145deg,rgba(37,34,74,.96),rgba(27,28,57,.97));border:1px solid rgba(181,190,226,.22);border-left:4px solid transparent;border-image:linear-gradient(180deg,var(--violet),var(--cyan),var(--mint)) 0 0 0 1;padding:clamp(20px,4vw,44px);border-radius:4px;box-shadow:0 18px 45px rgba(5,6,20,.36),0 0 40px rgba(112,83,161,.12)}
    .question-card:before,.result-card:before{content:"";position:absolute;inset:0;background:var(--wash);opacity:.22;pointer-events:none}
    .question-card>* ,.result-card>*{position:relative;z-index:1}
    .question-kicker{font-size:12px;letter-spacing:.12em;margin-bottom:10px}
    #question{font:400 clamp(20px,4vw,34px)/1.36 Georgia,"Songti SC",serif;max-width:23em;color:#d7dcf3;margin:0 0 22px}
    .choices{gap:8px;margin-top:0}
    .choice{min-height:48px;border:1px solid rgba(181,190,226,.22);border-radius:4px;background:rgba(26,28,59,.72);padding:12px 13px;color:#c8cbe0;transition:border .2s ease,background .2s ease,transform .2s ease,box-shadow .2s ease}
    .choice:hover{border-color:#8d9bd0;background:linear-gradient(135deg,rgba(90,67,130,.46),rgba(62,96,143,.38));transform:translateX(4px);box-shadow:0 5px 12px rgba(4,5,18,.24),0 0 18px rgba(128,116,190,.12)}
    .choice:has(input:checked){border-color:#aeb8e0;background:linear-gradient(135deg,rgba(103,76,143,.62),rgba(72,105,151,.5));box-shadow:0 0 0 2px rgba(174,184,224,.18),0 0 20px rgba(113,98,170,.16);color:#f0f1f7}
    .choice input{accent-color:var(--primary);margin-top:5px}
    .choice span{font-size:15px;line-height:1.58}
    .error{color:#9d3f4b}
    .result-card{margin-top:28px}
    .result-item{border-top:1px solid var(--line);padding:30px 0 4px}
    .result-item:first-child{border-top:0;padding-top:0}
    .result-item .rule{font:400 21px/1.55 Georgia,"Songti SC",serif;color:#d7dcf3;margin:8px 0 10px}
    .asset-grid{gap:12px;margin-top:18px}
    .asset{border:1px solid rgba(174,184,224,.22);border-radius:4px;background:linear-gradient(135deg,rgba(72,57,111,.45),rgba(48,73,111,.35));padding:15px}
    .asset strong{font-size:13px;color:#c8c3ed;font-weight:600}
    .asset p{color:var(--muted);font-size:14px;line-height:1.72}
    .footer{color:var(--faint);line-height:1.75}
    @media(max-width:600px){
      .shell{width:min(calc(100% - 24px),900px);padding-top:13px}
      .top{margin-bottom:30px}.brand{font-size:16px}
      h1{font-size:clamp(40px,12vw,58px);margin-top:8px}
      .hero-glow:after{right:-4px;top:-22px;width:120px;height:120px}
      .lede{font-size:16px}.question-card,.result-card{padding:22px 16px}
      #question{font-size:23px;line-height:1.42}
      .choice{padding:12px 11px}.choice span{font-size:14px}
      .question-card .question-actions{gap:28px;margin-top:34px}
      .question-card .question-actions .btn{flex:0 0 auto;min-width:92px;padding-left:14px;padding-right:14px}
      .asset-grid{grid-template-columns:1fr}
      .actions .btn{flex:1 1 140px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><span class="brand">负面集体潜意识</span><span>Bridge Test</span></header>
    <section id="intro" class="view active hero-glow">
      <p class="eyebrow">SOCIAL VOICES IN YOUR HEAD</p>
      <h1>你有哪些<br>负面集体潜意识？</h1>
      <p class="lede">有些念头不完全是“你的”。它们可能来自家庭、学校、关系、媒体和时代，慢慢变成了脑内自动播放的规则。</p>
      <p class="note">这份测试不判断你对不对，只帮你认出：哪些声音正在影响你的选择。</p>
      <div class="hero-meta"><span>30+ 道题</span><span>约 8 分钟</span><span>按直觉作答</span></div>
      <div class="actions"><button class="btn" id="start">开始测试</button></div>
    </section>
    <section id="quiz" class="view">
      <div class="meta"><span id="part">答题进度</span><span id="count"></span></div>
      <div class="progress"><span id="progress"></span></div>
      <div class="question-card"><div class="question-kicker" id="kicker"></div><h2 id="question"></h2><div class="choices" id="choices"></div><p class="error" id="error"></p><div class="actions question-actions"><button class="btn secondary" id="back">上一题</button><button class="btn" id="next">下一题</button></div></div>
    </section>
    <section id="result" class="view">
      <p class="eyebrow">YOUR SOCIAL SCRIPTS</p><h2>你脑子里最容易替你做决定的声音</h2>
      <div class="result-card"><div id="summary"></div><div class="result-list" id="results"></div></div>
      <p class="footer">本测试用于自我探索与娱乐参考，不构成心理、医疗或职业诊断。一个念头出现在脑子里，不代表它就有权替你决定人生。</p>
      <div class="actions"><button class="btn secondary" id="restart">重新测试</button></div>
    </section>
  </main>
  <script type="module">
    import { CONFIRM_QUESTIONS, shuffledQuestions, evaluate } from './engine-browser.mjs';
    const $ = id => document.getElementById(id);
    const state = { questions: [], index: 0, answers: {}, confirmationIds: [], result: null };
    const show = id => { document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === id)); window.scrollTo(0, 0); };
    const renderQuestion = () => {
      const q = state.questions[state.index];
      $('part').textContent = '答题进度';
      $('count').textContent = `${state.index + 1} / ${state.questions.length}`;
      $('progress').style.width = `${(state.index + 1) / state.questions.length * 100}%`;
      $('kicker').textContent = q.id;
      $('question').textContent = q.text;
      $('choices').innerHTML = q.options.map((option, index) => `<label class="choice"><input type="radio" name="answer" value="${index + 1}" ${state.answers[q.id] === index + 1 ? 'checked' : ''}><span>${String.fromCharCode(65 + index)}. ${option}</span></label>`).join('');
      $('choices').querySelectorAll('input').forEach(input => input.addEventListener('change', () => { state.answers[q.id] = Number(input.value); $('error').textContent = ''; }));
      $('back').disabled = state.index === 0;
      $('next').textContent = state.index === state.questions.length - 1 ? '查看结果' : '下一题';
      $('error').textContent = '';
    };
    const renderResult = result => {
      state.result = result;
      const top = result.top;
      $('summary').innerHTML = top.length ? `<p class="label">当前最活跃的社会脚本</p><h3>${top.map(item => item.name).join('、')}</h3><p class="copy">它们可能曾经保护过你，只是现在有些声音占得太满。</p>` : '<h3>你的负面集体潜意识整体已经比较松动</h3><p class="copy">这次没有发现明显会持续替你做决定的社会脚本。</p>';
      const stateNames = { deciding: '它现在仍然很容易替你做决定', automatic: '你理智上不太相信，但它还会自动出现', believed: '你仍然认同它，但目前没有明显困住你', loose: '这条声音已经很难替你做决定' };
      const triggerGuides = {
        eat_hard: '当工作变得更轻松、收入提高、找到自动化方法，或者你终于可以休息时，你可能会开始怀疑：这么轻松真的算数吗？',
        no_fall_behind: '当同龄人升职、创业，或你看到新的技术和行业趋势时，你可能会突然觉得自己是不是落后了，想马上增加新的计划。',
        please_people: '当重要的人冷淡、失望、拒绝你，或者你需要提出自己的要求时，你可能会先检查是不是自己太难相处。',
        age_expiry: '当生日、照镜子、恋爱相亲、生育或换工作让你想到年龄时，你可能会把一个本来可以慢慢想的决定，感受到很强的时间压力。',
        wrong_step: '当你要换工作、选城市、分手、结婚、创业或做一笔大消费时，你可能会反复寻找“绝对正确”的答案，迟迟不敢开始。',
        stable_is_proper: '当你考虑辞职、副业、自由职业、创业或非传统生活时，你可能会先担心别人觉得这不够正经，而不是先看现实证据。',
        busy_is_valid: '当周末、放假、生病或一段时间没有明确安排时，你可能会把休息理解成浪费，忍不住重新找事情做。',
        independent_woman: '当你生病、情绪低落、需要协作或有人主动照顾你时，你可能会条件反射地说“我自己来”，很难真的把事情交出去。',
        worthy_first: '当你要涨价、求职、发作品、谈薪、进入新圈层、开始恋爱，甚至只是想穿喜欢的衣服、买喜欢的东西或好好休息时，你可能会先问自己：我现在够资格吗？',
        approval_first: '当你做职业、婚姻、学历、收入、穿衣、生活方式、辞职、单身、买房或城市选择时，你可能会先想别人会怎么看，再想自己到底想不想。'
      };
      const triggerCopy = (id, trigger) => triggerGuides[id] || (trigger ? `比如${trigger.replace(/[。.]$/, '')}这些时刻，这条旧规则更容易出现。它可能只是让你突然犹豫、想再准备一下，或下意识把自己的需要往后放。` : '暂时没有补充说明。');
      $('results').innerHTML = top.map((item, index) => { const asset = item.asset || {}; return `<article class="result-item"><p class="label">TOP ${index + 1} · ${stateNames[item.state] || item.state}</p><div class="rule">${item.oldRule}</div><p class="copy">${asset.title || ''}</p><div class="asset-grid"><div class="asset"><strong>它什么时候容易出现</strong><p>${triggerCopy(item.id, asset.trigger)}</p></div><div class="asset"><strong>它曾经保护你什么</strong><p>${asset.protection || '暂时没有补充说明。'}</p></div><div class="asset"><strong>它现在可能卡住什么</strong><p>${asset.limit || '暂时没有补充说明。'}</p></div><div class="asset"><strong>你可以做一个小实验</strong><p>${asset.experiment || '暂时没有补充说明。'}</p></div></div></article>`; }).join('');
      show('result');
    };
    $('start').onclick = () => { state.questions = shuffledQuestions(); state.index = 0; state.answers = {}; state.confirmationIds = []; show('quiz'); renderQuestion(); };
    $('back').onclick = () => { if (state.index > 0) { state.index -= 1; renderQuestion(); } };
    $('next').onclick = () => {
      const q = state.questions[state.index];
      if (!state.answers[q.id]) { $('error').textContent = '请选择一个最接近你的答案。'; return; }
      if (state.index < state.questions.length - 1) { state.index += 1; renderQuestion(); return; }
      if (state.index === 29) {
        const initial = evaluate(state.answers);
        state.confirmationIds = initial.confirmationIds;
        state.questions = [...state.questions, ...CONFIRM_QUESTIONS.filter(question => state.confirmationIds.includes(question.id))];
        state.index += 1;
        renderQuestion();
        return;
      }
      const confirmations = Object.fromEntries(state.confirmationIds.map(id => [id, state.answers[id]]));
      renderResult(evaluate(state.answers, confirmations));
    };
    $('restart').onclick = () => show('intro');
  </script>
</body>
</html>
